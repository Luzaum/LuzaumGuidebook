<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Estratificação clínica de urgência das arritmias</title>
  <desc id="desc">Quatro níveis de prioridade: investigar, prioritário, urgente e emergência RECOVER.</desc>
  <rect width="1200" height="420" rx="32" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(30 40)">
      <rect width="270" height="340" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
      <text x="135" y="75" font-size="32" font-weight="700" fill="#166534">INVESTIGAR</text>
      <text x="135" y="125" font-size="21" fill="#14532d">Paciente estável</text>
      <text x="135" y="175" font-size="20" fill="#14532d">ECG + causa de base</text>
      <text x="135" y="220" font-size="20" fill="#14532d">Holter se intermitente</text>
      <text x="135" y="285" font-size="18" fill="#166534">Acompanhamento orientado</text>
    </g>
    <g transform="translate(320 40)">
      <rect width="270" height="340" rx="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="4"/>
      <text x="135" y="75" font-size="30" font-weight="700" fill="#854d0e">PRIORITÁRIO</text>
      <text x="135" y="125" font-size="21" fill="#713f12">Ectopia frequente</text>
      <text x="135" y="175" font-size="20" fill="#713f12">Síncope ou cardiopatia</text>
      <text x="135" y="220" font-size="20" fill="#713f12">Avaliação no mesmo dia</text>
      <text x="135" y="285" font-size="18" fill="#854d0e">Monitorar perfusão e PA</text>
    </g>
    <g transform="translate(610 40)">
      <rect width="270" height="340" rx="24" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
      <text x="135" y="75" font-size="32" font-weight="700" fill="#9a3412">URGENTE</text>
      <text x="135" y="125" font-size="21" fill="#7c2d12">Baixo débito / VT com pulso</text>
      <text x="135" y="175" font-size="20" fill="#7c2d12">Oxigênio + acesso IV</text>
      <text x="135" y="220" font-size="20" fill="#7c2d12">ECG e PA contínuos</text>
      <text x="135" y="285" font-size="18" fill="#9a3412">Tratar ritmo e causa</text>
    </g>
    <g transform="translate(900 40)">
      <rect width="270" height="340" rx="24" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
      <text x="135" y="75" font-size="30" font-weight="700" fill="#991b1b">EMERGÊNCIA</text>
      <text x="135" y="125" font-size="21" fill="#7f1d1d">VF / VT sem pulso</text>
      <text x="135" y="175" font-size="20" fill="#7f1d1d">BLS de alta qualidade</text>
      <text x="135" y="220" font-size="20" fill="#7f1d1d">Desfibrilação + ALS</text>
      <text x="135" y="285" font-size="18" font-weight="700" fill="#991b1b">RECOVER 2024</text>
    </g>
  </g>
</svg>
