<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_traxonolgeolab100mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="cardShadow_traxonolgeolab100mg" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.14"/>
    </filter>
  </defs>
  
  <rect width="420" height="440" rx="24" fill="url(#bg_traxonolgeolab100mg)"/>
  
  <!-- Main Pharmaceutical Presentation Card -->
  <g transform="translate(25, 20)" filter="url(#cardShadow_traxonolgeolab100mg)">
    <rect width="370" height="400" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Top Accent Banner -->
    <rect width="370" height="12" rx="8" fill="#0891b2"/>
    
    <!-- Category Badge -->
    <g transform="translate(20, 24)">
      <rect width="330" height="26" rx="6" fill="#0891b2" fill-opacity="0.14"/>
      <text x="165" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0e7490" text-anchor="middle" letter-spacing="1">
        ANTIFÚNGICO SISTÊMICO
      </text>
    </g>
    
    <!-- Packaging Illustration Section -->
    <g transform="translate(45, 0)">
      
    <g transform="translate(45, 75)">
      <!-- 3D style carton -->
      <rect x="10" y="0" width="170" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="10" y="0" width="170" height="28" rx="8" fill="#0891b2"/>
      <!-- Brand accent badge inside box -->
      <circle cx="35" cy="14" r="7" fill="#ffffff" fill-opacity="0.25"/>
      <path d="M32 14 h6 M35 11 v6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="95" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ESPECIALIDADE FARMACÊUTICA</text>
      <!-- Tarja Vermelha -->
      <rect x="10" y="45" width="170" height="26" fill="#dc2626"/>
      <text x="95" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">VENDA SOB PRESCRIÇÃO MÉDICA</text>
      <text x="95" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#ffffff" text-anchor="middle">OU MÉDICO-VETERINÁRIA</text>
      <!-- Blister capsules preview -->
      <g transform="translate(30, 85)">
        <rect x="0" y="0" width="24" height="14" rx="7" fill="#0891b2" fill-opacity="0.3"/>
        <rect x="35" y="0" width="24" height="14" rx="7" fill="#0891b2" fill-opacity="0.3"/>
        <rect x="70" y="0" width="24" height="14" rx="7" fill="#0891b2" fill-opacity="0.3"/>
        <rect x="105" y="0" width="24" height="14" rx="7" fill="#0891b2" fill-opacity="0.3"/>
      </g>
    </g>
  
    </g>
    
    <!-- Product Identification Block -->
    <g transform="translate(20, 245)">
      <!-- Trade Name -->
      <text x="165" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle">
        Traxonol® 100 mg
      </text>
      
      <!-- Active Ingredient & Strength -->
      <text x="165" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0891b2" text-anchor="middle">
        Itraconazol 100 mg
      </text>
      
      <!-- Presentation / Volume -->
      <text x="165" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
        Similar Equivalente — 15 Cápsulas
      </text>
      
      <!-- Laboratory -->
      <text x="165" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">
        Geolab Farmacêutica
      </text>
    </g>
    
    <!-- Professional Rx Verification Footer -->
    <g transform="translate(20, 348)">
      <rect width="330" height="34" rx="8" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1.5"/>
      <text x="165" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">
        APRESENTAÇÃO FARMACÊUTICA VERIFICADA • USO CLÍNICO
      </text>
    </g>
  </g>
</svg>