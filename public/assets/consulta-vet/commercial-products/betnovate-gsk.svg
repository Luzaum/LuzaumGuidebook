<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_betnovategsk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="cardShadow_betnovategsk" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.14"/>
    </filter>
  </defs>
  
  <rect width="420" height="440" rx="24" fill="url(#bg_betnovategsk)"/>
  
  <!-- Main Pharmaceutical Presentation Card -->
  <g transform="translate(25, 20)" filter="url(#cardShadow_betnovategsk)">
    <rect width="370" height="400" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Top Accent Banner -->
    <rect width="370" height="12" rx="8" fill="#059669"/>
    
    <!-- Category Badge -->
    <g transform="translate(20, 24)">
      <rect width="330" height="26" rx="6" fill="#059669" fill-opacity="0.14"/>
      <text x="165" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1">
        CORTICOIDE TÓPICO POTENTE
      </text>
    </g>
    
    <!-- Packaging Illustration Section -->
    <g transform="translate(45, 0)">
      
    <!-- Aluminum / Laminate Tube Graphic -->
    <g transform="translate(45, 80)">
      <!-- Tube Body -->
      <path d="M40 0 L150 0 L140 100 L50 100 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="52" y="10" width="86" height="75" rx="4" fill="#059669" fill-opacity="0.12"/>
      <!-- Tube Stripe -->
      <rect x="43" y="45" width="104" height="12" fill="#059669"/>
      <text x="95" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">USO TÓPICO</text>
      <!-- Tube Nozzle and Cap -->
      <path d="M85 100 L105 100 L102 118 L88 118 Z" fill="#94a3b8"/>
      <rect x="80" y="118" width="30" height="22" rx="4" fill="#059669"/>
      <!-- Tube Crimped End -->
      <line x1="38" y1="0" x2="152" y2="0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    </g>
  
    </g>
    
    <!-- Product Identification Block -->
    <g transform="translate(20, 245)">
      <!-- Trade Name -->
      <text x="165" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle">
        Betnovate®
      </text>
      
      <!-- Active Ingredient & Strength -->
      <text x="165" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">
        Valerato de Betametasona 1 mg/g (0,1%)
      </text>
      
      <!-- Presentation / Volume -->
      <text x="165" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">
        Creme Dermatológico — Bisnaga 30 g
      </text>
      
      <!-- Laboratory -->
      <text x="165" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">
        GSK • GlaxoSmithKline
      </text>
    </g>
    
    <!-- Professional Rx Verification Footer -->
    <g transform="translate(20, 348)">
      <rect width="330" height="34" rx="8" fill="#f8fafc" stroke="#f1f5f9" stroke-width="1.5"/>
      <text x="165" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">
        APRESENTAÇÃO FARMACÊUTICA VERIFICADA • USO CLÍNICO
      </text>
    </g>
  </g>
</svg>