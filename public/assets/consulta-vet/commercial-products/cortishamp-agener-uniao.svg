<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Soft floor shadow -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0f172a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D cylindrical cap gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="22%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="78%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- 3D cylindrical bottle body gradient (Agener Derma Blue/Teal) -->
    <linearGradient id="bottleBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="18%" stop-color="#0284c7"/>
      <stop offset="38%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#0ea5e9"/>
      <stop offset="82%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Darker horizontal banner gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="38%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- White lower base 3D cylinder gradient -->
    <linearGradient id="whiteBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="42%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Emblem ring gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Clean white studio background -->
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- Floor shadow -->
  <ellipse cx="425" cy="735" rx="165" ry="26" fill="url(#floorShadow)"/>

  <!-- Bottle Cap (Ribbed White Agener Derma Cap) -->
  <g transform="translate(330, 62)">
    <!-- Top flip nub -->
    <path d="M52,12 Q70,-4 88,12 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Cap body -->
    <rect x="0" y="10" width="140" height="132" rx="10" fill="url(#capGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Vertical ribs -->
    <g stroke="#cbd5e1" stroke-width="1.4" opacity="0.75">
      <line x1="12" y1="14" x2="12" y2="136"/>
      <line x1="20" y1="14" x2="20" y2="136"/>
      <line x1="28" y1="14" x2="28" y2="136"/>
      <line x1="36" y1="14" x2="36" y2="136"/>
      <line x1="44" y1="14" x2="44" y2="136"/>
      <line x1="52" y1="14" x2="52" y2="136"/>
      <line x1="60" y1="14" x2="60" y2="136"/>
      <line x1="68" y1="14" x2="68" y2="136"/>
      <line x1="76" y1="14" x2="76" y2="136"/>
      <line x1="84" y1="14" x2="84" y2="136"/>
      <line x1="92" y1="14" x2="92" y2="136"/>
      <line x1="100" y1="14" x2="100" y2="136"/>
      <line x1="108" y1="14" x2="108" y2="136"/>
      <line x1="116" y1="14" x2="116" y2="136"/>
      <line x1="124" y1="14" x2="124" y2="136"/>
      <line x1="130" y1="14" x2="130" y2="136"/>
    </g>
    <!-- Neck ring -->
    <rect x="4" y="138" width="132" height="8" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Main Cylindrical Bottle Body -->
  <g transform="translate(275, 204)">
    <!-- Colored Upper Section -->
    <path d="M0,32 Q0,0 40,0 L210,0 Q250,0 250,32 L250,425 L0,425 Z" fill="url(#bottleBodyGrad)"/>

    <!-- Cylindrical vertical highlight -->
    <rect x="42" y="4" width="28" height="420" fill="#ffffff" opacity="0.16"/>

    <!-- Top Brand Header: AGENER DERMA / Dr. Clean -->
    <text x="125" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="2">
      AGENER DERMA
    </text>
    <text x="125" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-style="italic" font-weight="600" fill="#bae6fd" text-anchor="middle">
      Linha Dr. Clean
    </text>

    <!-- Vertical left accent line -->
    <line x1="22" y1="78" x2="22" y2="395" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>

    <!-- Product Name: CORTISHAMP -->
    <text x="128" y="114" font-family="'Segoe UI', Arial, sans-serif" font-size="31" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">
      CORTISHAMP<tspan font-size="14" dy="-12">®</tspan>
    </text>

    <!-- Sub-banner: XAMPU TERAPÊUTICO -->
    <rect x="23" y="132" width="227" height="52" fill="url(#bannerGrad)"/>
    <text x="34" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" fill="#ffffff" letter-spacing="0.5">
      XAMPU
    </text>
    <text x="122" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7dd3fc">
      HIDROCORTISONA 1%
    </text>
    <text x="122" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#e0f2fe">
      PARA CÃES E GATOS
    </text>
    <text x="34" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="400" fill="#bae6fd" letter-spacing="0.3">
      ALÍVIO DO PRURIDO E INFLAMAÇÃO CUTÂNEA
    </text>

    <!-- Central Circular Seal (Queratina + Lipossomas + Hidrocortisona) -->
    <g transform="translate(125, 265)">
      <circle cx="0" cy="0" r="60" fill="#ffffff" opacity="0.95" stroke="#7dd3fc" stroke-width="3"/>
      <circle cx="0" cy="0" r="46" fill="url(#emblemGrad)"/>
      <!-- Soothing droplet + skin barrier waves -->
      <path d="M0,-24 C12,-6 18,4 18,13 C18,23 10,30 0,30 C-10,30 -18,23 -18,13 C-18,4 -12,-6 0,-24 Z" fill="#e0f2fe"/>
      <path d="M-4,-12 C4,-2 8,5 8,12 C8,18 4,22 -2,22" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Top & bottom curved text labels inside seal -->
      <text x="0" y="-49" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">
        • QUERATINA HIDROLISADA •
      </text>
      <text x="0" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">
        • LIPOSSOMAS &amp; ÔMEGAS •
      </text>
    </g>

    <!-- Lower Left Indications Text -->
    <text x="32" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#e0f2fe">
      Acetato de Hidrocortisona 1%
    </text>
    <text x="32" y="381" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="400" fill="#bae6fd">
      Vitaminas A, C, E + Ômegas 3 e 6
    </text>
    <text x="32" y="396" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#ffffff">
      USO EXTERNO • USO VETERINÁRIO
    </text>

    <!-- Dog & Cat Medallion on Right -->
    <g transform="translate(212, 376)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#e0f2fe" stroke-width="1.8"/>
      <path d="M-8,6 Q-8,-8 2,-8 Q9,-8 10,-2 Q12,4 6,10 Z" fill="#e0f2fe" opacity="0.88"/>
      <circle cx="-2" cy="4" r="6" fill="#0284c7"/>
    </g>

    <!-- White Lower Base Section -->
    <path d="M0,425 L250,425 L250,502 Q250,528 215,528 L35,528 Q0,528 0,502 Z" fill="url(#whiteBaseGrad)"/>

    <!-- Volume 125 mL -->
    <text x="26" y="476" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0284c7">
      Conteúdo:
    </text>
    <text x="26" y="498" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#0369a1">
      125 mL
    </text>

    <!-- Agener União Logo on Bottom Right -->
    <g transform="translate(148, 456)">
      <ellipse cx="18" cy="18" rx="22" ry="14" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-dasharray="95 35"/>
      <text x="16" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="900" fill="#0f172a">
        AGENER
      </text>
      <text x="25" y="29" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" fill="#0f172a">
        UNIÃO
      </text>
      <text x="12" y="41" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.8">
        SAÚDE ANIMAL
      </text>
    </g>
  </g>
</svg>
