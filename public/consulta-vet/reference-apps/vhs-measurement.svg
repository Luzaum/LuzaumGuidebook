<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Como medir o VHS em uma radiografia lateral</title>
  <desc id="desc">Esquema original de um tórax lateral com eixo longo e eixo curto do coração, depois transpostos a partir da borda cranial de T4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172e"/>
      <stop offset="1" stop-color="#102f4d"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".88"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity=".58"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" rx="36" fill="url(#bg)"/>
  <path d="M92 124 C218 72 454 72 650 118 C762 144 842 220 866 328" fill="none" stroke="#b8d7ea" stroke-width="14" stroke-linecap="round" opacity=".72"/>
  <g fill="#d9edf7" opacity=".82">
    <rect x="114" y="88" width="44" height="29" rx="10"/><rect x="163" y="82" width="44" height="30" rx="10"/>
    <rect x="212" y="80" width="44" height="30" rx="10"/><rect x="261" y="81" width="44" height="30" rx="10"/>
    <rect x="310" y="84" width="44" height="30" rx="10"/><rect x="359" y="89" width="44" height="30" rx="10"/>
    <rect x="408" y="96" width="44" height="30" rx="10"/><rect x="457" y="104" width="44" height="30" rx="10"/>
    <rect x="506" y="113" width="44" height="30" rx="10"/><rect x="555" y="123" width="44" height="30" rx="10"/>
  </g>
  <g fill="none" stroke="#81b4cf" stroke-width="7" opacity=".43">
    <path d="M180 116 Q126 248 174 403"/><path d="M230 112 Q173 260 222 421"/><path d="M280 112 Q224 266 278 432"/>
    <path d="M330 116 Q276 270 337 437"/><path d="M380 121 Q331 276 399 439"/><path d="M430 128 Q390 282 463 435"/>
    <path d="M480 136 Q450 288 527 424"/><path d="M530 145 Q511 289 590 405"/>
  </g>
  <path d="M366 259 C366 211 423 188 455 224 C488 180 556 205 556 261 C556 326 462 378 462 378 C462 378 366 325 366 259Z" fill="url(#heart)" stroke="#fda4af" stroke-width="5" filter="url(#glow)"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M402 218 L500 357" stroke="#67e8f9" stroke-width="8"/>
    <path d="M381 309 L532 252" stroke="#fde68a" stroke-width="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="488" y="373" fill="#67e8f9" font-size="28">L</text>
    <text x="542" y="253" fill="#fde68a" font-size="28">S</text>
    <path d="M270 78 V58" stroke="#fb7185" stroke-width="4"/>
    <text x="253" y="47" fill="#fecdd3" font-size="23">T4</text>
  </g>
  <g transform="translate(650 72)">
    <rect width="254" height="364" rx="24" fill="#071426" fill-opacity=".74" stroke="#75c9e8" stroke-opacity=".35"/>
    <text x="24" y="42" fill="#e7f6ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Transponha em T4</text>
    <g fill="#d9edf7" opacity=".78">
      <rect x="28" y="70" width="25" height="25" rx="7"/><rect x="57" y="70" width="25" height="25" rx="7"/><rect x="86" y="70" width="25" height="25" rx="7"/>
      <rect x="115" y="70" width="25" height="25" rx="7"/><rect x="144" y="70" width="25" height="25" rx="7"/><rect x="173" y="70" width="25" height="25" rx="7"/>
    </g>
    <path d="M28 128 H189" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
    <text x="205" y="136" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">L</text>
    <g fill="#d9edf7" opacity=".78">
      <rect x="28" y="164" width="25" height="25" rx="7"/><rect x="57" y="164" width="25" height="25" rx="7"/><rect x="86" y="164" width="25" height="25" rx="7"/>
      <rect x="115" y="164" width="25" height="25" rx="7"/><rect x="144" y="164" width="25" height="25" rx="7"/><rect x="173" y="164" width="25" height="25" rx="7"/>
    </g>
    <path d="M28 222 H163" stroke="#fde68a" stroke-width="7" stroke-linecap="round"/>
    <text x="178" y="230" fill="#fde68a" font-family="Arial, sans-serif" font-size="22" font-weight="700">S</text>
    <rect x="23" y="264" width="208" height="70" rx="16" fill="#0e7490" fill-opacity=".28" stroke="#22d3ee" stroke-opacity=".55"/>
    <text x="127" y="294" text-anchor="middle" fill="#cffafe" font-family="Arial, sans-serif" font-size="20" font-weight="700">VHS = L + S</text>
    <text x="127" y="319" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="15">arredonde para 0,1 v</text>
  </g>
  <text x="68" y="486" fill="#d7eaf5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Radiografia lateral bem posicionada</text>
  <text x="68" y="512" fill="#9fc3d7" font-family="Arial, sans-serif" font-size="16">Eixo longo da carina ao ápice; eixo curto perpendicular na maior largura.</text>
</svg>
