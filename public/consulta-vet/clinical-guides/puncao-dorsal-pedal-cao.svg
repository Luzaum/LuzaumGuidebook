<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-labelledby="title-dorsal desc-dorsal">
  <title id="title-dorsal">Punção da Artéria Dorsal Pedal em Cães — Guia Técnico Vetius</title>
  <desc id="desc-dorsal">Diagrama técnico da anatomia e punção da artéria dorsal pedal (metatarsal dorsal) em cão em decúbito lateral, mostrando o arco tarsometatarsal, metatarsos II e III e angulação da agulha.</desc>
  
  <defs>
    <linearGradient id="bgGradDorsal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="arteryGradDorsal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <linearGradient id="needleGradDorsal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="glowArteryDorsal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadowDorsal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pulse-dorsal { animation: pulseDorsal 2s infinite ease-in-out; transform-origin: 325px 230px; }
    @keyframes pulseDorsal {
      0% { r: 5px; opacity: 0.9; }
      50% { r: 14px; opacity: 0.35; }
      100% { r: 22px; opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="520" rx="20" fill="url(#bgGradDorsal)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay subtle -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,65 L800,65 M0,130 L800,130 M0,195 L800,195 M0,260 L800,260 M0,325 L800,325 M0,390 L800,390 M0,455 L800,455" />
    <path d="M100,0 L100,520 M200,0 L200,520 M300,0 L300,520 M400,0 L400,520 M500,0 L500,520 M600,0 L600,520 M700,0 L700,520" />
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="125" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <text x="62.5" y="15" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700" letter-spacing="0.1em" class="font-sans">ACESSO CANINO</text>
    
    <text x="140" y="16" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Artéria Dorsal Pedal / Metatarsal Dorsal (1ª Escolha no Cão)</text>
    <text x="0" y="38" fill="#94a3b8" font-size="12" class="font-sans">Palpação imediatamente distal ao jarrete/tarso, entre o II e III metatarsos; membro voltado para a mesa</text>
  </g>

  <!-- Anatomical Illustration of Canine Paw & Tarsus -->
  <g transform="translate(20, 45)">
    <!-- Distal Tibia, Hock and Paw Contour -->
    <path d="M 120,80 L 160,80 C 170,120 185,150 200,170 C 230,160 250,175 270,195 C 310,210 380,240 430,290 C 460,325 465,360 440,385 C 410,410 360,400 320,360 C 280,310 240,260 200,240 C 170,220 145,170 120,80 Z"
          fill="url(#pawGrad)" stroke="#475569" stroke-width="2" opacity="0.95" />

    <!-- Tarsal Bones / Calcaneus hint (Bony landmarks) -->
    <ellipse cx="205" cy="180" rx="20" ry="14" fill="#64748b" opacity="0.25" />
    <text x="145" y="195" fill="#94a3b8" font-size="10.5" font-weight="600" class="font-sans">Jarrete / Tarso</text>
    <path d="M 190,190 L 205,182" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2 2" />

    <!-- Metatarsal II and III phantom bones -->
    <line x1="260" y1="205" x2="380" y2="295" stroke="#64748b" stroke-width="7" stroke-linecap="round" opacity="0.25" stroke-dasharray="3 3" />
    <line x1="280" y1="195" x2="400" y2="285" stroke="#64748b" stroke-width="7" stroke-linecap="round" opacity="0.25" stroke-dasharray="3 3" />
    <text x="365" y="325" fill="#94a3b8" font-size="10" font-style="italic" class="font-sans">Metatarsos II e III</text>

    <!-- Dorsal Pedal Artery Line (Superficial, pulsatile) -->
    <path d="M 180,120 C 205,160 235,185 270,205 C 310,225 360,255 415,295" 
          stroke="url(#arteryGradDorsal)" stroke-width="7.5" stroke-linecap="round" filter="url(#glowArteryDorsal)" />
    
    <!-- Metatarsal Branches -->
    <path d="M 415,295 C 430,315 440,340 445,365" stroke="url(#arteryGradDorsal)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 415,295 C 410,325 405,350 400,370" stroke="url(#arteryGradDorsal)" stroke-width="4" stroke-linecap="round" opacity="0.8" />

    <!-- Pulse target point -->
    <circle cx="325" cy="235" r="7" fill="#ef4444" fill-opacity="0.6" />
    <circle cx="325" cy="235" r="14" stroke="#ef4444" stroke-width="1.5" class="pulse-dorsal" fill="none" />

    <!-- Finger palpation guide (Gentle touch without occlusion) -->
    <g transform="translate(295, 150)">
      <rect x="0" y="0" width="20" height="58" rx="10" fill="#f8fafc" fill-opacity="0.88" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="10" y="35" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="800" class="font-sans">D1</text>
      
      <rect x="25" y="4" width="20" height="58" rx="10" fill="#f8fafc" fill-opacity="0.88" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="35" y="39" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="800" class="font-sans">D2</text>

      <text x="22" y="-12" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700" class="font-sans">Mira tátil dos dedos</text>
      <path d="M 22,-6 L 22,2" stroke="#e2e8f0" stroke-width="1" />
    </g>

    <!-- Needle and Syringe entering at 30-60 degrees -->
    <g transform="translate(325, 235) rotate(-45)">
      <!-- Needle shaft -->
      <line x1="0" y1="0" x2="-85" y2="0" stroke="url(#needleGradDorsal)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Needle bevel tip (bevel up) -->
      <polygon points="0,0 -8,-3 -6,0 -8,3" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#ef4444" />
      
      <!-- Needle Hub (22G blue / 25G orange) -->
      <rect x="-98" y="-6" width="14" height="12" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
      <text x="-91" y="2" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="800" class="font-sans">22G</text>
      
      <!-- Syringe Barrel -->
      <rect x="-180" y="-10" width="82" height="20" rx="3" fill="#0ea5e9" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Pulsatile blood filling -->
      <rect x="-135" y="-8" width="37" height="16" rx="2" fill="#ef4444" fill-opacity="0.85" />
      <!-- Graduations -->
      <line x1="-165" y1="-10" x2="-165" y2="-4" stroke="#ffffff" stroke-width="1" />
      <line x1="-155" y1="-10" x2="-155" y2="-4" stroke="#ffffff" stroke-width="1" />
      <line x1="-145" y1="-10" x2="-145" y2="-4" stroke="#ffffff" stroke-width="1" />
      <!-- Plunger -->
      <rect x="-210" y="-5" width="30" height="10" fill="#94a3b8" />
      <rect x="-215" y="-12" width="5" height="24" rx="2" fill="#cbd5e1" />
    </g>

    <!-- Angle indicator (30° - 60°) -->
    <g transform="translate(325, 235)">
      <path d="M -48,0 A 48 48 0 0 0 -34,-34" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" />
      <text x="-65" y="-18" fill="#38bdf8" font-size="11" font-weight="800" class="font-sans">30°–60°</text>
      <text x="-80" y="-4" fill="#93c5fd" font-size="9" class="font-sans">Bisel voltado p/ cima</text>
    </g>

    <!-- Digits reference -->
    <text x="440" y="415" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">Dígitos do membro pélvico</text>
  </g>

  <!-- Right Side: Key Clinical Highlights Cards -->
  <g transform="translate(540, 105)">
    <!-- Card 1: Por que é a 1ª escolha? -->
    <g filter="url(#cardShadowDorsal)">
      <rect x="0" y="0" width="230" height="108" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="108" rx="2" fill="#10b981" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Vantagens da Dorsal Pedal</text>
      <text x="14" y="42" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">Superficial e Periférica</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10" class="font-sans">• Longe de feixes nobres viscerais</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10" class="font-sans">• Fácil compressão contra o osso</text>
      <text x="14" y="94" fill="#a7f3d0" font-size="9.5" class="font-sans">Hematoma contido com firmeza</text>
    </g>

    <!-- Card 2: Segredos de Posicionamento -->
    <g transform="translate(0, 120)" filter="url(#cardShadowDorsal)">
      <rect x="0" y="0" width="230" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#0ea5e9" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Posicionamento Perfeito</text>
      <text x="14" y="42" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">Membro puncionado para baixo</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10" class="font-sans">• Apoio firme na mesa de exame</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10" class="font-sans">• Auxiliar afasta o membro de cima</text>
      <text x="14" y="92" fill="#cbd5e1" font-size="10" class="font-sans">• Leve rotação externa evidencia pulso</text>
      <text x="14" y="108" fill="#fbbf24" font-size="9" class="font-sans">Não garrotear a região proximal!</text>
    </g>

    <!-- Card 3: Regra de Ouro Pós-Punção -->
    <g transform="translate(0, 248)" filter="url(#cardShadowDorsal)">
      <rect x="0" y="0" width="230" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#f59e0b" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Regra Pós-Punção</text>
      <text x="14" y="42" fill="#fbbf24" font-size="11" font-weight="700" class="font-sans">5 MINUTOS NO RELÓGIO</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10" class="font-sans">• Compressão digital firme contínua</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10" class="font-sans">• Evita hematomas e trombose</text>
      <text x="14" y="92" fill="#cbd5e1" font-size="10" class="font-sans">• Bandagem leve se necessário (30 min)</text>
      <text x="14" y="108" fill="#fef08a" font-size="9" font-weight="600" class="font-sans">Nunca transformar bandagem em garrote</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="740" height="28" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <circle cx="16" cy="14" r="5" fill="#ef4444" />
    <text x="26" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Artéria Dorsal Pedal / Metatarsal Dorsal (palpação focal distal ao jarrete)</text>

    <circle cx="390" cy="14" r="5" fill="#38bdf8" />
    <text x="400" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Ângulo 30°–60° | Bisel voltado para cima</text>

    <circle cx="630" cy="14" r="5" fill="#10b981" />
    <text x="640" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Autoenchimento arterial</text>
  </g>
</svg>
