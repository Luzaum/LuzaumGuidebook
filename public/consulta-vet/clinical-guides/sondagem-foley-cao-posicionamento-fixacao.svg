<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bgGrad2)" />

  <!-- Header -->
  <g id="header2" transform="translate(40, 24)">
    <rect width="920" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)" />
    <circle cx="36" cy="32" r="18" fill="#10b981" fill-opacity="0.2" />
    <path d="M26,32 L46,32 M36,22 L36,42" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <text x="70" y="29" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">
      Cateter Foley no Cão Macho: Insuflação Segura do Balão &amp; Sistema Fechado
    </text>
    <text x="70" y="49" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
      As 3 fases do balonete, prevenção de rotura uretral e montagem asséptica (BSAVA 2024 / ISCAID)
    </text>
  </g>

  <!-- Upper Section: 3 Stages of the Balloon -->
  <g id="balloon-stages" transform="translate(40, 104)">
    <rect width="920" height="265" rx="12" fill="url(#panelGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)" />

    <!-- Stage 1: Fatal Error -->
    <g transform="translate(20, 20)">
      <rect width="280" height="225" rx="10" fill="#450a0a" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.5" />
      <rect x="12" y="12" width="175" height="24" rx="6" fill="#ef4444" />
      <text x="100" y="28" fill="#ffffff" font-size="11" font-weight="800" font-family="system-ui" text-anchor="middle">❌ ERRO CATASTRÓFICO</text>

      <text x="12" y="52" fill="#fca5a5" font-size="12" font-weight="700" font-family="system-ui">1. Insuflação Intrauretral</text>

      <!-- Narrow urethra schematic with overdistended balloon tearing wall -->
      <rect x="30" y="70" width="220" height="30" rx="4" fill="#334155" />
      <text x="140" y="88" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui">Uretra estreita (diâmetro ~3 mm)</text>

      <!-- Rupturing balloon -->
      <circle cx="140" cy="85" r="28" fill="#ef4444" fill-opacity="0.6" stroke="#f87171" stroke-width="2.5" />
      <!-- Crack lines -->
      <path d="M120,60 L135,70 M155,60 L145,72 M120,110 L132,98 M160,110 L148,98" stroke="#fecaca" stroke-width="2" />

      <rect x="12" y="130" width="256" height="80" rx="6" fill="#7f1d1d" fill-opacity="0.7" />
      <text x="20" y="148" fill="#fecaca" font-size="11" font-weight="700" font-family="system-ui">Consequências Graves:</text>
      <text x="20" y="165" fill="#fca5a5" font-size="10" font-family="system-ui">• Dilaceração radial da mucosa uretral</text>
      <text x="20" y="180" fill="#fca5a5" font-size="10" font-family="system-ui">• Falsa via e hemorragia volumosa</text>
      <text x="20" y="195" fill="#fca5a5" font-size="10" font-family="system-ui">• Estenose fibrótica cicatricial tardia</text>
    </g>

    <!-- Stage 2: Correct Safe Advance -->
    <g transform="translate(320, 20)">
      <rect width="280" height="225" rx="10" fill="#1e1b4b" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="12" y="12" width="165" height="24" rx="6" fill="#0284c7" />
      <text x="95" y="28" fill="#ffffff" font-size="11" font-weight="800" font-family="system-ui" text-anchor="middle">⚠️ AVANÇO SEGURO</text>

      <text x="12" y="52" fill="#7dd3fc" font-size="12" font-weight="700" font-family="system-ui">2. Balão Livre na Bexiga</text>

      <!-- Bladder outline -->
      <path d="M40,75 C40,65 140,60 220,70 C240,110 230,130 190,135 L120,135 C70,135 40,115 40,75 Z" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
      <text x="175" y="95" fill="#bae6fd" font-size="11" font-family="system-ui">Lúmen vesical</text>

      <!-- Deflated catheter inside -->
      <line x1="20" y1="135" x2="150" y2="100" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
      <ellipse cx="140" cy="103" rx="8" ry="4" fill="#94a3b8" />

      <rect x="12" y="145" width="256" height="65" rx="6" fill="#0c4a6e" fill-opacity="0.7" />
      <text x="20" y="163" fill="#e0f2fe" font-size="11" font-weight="700" font-family="system-ui">Conduta Obrigatória:</text>
      <text x="20" y="180" fill="#bae6fd" font-size="10" font-family="system-ui">• Ao fluir urina, avançar +2 a 4 cm</text>
      <text x="20" y="195" fill="#bae6fd" font-size="10" font-family="system-ui">• Retirar estilete segurando a sonda!</text>
    </g>

    <!-- Stage 3: Inflation and Gentle Traction -->
    <g transform="translate(620, 20)">
      <rect width="280" height="225" rx="10" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1.5" />
      <rect x="12" y="12" width="160" height="24" rx="6" fill="#10b981" />
      <text x="92" y="28" fill="#ffffff" font-size="11" font-weight="800" font-family="system-ui" text-anchor="middle">✅ POSIÇÃO FINAL</text>

      <text x="12" y="52" fill="#6ee7b7" font-size="12" font-weight="700" font-family="system-ui">3. Insuflação &amp; Apoio no Colo</text>

      <!-- Bladder with inflated balloon resting at bladder neck -->
      <path d="M40,75 C40,65 140,60 220,70 C240,110 230,130 140,135 L90,135 C60,135 40,115 40,75 Z" fill="#065f46" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" />
      
      <!-- Inflated balloon at neck -->
      <circle cx="130" cy="115" r="16" fill="#34d399" fill-opacity="0.7" stroke="#10b981" stroke-width="2" />
      <line x1="20" y1="135" x2="120" y2="120" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />

      <rect x="12" y="145" width="256" height="65" rx="6" fill="#064e3b" fill-opacity="0.8" />
      <text x="20" y="163" fill="#d1fae5" font-size="11" font-weight="700" font-family="system-ui">Passos Finais:</text>
      <text x="20" y="180" fill="#a7f3d0" font-size="10" font-family="system-ui">• Insuflar com ÁGUA ESTÉRIL (não salina)</text>
      <text x="20" y="195" fill="#a7f3d0" font-size="10" font-family="system-ui">• Recuar devagar até resistência suave</text>
    </g>
  </g>

  <!-- Lower Section: Closed System and Secure Fixation -->
  <g id="closed-system" transform="translate(40, 385)">
    <rect width="920" height="215" rx="12" fill="url(#panelGrad2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)" />

    <!-- Left: Fixation Detail -->
    <g transform="translate(20, 18)">
      <rect width="425" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" fill="#f59e0b" font-size="13" font-weight="700" font-family="system-ui">
        FIXAÇÃO ATRAUMÁTICA COM FITA BORBOLETA
      </text>
      <text x="16" y="52" fill="#cbd5e1" font-size="11" font-family="system-ui">
        • Colocar fita esparadrapo dobrada ("borboleta") sobre a sonda externa.
      </text>
      <text x="16" y="72" fill="#cbd5e1" font-size="11" font-family="system-ui">
        • Suturar as asas da fita na pele prepucial com fio monofilamentar (nylon 3-0).
      </text>
      <text x="16" y="92" fill="#ef4444" font-size="11" font-weight="600" font-family="system-ui">
        ❌ NUNCA passe o ponto através da borracha da sonda (oclusão ou perfuração).
      </text>
      <text x="16" y="112" fill="#ef4444" font-size="11" font-weight="600" font-family="system-ui">
        ❌ NUNCA estrangule o prepúcio/glande com nós circulares apertados.
      </text>
      <text x="16" y="142" fill="#38bdf8" font-size="11" font-style="italic" font-family="system-ui">
        Colar elizabetano obrigatório para impedir remoção acidental pelo cão!
      </text>
    </g>

    <!-- Right: Closed Drainage System -->
    <g transform="translate(475, 18)">
      <rect width="425" height="180" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" fill="#34d399" font-size="13" font-weight="700" font-family="system-ui">
        SISTEMA FECHADO &amp; PREVENÇÃO DE CAUTI (ISCAID)
      </text>
      <text x="16" y="52" fill="#cbd5e1" font-size="11" font-family="system-ui">
        • Manter circuito 100% fechado da bexiga à bolsa coletora com válvula antirrefluxo.
      </text>
      <text x="16" y="72" fill="#cbd5e1" font-size="11" font-family="system-ui">
        • Bolsa coletora SEMPRE suspensa ABAIXO do nível da bexiga (fluxo por gravidade).
      </text>
      <text x="16" y="92" fill="#cbd5e1" font-size="11" font-family="system-ui">
        • JAMAIS permitir que a bolsa ou o tubo fiquem em contato com o chão da baia.
      </text>
      <text x="16" y="112" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui">
        ⚠️ NÃO usar antibióticos profiláticos empíricos (geram multirresistência).
      </text>
      <text x="16" y="142" fill="#a7f3d0" font-size="11" font-style="italic" font-family="system-ui">
        Reavaliar diariamente a real necessidade clínica de permanência da sonda.
      </text>
    </g>
  </g>
</svg>