<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-labelledby="title-femoral desc-femoral">
  <title id="title-femoral">Punção Arterial Femoral em Gatos — Guia Técnico Vetius</title>
  <desc id="desc-femoral">Diagrama anatômico e técnico da punção da artéria femoral em felinos em decúbito lateral, mostrando o feixe femoral, posição dos dedos e angulação da agulha de 30 a 45 graus.</desc>
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="limbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="arteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="glowArtery" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pulse-anim { animation: pulse 2s infinite ease-in-out; transform-origin: 395px 235px; }
    @keyframes pulse {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 15px; opacity: 0.3; }
      100% { r: 24px; opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="520" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid overlay subtle -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,65 L800,65 M0,130 L800,130 M0,195 L800,195 M0,260 L800,260 M0,325 L800,325 M0,390 L800,390 M0,455 L800,455" />
    <path d="M100,0 L100,520 M200,0 L200,520 M300,0 L300,520 M400,0 L400,520 M500,0 L500,520 M600,0 L600,520 M700,0 L700,520" />
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />
    <text x="65" y="15" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="0.1em" class="font-sans">ACESSO FELINO</text>
    
    <text x="145" y="16" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Punção da Artéria Femoral (Decúbito Lateral Confortável)</text>
    <text x="0" y="38" fill="#94a3b8" font-size="12" class="font-sans">Visualização anatômica da fossa femoral medial, posicionamento tátil dos dedos e inserção da agulha 25G</text>
  </g>

  <!-- Anatomical Illustration Area -->
  <!-- Cat Pelvic Limb Silhouette (Medial aspect of dependent / exposed thigh) -->
  <g transform="translate(10, 30)">
    <!-- Pelvis & Inguinal contour -->
    <path d="M 120,130 C 160,110 240,115 280,140 C 330,170 380,190 440,210 C 500,230 550,250 590,300 C 620,340 610,380 570,400 C 540,410 490,390 450,350 C 400,300 350,280 290,260 C 230,240 180,220 140,240 C 100,260 80,230 90,190 Z" 
          fill="url(#limbGrad)" stroke="#475569" stroke-width="2" opacity="0.9" />

    <!-- Femur Bone Schematic (Inner phantom) -->
    <path d="M 180,160 Q 280,210 390,270" stroke="#64748b" stroke-width="14" stroke-linecap="round" opacity="0.3" stroke-dasharray="4 6" />
    <text x="250" y="195" fill="#64748b" font-size="10" font-style="italic" class="font-sans">Fêmur (profundo)</text>

    <!-- Inguinal Ligament / Ring indicator -->
    <path d="M 170,140 C 185,165 200,190 205,210" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" />
    <text x="140" y="130" fill="#fbbf24" font-size="11" font-weight="700" class="font-sans">Região Inguinal</text>

    <!-- Femoral Vein (Runs caudal to the artery) -->
    <path d="M 195,160 C 265,195 330,235 415,285" stroke="url(#veinGrad)" stroke-width="7" stroke-linecap="round" opacity="0.75" />
    <text x="435" y="305" fill="#60a5fa" font-size="11" font-weight="700" class="font-sans">Veia Femoral (caudal)</text>
    <path d="M 430,300 L 400,280" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="2 2" />

    <!-- Femoral Artery (Pulsatile, highlighted) -->
    <path d="M 185,150 C 255,185 320,225 405,275" stroke="url(#arteryGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glowArtery)" />
    
    <!-- Blood flow direction markers on artery -->
    <polygon points="260,183 270,188 262,193" fill="#ffffff" opacity="0.9" />
    <polygon points="330,223 340,228 332,233" fill="#ffffff" opacity="0.9" />

    <!-- Pulse target point -->
    <circle cx="340" cy="235" r="8" fill="#ef4444" fill-opacity="0.5" />
    <circle cx="340" cy="235" r="16" stroke="#ef4444" stroke-width="1.5" class="pulse-anim" fill="none" />

    <!-- Two Fingers Palpating (Stylized Hands / Touch Guides) -->
    <g transform="translate(305, 140)">
      <!-- Index Finger -->
      <rect x="0" y="0" width="22" height="65" rx="11" fill="#f8fafc" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="11" y="40" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="800" class="font-sans">D1</text>
      
      <!-- Middle Finger -->
      <rect x="28" y="5" width="22" height="65" rx="11" fill="#f8fafc" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="39" y="45" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="800" class="font-sans">D2</text>
      
      <!-- Label palpation -->
      <path d="M 25,-15 L 25,-2" stroke="#e2e8f0" stroke-width="1.2" />
      <text x="25" y="-20" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700" class="font-sans">Dedos estabilizam o pulso</text>
      <text x="25" y="-8" text-anchor="middle" fill="#94a3b8" font-size="9" class="font-sans">(Sem comprimir/esmagar o vaso)</text>
    </g>

    <!-- Needle and Syringe entering at 30-45 degrees -->
    <g transform="translate(340, 235) rotate(-35)">
      <!-- Needle shaft -->
      <line x1="0" y1="0" x2="-80" y2="0" stroke="url(#needleGrad)" stroke-width="3" stroke-linecap="round" />
      
      <!-- Needle bevel tip (bevel up) -->
      <polygon points="0,0 -8,-3 -6,0 -8,3" fill="#ffffff" />
      <circle cx="0" cy="0" r="3" fill="#ef4444" />
      
      <!-- Needle Hub (plastic 25G orange) -->
      <rect x="-95" y="-6" width="15" height="12" rx="2" fill="#f97316" stroke="#c2410c" stroke-width="1" />
      <text x="-88" y="2" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="800" class="font-sans">25G</text>
      
      <!-- Syringe Barrel (Pico50 / Gasometry specialized) -->
      <rect x="-175" y="-10" width="80" height="20" rx="3" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Blood flash inside syringe -->
      <rect x="-125" y="-8" width="30" height="16" rx="2" fill="#ef4444" fill-opacity="0.8" />
      <!-- Syringe graduations -->
      <line x1="-155" y1="-10" x2="-155" y2="-4" stroke="#ffffff" stroke-width="1" />
      <line x1="-145" y1="-10" x2="-145" y2="-4" stroke="#ffffff" stroke-width="1" />
      <line x1="-135" y1="-10" x2="-135" y2="-4" stroke="#ffffff" stroke-width="1" />
      <!-- Plunger -->
      <rect x="-205" y="-5" width="30" height="10" fill="#94a3b8" />
      <rect x="-210" y="-12" width="5" height="24" rx="2" fill="#cbd5e1" />
    </g>

    <!-- Angle Indicator Arc (30° - 45°) -->
    <g transform="translate(340, 235)">
      <path d="M -50,0 A 50 50 0 0 0 -42,-28" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2" />
      <text x="-65" y="-12" fill="#4ade80" font-size="11" font-weight="800" class="font-sans">30°–45°</text>
      <text x="-82" y="2" fill="#86efac" font-size="9" class="font-sans">Bisel p/ cima</text>
    </g>

    <!-- Knee / Stifle schematic reference -->
    <circle cx="560" cy="330" r="18" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="560" y="365" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" class="font-sans">Joelho (distal)</text>
  </g>

  <!-- Right Side: Key Clinical Action Cards -->
  <g transform="translate(540, 110)">
    <!-- Card 1: Palpação Anatômica -->
    <g filter="url(#shadowBox)">
      <rect x="0" y="0" width="230" height="105" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="105" rx="2" fill="#ef4444" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">1. Localização Focal</text>
      <text x="14" y="42" fill="#cbd5e1" font-size="10.5" class="font-sans">Face medial proximal da coxa,</text>
      <text x="14" y="58" fill="#cbd5e1" font-size="10.5" class="font-sans">ventral à virilha e cranial à veia.</text>
      <text x="14" y="78" fill="#94a3b8" font-size="9.5" class="font-sans">A artéria é mais profunda e pulsátil;</text>
      <text x="14" y="92" fill="#f87171" font-size="9.5" font-weight="600" class="font-sans">cuidado com contaminação venosa!</text>
    </g>

    <!-- Card 2: Punção e Coleta -->
    <g transform="translate(0, 120)" filter="url(#shadowBox)">
      <rect x="0" y="0" width="230" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#0ea5e9" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">2. Técnica de Entrada</text>
      <text x="14" y="42" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">Agulha 25G + Seringa Gasometria</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10" class="font-sans">• Movimento rápido e deliberado</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10" class="font-sans">• Autoenchimento por pressão arterial</text>
      <text x="14" y="92" fill="#cbd5e1" font-size="10" class="font-sans">• Coletar apenas 0,4 a 0,5 mL</text>
      <text x="14" y="106" fill="#fbbf24" font-size="9.5" class="font-sans">Não "pescar" a artéria com a agulha</text>
    </g>

    <!-- Card 3: Pós-Coleta Crítico -->
    <g transform="translate(0, 250)" filter="url(#shadowBox)">
      <rect x="0" y="0" width="230" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#10b981" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">3. Compressão &amp; Amostra</text>
      <text x="14" y="42" fill="#34d399" font-size="11" font-weight="700" class="font-sans">5 MINUTOS DE COMPRESSÃO</text>
      <text x="14" y="60" fill="#cbd5e1" font-size="10" class="font-sans">• Pressão digital direta contínua</text>
      <text x="14" y="76" fill="#cbd5e1" font-size="10" class="font-sans">• Não ficar espiando com a gaze</text>
      <text x="14" y="94" fill="#cbd5e1" font-size="10" class="font-sans">• Expulsar bolhas de ar na hora</text>
      <text x="14" y="108" fill="#a7f3d0" font-size="9.5" font-weight="600" class="font-sans">Fechar hermeticamente | Alvo ≤ 5 min</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 480)">
    <rect x="0" y="0" width="740" height="28" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <circle cx="16" cy="14" r="5" fill="#ef4444" />
    <text x="26" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Artéria Femoral (Sangue oxigenado pulsátil)</text>

    <circle cx="270" cy="14" r="5" fill="#3b82f6" />
    <text x="280" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Veia Femoral (Evitar contaminação venosa)</text>

    <circle cx="510" cy="14" r="5" fill="#f59e0b" />
    <text x="520" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Contenção Cat Friendly: mínima e gentil</text>
  </g>
</svg>
