<svg xmlns="http://www.w3.org/2000/svg" width="800" height="701" viewBox="0 0 800 701" role="img" aria-labelledby="title"><title id="title">Separação da amostra para histologia, citologia e exames especiais</title><rect width="800" height="701" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="29" fill="#0f172a" font-weight="700">Uma coleta, destinos diferentes</text><text x="35" y="82" font-size="23" fill="#334155" font-weight="400">Decida a divisão do material antes de fixar.</text><rect x="35" y="110" width="730" height="154" rx="20" fill="#e0f2fe" stroke="none" stroke-width="2"/><text x="58" y="156" font-size="30" fill="#0369a1" font-weight="700">01</text><text x="115" y="154" font-size="24" fill="#0369a1" font-weight="700">HISTOPATOLOGIA</text><text x="60" y="196" font-size="23" fill="#334155" font-weight="400">Formalina tamponada neutra a 10%</text><text x="60" y="233" font-size="21" fill="#334155" font-weight="400">1 volume de tecido : ~10 de fixador</text><rect x="35" y="290" width="730" height="154" rx="20" fill="#d1fae5" stroke="none" stroke-width="2"/><text x="58" y="336" font-size="30" fill="#047857" font-weight="700">02</text><text x="115" y="334" font-size="24" fill="#047857" font-weight="700">IMPRINT / CITOLOGIA</text><text x="60" y="376" font-size="23" fill="#334155" font-weight="400">Lâmina seca ao ar, feita antes da fixação</text><text x="60" y="413" font-size="21" fill="#334155" font-weight="400">Porta-lâminas longe dos vapores de formalina</text><rect x="35" y="470" width="730" height="154" rx="20" fill="#ede9fe" stroke="none" stroke-width="2"/><text x="58" y="516" font-size="30" fill="#7c3aed" font-weight="700">03</text><text x="115" y="514" font-size="24" fill="#7c3aed" font-weight="700">CULTURA / EXAME ESPECIAL</text><text x="60" y="556" font-size="23" fill="#334155" font-weight="400">Porção separada com técnica asséptica</text><text x="60" y="593" font-size="21" fill="#334155" font-weight="400">Recipiente e transporte definidos pelo laboratório</text><text x="35" y="669" font-size="22" fill="#0f172a" font-weight="700">Identifique paciente, local e região em cada recipiente.</text></g></svg>