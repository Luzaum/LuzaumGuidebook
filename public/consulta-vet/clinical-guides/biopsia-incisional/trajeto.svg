<svg xmlns="http://www.w3.org/2000/svg" width="800" height="713" viewBox="0 0 800 713" role="img" aria-labelledby="title"><title id="title">Incisão longitudinal e campo planejado de ressecção</title><rect width="800" height="713" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="29" fill="#0f172a" font-weight="700">O trajeto precisa caber na futura cirurgia</text><text x="35" y="82" font-size="20" fill="#334155" font-weight="400">Vista superficial de um membro • esquema sem escala</text><rect x="25" y="108" width="360" height="434" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/><text x="45" y="145" font-size="23" fill="#047857" font-weight="700">PLANEJADO</text><rect x="122" y="172" width="165" height="310" rx="64" fill="#f4d7bf" stroke="#d4b59d" stroke-width="2"/><ellipse cx="205" cy="324" rx="57" ry="116" fill="#d1fae5" fill-opacity=".65" stroke="#059669" stroke-dasharray="8 6" stroke-width="3"/><ellipse cx="205" cy="325" rx="35" ry="53" fill="#dba1ab" stroke="#9d5263" stroke-width="2"/><path d="M205,284 L205,358" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/><text x="45" y="515" font-size="21" fill="#047857" font-weight="400">Incisão longitudinal contida</text><rect x="415" y="108" width="360" height="434" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text x="435" y="145" font-size="23" fill="#be123c" font-weight="700">ACESSO INADEQUADO</text><rect x="512" y="172" width="165" height="310" rx="64" fill="#f4d7bf" stroke="#d4b59d" stroke-width="2"/><ellipse cx="595" cy="324" rx="57" ry="116" fill="#d1fae5" fill-opacity=".65" stroke="#059669" stroke-dasharray="8 6" stroke-width="3"/><ellipse cx="595" cy="325" rx="35" ry="53" fill="#dba1ab" stroke="#9d5263" stroke-width="2"/><path d="M498,325 L692,325" fill="none" stroke="#be123c" stroke-width="7" stroke-linecap="round"/><text x="435" y="515" font-size="21" fill="#be123c" font-weight="400">Incisão transversal excede</text><path d="M40,580 L82,580" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/><text x="98" y="587" font-size="22" fill="#334155" font-weight="400">Campo hipotético de ressecção</text><ellipse cx="60" cy="624" rx="20" ry="12" fill="#dba1ab"/><text x="98" y="632" font-size="22" fill="#334155" font-weight="400">Massa tumoral</text><text x="35" y="681" font-size="23" fill="#0f172a" font-weight="700">A profundidade do acesso também entra no planejamento.</text></g></svg>