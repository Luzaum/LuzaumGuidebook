<svg xmlns="http://www.w3.org/2000/svg" width="800" height="710" viewBox="0 0 800 710" role="img" aria-labelledby="title"><title id="title">Cunha de tecido viável em uma massa exposta</title><rect width="800" height="710" rx="24" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="35" y="48" font-size="27" fill="#0f172a" font-weight="700">Cunha: volume + profundidade + tecido viável</text><text x="35" y="83" font-size="21" fill="#334155" font-weight="400">Massa exposta • representação conceitual em corte</text><rect x="35" y="112" width="730" height="385" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M80 365 Q100 229 220 229 L561 229 Q690 229 720 365 L720 424 Q400 500 80 424 Z" fill="#e7aeb8" stroke="#9d5263" stroke-width="3"/><path d="M135 245 Q178 213 262 238 L259 268 Q174 287 135 245" fill="#a8a29e"/><text x="62" y="156" font-size="21" fill="#334155" font-weight="400">Área superficial alterada</text><path d="M180,165 L193,229" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><path d="M430 229 L550 229 L490 371 Z" fill="#fde68a" stroke="#d97706" stroke-width="4"/><text x="545" y="163" font-size="24" fill="#92400e" font-weight="700">Cunha</text><path d="M564,173 L521,226" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/><text x="265" y="433" font-size="23" fill="#713447" font-weight="700">Tecido tumoral viável</text><text x="52" y="538" font-size="25" fill="#0f766e" font-weight="700">1</text><text x="85" y="538" font-size="23" fill="#334155" font-weight="400">Delimitar dois planos de corte convergentes.</text><text x="52" y="582" font-size="25" fill="#0f766e" font-weight="700">2</text><text x="85" y="582" font-size="23" fill="#334155" font-weight="400">Liberar a base sob visão; não arrancar.</text><text x="52" y="626" font-size="25" fill="#0f766e" font-weight="700">3</text><text x="85" y="626" font-size="23" fill="#334155" font-weight="400">Preservar o fragmento; manipular a periferia.</text><text x="35" y="678" font-size="20" fill="#334155" font-weight="400">Não define tamanho, ângulo ou profundidade universais.</text></g></svg>