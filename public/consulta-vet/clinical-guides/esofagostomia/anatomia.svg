<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Anatomia e orientação do acesso</title><desc id="desc">O desenho organiza relações; a localização é confirmada no paciente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d27c2c"/></marker></defs><rect width="900" height="650" rx="24" fill="#f4f8fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="48" font-size="28" fill="#133b4a" font-weight="700">Anatomia e orientação do acesso</text><text x="35" y="80" font-size="18" fill="#243e51" font-weight="400">O desenho organiza relações; a localização é confirmada no paciente.</text><rect x="35" y="105" width="830" height="300" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="65" y="140" font-size="22" fill="#243e51" font-weight="700">Acesso cervical esquerdo • vista conceitual</text><rect x="135" y="182" width="650" height="65" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><text x="160" y="222" font-size="23" fill="#243e51" font-weight="400">Esôfago cervical → esôfago torácico</text><rect x="135" y="288" width="650" height="65" rx="18" fill="#e3ebf2" stroke="#9bb4c9" stroke-width="2"/><text x="160" y="330" font-size="23" fill="#243e51" font-weight="400">Traqueia • via respiratória</text><path d="M80 164L320 164L355 207" fill="none" stroke="#d27c2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="80" y="160" font-size="17" fill="#9c571a" font-weight="400">Sonda</text><path d="M320 272L500 272" fill="none" stroke="#b94956" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="525" y="279" font-size="18" fill="#a23343" font-weight="400">Jugular externa (superficial)</text><text x="65" y="388" font-size="22" fill="#146857" font-weight="600">Acesso: pontas palpáveis, dorsais à jugular.</text><rect x="35" y="425" width="405" height="165" rx="18" fill="#eaf5f1" stroke="#cbd9df" stroke-width="2"/><text x="60" y="460" font-size="23" fill="#243e51" font-weight="700">Orientação do paciente</text><text x="60" y="495" font-size="19" fill="#243e51" font-weight="400">Lateral direito; pescoço esquerdo</text><text x="60" y="524" font-size="19" fill="#243e51" font-weight="400">voltado para cima.</text><text x="60" y="562" font-size="17" fill="#243e51" font-weight="400">Posição dos tecidos é variável.</text><rect x="460" y="425" width="405" height="165" rx="18" fill="#fff5e9" stroke="#cbd9df" stroke-width="2"/><text x="485" y="460" font-size="23" fill="#243e51" font-weight="700">Antes da incisão</text><text x="485" y="495" font-size="19" fill="#243e51" font-weight="400">Identificar a jugular e palpar metal.</text><text x="485" y="524" font-size="19" fill="#243e51" font-weight="400">Evitar corte profundo cego.</text><text x="485" y="562" font-size="17" fill="#243e51" font-weight="400">Não cortar se o acesso for incerto.</text><text x="35" y="625" font-size="15" fill="#243e51" font-weight="400">VETIUS · Esquema original · Sem escala · Consulte o texto e a imagem do paciente</text></g></svg>