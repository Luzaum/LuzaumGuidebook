<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">O flip: mudança de direção</title><desc id="desc">Laranja = sonda. Verde = esôfago. Três fases, não movimentos sob força.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d27c2c"/></marker></defs><rect width="900" height="650" rx="24" fill="#f4f8fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="48" font-size="28" fill="#133b4a" font-weight="700">O flip: mudança de direção</text><text x="35" y="80" font-size="18" fill="#243e51" font-weight="400">Laranja = sonda. Verde = esôfago. Três fases, não movimentos sob força.</text><rect x="35" y="110" width="270" height="420" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="53" y="150" font-size="22" fill="#243e51" font-weight="700">1 · Saída pela boca</text><text x="53" y="190" font-size="16" fill="#243e51" font-weight="400">BOCA / CRANIAL</text><text x="53" y="480" font-size="16" fill="#243e51" font-weight="400">TÓRAX / CAUDAL</text><rect x="170" y="215" width="100" height="220" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><text x="53" y="355" font-size="17" fill="#243e51" font-weight="400">Estoma</text><path d="M70 322L195 322L195 222" fill="none" stroke="#d27c2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="53" y="515" font-size="14" fill="#243e51" font-weight="400">Ponta alimentar vai cranialmente.</text><rect x="315" y="110" width="270" height="420" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="333" y="150" font-size="22" fill="#243e51" font-weight="700">2 · Redirecionamento</text><text x="333" y="190" font-size="16" fill="#243e51" font-weight="400">BOCA / CRANIAL</text><text x="333" y="480" font-size="16" fill="#243e51" font-weight="400">TÓRAX / CAUDAL</text><rect x="450" y="215" width="100" height="220" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><text x="333" y="355" font-size="17" fill="#243e51" font-weight="400">Estoma</text><path d="M350 322L470 322L470 235Q510 195 525 240L525 393" fill="none" stroke="#d27c2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="333" y="515" font-size="14" fill="#243e51" font-weight="400">Avanço oral + tração externa leve.</text><rect x="595" y="110" width="270" height="420" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="613" y="150" font-size="22" fill="#243e51" font-weight="700">3 · Trajeto final</text><text x="613" y="190" font-size="16" fill="#243e51" font-weight="400">BOCA / CRANIAL</text><text x="613" y="480" font-size="16" fill="#243e51" font-weight="400">TÓRAX / CAUDAL</text><rect x="730" y="215" width="100" height="220" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><text x="613" y="355" font-size="17" fill="#243e51" font-weight="400">Estoma</text><path d="M630 255L630 322L755 322L755 414" fill="none" stroke="#d27c2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="613" y="515" font-size="14" fill="#243e51" font-weight="400">Ponta alimentar segue ao tórax.</text><rect x="35" y="550" width="830" height="44" rx="18" fill="#fff5e9" stroke="#cbd9df" stroke-width="2"/><text x="57" y="579" font-size="22" fill="#80501e" font-weight="600">A alça deve desaparecer. Resistência: parar, inspecionar e corrigir.</text><text x="35" y="625" font-size="15" fill="#243e51" font-weight="400">VETIUS · Esquema original · Sem escala · Consulte o texto e a imagem do paciente</text></g></svg>