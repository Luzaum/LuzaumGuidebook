<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Antes de cada utilização</title><desc id="desc">A rotina começa com posição confirmada e uma marca de referência registrada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d27c2c"/></marker></defs><rect width="900" height="650" rx="24" fill="#f4f8fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="48" font-size="28" fill="#133b4a" font-weight="700">Antes de cada utilização</text><text x="35" y="80" font-size="18" fill="#243e51" font-weight="400">A rotina começa com posição confirmada e uma marca de referência registrada.</text><rect x="35" y="110" width="520" height="90" rx="18" fill="#eaf5f1" stroke="#cbd9df" stroke-width="2"/><text x="60" y="148" font-size="23" fill="#243e51" font-weight="700">1 · Paciente + estoma + marca externa</text><text x="60" y="179" font-size="19" fill="#243e51" font-weight="400">Conferir conforto, fixação e integridade.</text><rect x="35" y="222" width="520" height="80" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="60" y="255" font-size="23" fill="#243e51" font-weight="700">2 · Lavagem prescrita</text><text x="60" y="285" font-size="19" fill="#243e51" font-weight="400">Somente se a checagem for satisfatória.</text><rect x="35" y="324" width="520" height="80" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="60" y="357" font-size="23" fill="#243e51" font-weight="700">3 · Dieta lenta e fracionada</text><text x="60" y="387" font-size="19" fill="#243e51" font-weight="400">Observar sinais de intolerância.</text><rect x="35" y="426" width="520" height="80" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="60" y="459" font-size="22" fill="#243e51" font-weight="700">4 · Lavar, fechar, proteger e registrar</text><text x="60" y="489" font-size="19" fill="#243e51" font-weight="400">Somar dieta, água e ingestão voluntária.</text><rect x="585" y="110" width="280" height="396" rx="18" fill="#fff0ef" stroke="#d99a94" stroke-width="2"/><text x="610" y="150" font-size="25" fill="#a83a36" font-weight="700">PARE SE:</text><text x="610" y="195" font-size="19" fill="#873d3a" font-weight="400">• Marca mudou</text><text x="610" y="237" font-size="19" fill="#873d3a" font-weight="400">• Alça oral</text><text x="610" y="279" font-size="19" fill="#873d3a" font-weight="400">• Dor ou resistência</text><text x="610" y="321" font-size="19" fill="#873d3a" font-weight="400">• Alimento no estoma</text><text x="610" y="363" font-size="19" fill="#873d3a" font-weight="400">• Tosse / dispneia</text><text x="610" y="405" font-size="19" fill="#873d3a" font-weight="400">• Vômito / regurgitação</text><rect x="35" y="536" width="830" height="58" rx="18" fill="#fff5e9" stroke="#cbd9df" stroke-width="2"/><text x="55" y="570" font-size="21" fill="#80501e" font-weight="600">Dúvida de posição: suspender também água e medicamentos; investigar.</text><text x="35" y="625" font-size="15" fill="#243e51" font-weight="400">VETIUS · Esquema original · Sem escala · Consulte o texto e a imagem do paciente</text></g></svg>