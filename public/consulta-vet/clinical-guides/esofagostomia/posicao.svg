<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Posição: o trajeto inteiro importa</title><desc id="desc">Esquemas de comparação; não substituem radiografia do paciente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d27c2c"/></marker></defs><rect width="900" height="650" rx="24" fill="#f4f8fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="48" font-size="28" fill="#133b4a" font-weight="700">Posição: o trajeto inteiro importa</text><text x="35" y="80" font-size="18" fill="#243e51" font-weight="400">Esquemas de comparação; não substituem radiografia do paciente.</text><rect x="35" y="110" width="405" height="220" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="55" y="143" font-size="22" fill="#18866c" font-weight="700">CORRETO</text><rect x="110" y="155" width="30" height="122" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><rect x="181" y="155" width="30" height="122" rx="18" fill="#e3ebf2" stroke="#9bb4c9" stroke-width="2"/><path d="M65 194L125 194L125 265" fill="none" stroke="#18866c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="187" font-size="17" fill="#243e51" font-weight="400">Verde: esôfago</text><text x="225" y="217" font-size="17" fill="#243e51" font-weight="400">Azul: traqueia</text><path d="M97 280L151 280" fill="none" stroke="#7d909a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="255" font-size="17" fill="#243e51" font-weight="400">Linha: cárdia</text><text x="55" y="312" font-size="19" fill="#243e51" font-weight="400">Esôfago distal, antes da cárdia.</text><rect x="460" y="110" width="405" height="220" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="480" y="143" font-size="22" fill="#b44946" font-weight="700">ALÇA CRANIAL</text><rect x="535" y="155" width="30" height="122" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><rect x="606" y="155" width="30" height="122" rx="18" fill="#e3ebf2" stroke="#9bb4c9" stroke-width="2"/><path d="M490 210L546 210L546 175Q580 150 580 195" fill="none" stroke="#b44946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="187" font-size="17" fill="#243e51" font-weight="400">Verde: esôfago</text><text x="650" y="217" font-size="17" fill="#243e51" font-weight="400">Azul: traqueia</text><path d="M522 280L576 280" fill="none" stroke="#7d909a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="255" font-size="17" fill="#243e51" font-weight="400">Linha: cárdia</text><text x="480" y="312" font-size="19" fill="#243e51" font-weight="400">Ponta voltou em direção à boca.</text><rect x="35" y="345" width="405" height="220" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><text x="55" y="378" font-size="22" fill="#b44946" font-weight="700">VIA RESPIRATÓRIA</text><rect x="110" y="390" width="30" height="122" rx="18" fill="#d7efea" stroke="#88c7bc" stroke-width="2"/><rect x="181" y="390" width="30" height="122" rx="18" fill="#e3ebf2" stroke="#9bb4c9" stroke-width="2"/><path d="M65 429L196 429L196 500" fill="none" stroke="#b44946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="422" font-size="17" fill="#243e51" font-weight="400">Verde: esôfago</text><text x="225" y="452" font-size="17" fill="#243e51" font-weight="400">Azul: traqueia</text><path d="M97 515L151 515" fill="none" stroke="#7d909a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="490" font-size="17" fill="#243e51" font-weight="400">Linha: cárdia</text><text x="55" y="547" font-size="19" fill="#243e51" font-weight="400">Não usar: investigar e corrigir.</text><rect x="460" y="345" width="405" height="220" rx="18" fill="#fff" stroke="#cbd9df" stroke-width="2"/><tex