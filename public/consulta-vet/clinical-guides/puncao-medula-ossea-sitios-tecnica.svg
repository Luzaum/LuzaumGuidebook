<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-labelledby="title-medula desc-medula">
  <title id="title-medula">Punção e Biópsia de Medula Óssea em Cães e Gatos — Guia Técnico Vetius</title>
  <desc id="desc-medula">Diagrama técnico dos sítios anatômicos (crista ilíaca, úmero proximal e fossa trocantérica), técnica de penetração cortical e identificação visual de espículas medulares.</desc>
  
  <defs>
    <linearGradient id="bgMedula" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="marrowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="needleMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <filter id="glowMarrow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .pulse-dot { animation: pulseAnim 2s infinite ease-in-out; transform-origin: center; }
    @keyframes pulseAnim {
      0% { r: 4px; opacity: 0.9; }
      50% { r: 12px; opacity: 0.3; }
      100% { r: 18px; opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="520" rx="20" fill="url(#bgMedula)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0,65 L800,65 M0,130 L800,130 M0,195 L800,195 M0,260 L800,260 M0,325 L800,325 M0,390 L800,390 M0,455 L800,455" />
    <path d="M100,0 L100,520 M200,0 L200,520 M300,0 L300,520 M400,0 L400,520 M500,0 L500,520 M600,0 L600,520 M700,0 L700,520" />
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="165" height="22" rx="11" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="1" stroke-opacity="0.4" />
    <text x="82.5" y="15" text-anchor="middle" fill="#f87171" font-size="10" font-weight="700" letter-spacing="0.1em" class="font-sans">MEDULA ÓSSEA (AMO/BMO)</text>
    
    <text x="180" y="16" fill="#f8fafc" font-size="16" font-weight="800" class="font-sans">Sítios de Punção, Penetração Cortical &amp; Espículas</text>
    <text x="0" y="38" fill="#94a3b8" font-size="12" class="font-sans">Guia prático Vetius para cães e gatos: crista ilíaca, úmero proximal e fossa trocantérica femoral</text>
  </g>

  <!-- Left: Anatomical sites overview & Needle Mechanics -->
  <!-- Cross-section of Bone & Needle Insertion -->
  <g transform="translate(35, 95)">
    <g filter="url(#boxShadow)">
      <rect x="0" y="0" width="480" height="375" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Subheader inside box -->
    <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700" class="font-sans">Técnica de Penetração Cortical &amp; Espaço Medular</text>
    <text x="20" y="48" fill="#94a3b8" font-size="10.5" class="font-sans">Pressão axial firme + rotação curta alternada (sentido horário/anti-horário) com estilete acoplado</text>

    <!-- Schematic Bone Cross Section -->
    <g transform="translate(30, 75)">
      <!-- Skin and Subcutaneous Layer -->
      <rect x="0" y="0" width="420" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" />
      <text x="10" y="13" fill="#fbbf24" font-size="9.5" font-weight="600" class="font-sans">Pele + Subcutâneo (incisão com bisturi nº 11)</text>

      <!-- Periosteum Line (Highly Sensitive) -->
      <line x1="0" y1="42" x2="420" y2="42" stroke="#ec4899" stroke-width="2.5" />
      <text x="10" y="38" fill="#f472b6" font-size="9.5" font-weight="700" class="font-sans">Periósteo (Infiltração local obrigatória - rico em dor!)</text>

      <!-- Outer Cortical Bone (Dense, High Resistance) -->
      <rect x="0" y="44" width="420" height="42" fill="#475569" stroke="#64748b" stroke-width="1.5" />
      <text x="10" y="68" fill="#e2e8f0" font-size="11" font-weight="700" class="font-sans">Córtex Ósseo Rígido</text>
      <text x="10" y="80" fill="#94a3b8" font-size="9" class="font-sans">(Resistência mecânica elevada)</text>

      <!-- Medullary Cavity (Trabecular Red Marrow) -->
      <rect x="0" y="86" width="420" height="95" fill="url(#marrowRed)" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.5" filter="url(#glowMarrow)" />
      
      <!-- Bone Trabeculae schematic inside marrow -->
      <g stroke="#fca5a5" stroke-width="1.5" opacity="0.4">
        <path d="M 40,95 L 60,130 L 45,160 M 120,90 L 140,120 L 160,105 L 175,150 M 240,110 L 260,140 M 340,95 L 360,125 L 385,155" />
      </g>
      <text x="10" y="115" fill="#fca5a5" font-size="12" font-weight="800" class="font-sans">Cavidade Medular / Medula Hematopoética</text>
      <text x="10" y="132" fill="#ffffff" font-size="10" font-weight="600" class="font-sans">Perda súbita de resistência ("Give") + agulha firmemente ancorada</text>

      <!-- Opposite Cortex (Do NOT breach!) -->
      <rect x="0" y="181" width="420" height="28" fill="#475569" stroke="#64748b" stroke-width="1.5" />
      <text x="10" y="200" fill="#cbd5e1" font-size="9.5" class="font-sans">Córtex Oposto (Evitar transfixação / impacto da ponta)</text>

      <!-- Needle Entering Schema -->
      <g transform="translate(250, -35)">
        <!-- Illinois / Rosenthal Needle Body -->
        <rect x="-6" y="0" width="12" height="150" fill="url(#needleMetal)" stroke="#334155" stroke-width="1" />
        
        <!-- Stylet Cap / T-handle -->
        <rect x="-24" y="-20" width="48" height="20" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
        <text x="0" y="-7" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="800" class="font-sans">ESTILETE</text>

        <!-- Bevel tip inside marrow -->
        <polygon points="-6,150 0,165 6,150" fill="#f8fafc" stroke="#334155" stroke-width="1" />

        <!-- Rotation arrows -->
        <g stroke="#38bdf8" stroke-width="2" fill="none">
          <path d="M -28,30 C -38,35 -38,50 -28,55" />
          <polygon points="-28,30 -34,34 -30,37" fill="#38bdf8" />
          <path d="M 28,30 C 38,35 38,50 28,55" />
          <polygon points="28,55 34,51 30,48" fill="#38bdf8" />
        </g>
        <text x="44" y="45" fill="#38bdf8" font-size="9.5" font-weight="700" class="font-sans">Rotação</text>
        <text x="44" y="56" fill="#7dd3fc" font-size="8" class="font-sans">Curta D ⇄ E</text>

        <!-- Aspiration Target Point inside marrow -->
        <circle cx="0" cy="165" r="5" fill="#ef4444" />
        <circle cx="0" cy="165" r="14" stroke="#ef4444" stroke-width="1.5" class="pulse-dot" fill="none" />
      </g>
    </g>

    <!-- Bottom summary tag inside the left card -->
    <g transform="translate(20, 325)">
      <rect x="0" y="0" width="440" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="14" y="16" fill="#38bdf8" font-size="10" font-weight="700" class="font-sans">REGRA DE OURO DA SUCÇÃO:</text>
      <text x="165" y="16" fill="#cbd5e1" font-size="9.5" class="font-sans">Seringa de 20 mL → puxar forte até 10 mL → aspirar</text>
      <text x="14" y="27" fill="#f87171" font-size="9.5" font-weight="700" class="font-sans">&lt; 0,5 mL!</text>
      <text x="65" y="27" fill="#94a3b8" font-size="9.5" class="font-sans">Solte o êmbolo assim que o sangue surgir no cone (evita hemodiluição).</text>
    </g>
  </g>

  <!-- Right: 3 Key Anatomical Sites Quick Cards -->
  <g transform="translate(535, 95)">
    <!-- Site 1: Crista Ilíaca -->
    <g filter="url(#boxShadow)">
      <rect x="0" y="0" width="235" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#10b981" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">1. Crista Ilíaca (Cão 🐶)</text>
      <text x="14" y="40" fill="#34d399" font-size="10.5" font-weight="600" class="font-sans">1ª escolha em cão médio/grande</text>
      <text x="14" y="58" fill="#cbd5e1" font-size="9.5" class="font-sans">• Posição: decúbito esternal com patas recolhidas</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="9.5" class="font-sans">• Ponto mais largo e dorsal da asa ilíaca</text>
      <text x="14" y="90" fill="#cbd5e1" font-size="9.5" class="font-sans">• Agulha perpendicular/levemente caudal</text>
      <text x="14" y="104" fill="#a7f3d0" font-size="9" class="font-sans">Excelente controle e estabilidade óssea</text>
    </g>

    <!-- Site 2: Úmero Proximal -->
    <g transform="translate(0, 128)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="235" height="118" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="118" rx="2" fill="#0ea5e9" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">2. Úmero Proximal (Gato 🐱 / Cão)</text>
      <text x="14" y="40" fill="#38bdf8" font-size="10.5" font-weight="600" class="font-sans">1ª escolha no Gato e cão pequeno</text>
      <text x="14" y="58" fill="#cbd5e1" font-size="9.5" class="font-sans">• Posição: decúbito lateral</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="9.5" class="font-sans">• Área achatada craniolateral ao tubérculo maior</text>
      <text x="14" y="90" fill="#cbd5e1" font-size="9.5" class="font-sans">• Pouca cobertura de tecidos moles</text>
      <text x="14" y="106" fill="#fbbf24" font-size="9" class="font-sans">Ideal para aspirado e biópsia core</text>
    </g>

    <!-- Site 3: Fossa Trocantérica -->
    <g transform="translate(0, 258)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="235" height="115" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="0" width="4" height="115" rx="2" fill="#f59e0b" />
      <text x="14" y="22" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">3. Fossa Trocantérica (Fêmur)</text>
      <text x="14" y="40" fill="#fbbf24" font-size="10.5" font-weight="600" class="font-sans">Alternativa em cão e gato</text>
      <text x="14" y="58" fill="#cbd5e1" font-size="9.5" class="font-sans">• Posição: decúbito lateral, joelho aduzido</text>
      <text x="14" y="74" fill="#cbd5e1" font-size="9.5" class="font-sans">• Agulha medial ao trocanter, paralela à diáfise</text>
      <text x="14" y="92" fill="#f87171" font-size="9.5" font-weight="700" class="font-sans">⚠️ ALERTA: NERVO CIÁTICO CAUDAL</text>
      <text x="14" y="105" fill="#fca5a5" font-size="8.5" class="font-sans">Nunca deixe a agulha escapar caudalmente</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(30, 482)">
    <rect x="0" y="0" width="740" height="28" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <circle cx="16" cy="14" r="5" fill="#ef4444" />
    <text x="26" y="18" fill="#cbd5e1" font-size="10" class="font-sans">AMO (Citologia: morfologia e maturação celular)</text>

    <circle cx="280" cy="14" r="5" fill="#38bdf8" />
    <text x="290" y="18" fill="#cbd5e1" font-size="10" class="font-sans">BMO (Core/Histologia: arquitetura, celularidade e fibrose)</text>

    <circle cx="590" cy="14" r="5" fill="#10b981" />
    <text x="600" y="18" fill="#cbd5e1" font-size="10" class="font-sans">Coagula em 10–20s: lâminas prontas!</text>
  </g>
</svg>
