      - generic [ref=f1e21]:
        - heading "O que é e visão inicial" [level=4] [ref=f1e22]
        - paragraph [ref=f1e25]: O hipoadrenocorticismo (doença de Addison) ocorre quando as glândulas adrenais de cães ou gatos deixam de produzir quantidades suficientes de cortisol e, na maioria dos casos, aldosterona — hormônios essenciais para responder ao estresse, manter a pressão arterial e equilibrar sódio e potássio.
        - paragraph [ref=f1e26]:
          - text: Conhecido como "o grande imitador" da clínica médica, o hipoadrenocorticismo pode simular gastroenteropatias crônicas, enteropatia perdedora de proteínas, lesão renal aguda e sepse. O raciocínio moderno exige
          - mark [ref=f1e27]: separar o diagnóstico hormonal do fenótipo eletrolítico (ALIVE 2025)
          - text: ", coletar amostras antes de corticoides que interfiram no ensaio, evitar elevação rápida da natremia na emergência e individualizar doses de glicocorticoide e DOCP/fludrocortisona para alcançar sobrevida e qualidade de vida excelentes em cães e gatos."
        - generic [ref=f1e28]:
          - generic [ref=f1e29]:
            - generic [ref=f1e30]: •
            - generic [ref=f1e31]: Conhecido como “grande imitador” porque os sintomas vão e voltam e se confundem com gastroenterite ou doença renal.
          - generic [ref=f1e32]:
            - generic [ref=f1e33]: •
            - generic [ref=f1e34]: A forma sem alteração de sódio e potássio (eunatrêmica/eucalêmica) também existe e pode atrasar o diagnóstico.
          - generic [ref=f1e35]:
            - generic [ref=f1e36]: •
            - generic [ref=f1e37]: Crises agudas causam fraqueza extrema, tremores, bradicardia e choque, exigindo atendimento veterinário imediato.
          - generic [ref=f1e38]:
            - generic [ref=f1e39]: •
            - generic [ref=f1e40]: Após estabilização, a maioria dos cães e gatos leva vida normal com reposição hormonal contínua e acompanhamento periódico.
      - generic [ref=f1e41]:
