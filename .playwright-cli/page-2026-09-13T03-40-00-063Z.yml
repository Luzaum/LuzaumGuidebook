        - text: Para histopatologia convencional, use
        - strong [ref=f13e449]: formalina tamponada neutra a 10%
        - text: ", na proporção aproximada de"
        - strong [ref=f13e450]: uma parte de tecido para dez partes de fixador
        - text: . Use solução preparada para histologia; “formalina 10%” não significa formaldeído puro a 10%. O tecido deve ficar imerso em frasco de boca larga e bem vedado. [1–3]
