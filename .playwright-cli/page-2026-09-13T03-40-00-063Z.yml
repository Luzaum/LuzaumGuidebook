        - paragraph [ref=f13e461]: Checagem da conservação
        - list [ref=f13e462]:
          - listitem [ref=f13e463]:
            - strong [ref=f13e464]: Fixe prontamente.
            - text: Não deixe secar, não coloque em água e não congele tecido destinado à histologia convencional.
          - listitem [ref=f13e465]:
            - strong [ref=f13e466]: Confira a espessura.
            - text: O Withrow orienta que o tecido não exceda aproximadamente 1 cm de espessura para fixar adequadamente; isso é um limite de processamento, não uma medida padrão de cunha.
          - listitem [ref=f13e467]:
            - strong [ref=f13e468]: Não force fragmentos em frascos estreitos.
            - text: O tecido endurece com a fixação e pode ser difícil de retirar sem danificá-lo.
          - listitem [ref=f13e469]:
            - strong [ref=f13e470]: Identifique cada região.
            - text: Lesões distintas devem ir em recipientes separados; correlacione os códigos com o desenho.
          - listitem [ref=f13e471]:
            - strong [ref=f13e472]: Se houver processamento especial
            - text: ", como em determinadas amostras musculares ou nervosas, consulte o laboratório antes da coleta. [1–3]"
      - note [ref=f13e473]:
        - paragraph [ref=f13e474]: Há suspeita de infecção?
        - paragraph [ref=f13e475]:
          - text: Histologia e cultura exigem destinos diferentes. Separe uma porção com técnica asséptica, em recipiente estéril e meio definido pelo laboratório,
          - strong [ref=f13e476]: antes da formalina
          - text: ". Alguns testes moleculares aceitam tecido fixado e outros exigem material fresco: confirme a necessidade específica. [1,3]"
