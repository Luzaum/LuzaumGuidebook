    - generic [ref=f13e11]: Biópsia incisional em cães e gatos
  - generic [ref=f13e14]:
    - generic [ref=f13e15]:
      - generic [ref=f13e16]: Procedimentos Ambulatoriais
      - heading "Biópsia incisional em cães e gatos" [level=1] [ref=f13e18]
      - paragraph [ref=f13e19]: Procedimentos Clínicos — Biópsia em cunha, planejamento oncológico, manipulação do fragmento e histopatologia
      - paragraph [ref=f13e20]: Aprenda a escolher o acesso, expor a lesão e retirar uma cunha representativa sem comprometer a cirurgia definitiva. Técnica explicada passo a passo, com esquemas, particularidades de massas orais e sarcomas, conservação da amostra e resolução de falhas diagnósticas.
    - button [ref=f13e21]:
      - img "Esquema de uma cunha de tecido tumoral e frasco para histopatologia." [ref=f13e22]
      - generic [ref=f13e23]: Zoom
  - generic [ref=f13e29]:
    - heading "Guia rápido" [level=2] [ref=f13e34]
    - list [ref=f13e35]:
      - listitem [ref=f13e36]: Indique quando diagnóstico ou grau histológico mudarem o tratamento, especialmente em massas grandes, infiltrativas ou de ressecção complexa.
      - listitem [ref=f13e37]: "Planeje a cirurgia definitiva primeiro: a cicatriz e todo o trajeto da biópsia precisam ser removíveis junto com o tumor."
      - listitem [ref=f13e38]: Em membros, prefira incisão longitudinal. Evite túneis, descolamentos amplos e passagem por compartimentos não envolvidos.
      - listitem [ref=f13e39]: Colete uma cunha de tumor viável, suficientemente profunda; crosta, necrose e pseudocápsula isoladas podem não responder à pergunta clínica.
      - listitem [ref=f13e40]: Use instrumento frio. Segure a periferia delicadamente; cautério fica para a hemostasia após a coleta.
      - listitem [ref=f13e41]: "Se indicado, faça imprint antes da fixação. Histologia: formalina tamponada neutra 10%, aproximadamente 1:10 de tecido:fixador."
      - listitem [ref=f13e42]: Envie citologia longe dos vapores de formalina; cultura e exames que exigem tecido fresco precisam de recipiente próprio.
      - listitem [ref=f13e43]: A biópsia não avalia margens definitivas e pode subestimar o grau. Laudo discordante exige revisão; a peça final deve ser examinada novamente.
  - group [ref=f13e44]:
    - generic "Neste guia — navegar pelos capítulos" [ref=f13e45] [cursor=pointer]
  - region "Conteúdo completo" [ref=f13e46]:
    - generic [ref=f13e47]:
      - heading "O que estamos coletando? Uma parte que preserve a arquitetura" [level=2] [ref=f13e48]
      - paragraph [ref=f13e49]:
        - text: Na biópsia incisional, o cirurgião remove
        - strong [ref=f13e50]: uma parte da lesão
        - text: e deixa a maior parte dela no paciente. O fragmento segue para histopatologia, que examina células e sua organização no tecido. O propósito é descobrir o que a lesão é e obter informações que orientem o tratamento; a remoção completa pertence a outra etapa.
      - note [ref=f13e51]:
        - paragraph [ref=f13e52]: "A analogia do bolo: o que uma fatia consegue mostrar?"
        - paragraph [ref=f13e53]: "A citologia examina as “migalhas”: mostra muito bem as células, mas não conserva toda a organização. Uma cunha é uma fatia que mantém as camadas e a relação entre elas. Porém, se o bolo tem recheios diferentes, uma única fatia não revela tudo. No tumor, essa heterogeneidade explica por que uma boa biópsia pode diagnosticar a neoplasia e ainda subestimar seu grau."
      - paragraph [ref=f13e54]:
        - text: Este passo a passo descreve a
        - strong [ref=f13e55]: biópsia cirúrgica aberta em cunha de massas cutâneas, subcutâneas e de tecidos moles acessíveis
        - text: ", com adaptações para a cavidade oral. Biópsias de osso, vísceras, nervos e órgãos profundos exigem técnicas próprias de acesso e hemostasia. [1,2]"
      - note [ref=f13e56]:
        - paragraph [ref=f13e57]: A primeira decisão é oncológica
        - paragraph [ref=f13e58]:
          - mark [ref=f13e59]: A biópsia já faz parte do tratamento definitivo.
          - text: A incisão e os tecidos atravessados constituem um trajeto potencialmente contaminado. Na cirurgia com intenção curativa, esse trajeto deve poder sair em continuidade com o tumor. Uma amostra boa com um acesso mal escolhido pode dificultar a próxima cirurgia. [1,2]
      - heading "PAAF, core, punch, incisional ou excisional?" [level=2] [ref=f13e60]
      - generic [ref=f13e61]:
        - paragraph [ref=f13e62]: Escolha a amostra pela pergunta clínica
        - table [ref=f13e63]:
          - rowgroup [ref=f13e64]:
            - row [ref=f13e65]:
              - columnheader "Método" [ref=f13e66]
              - columnheader "O que é coletado" [ref=f13e67]
              - columnheader "Quando ajuda" [ref=f13e68]
              - columnheader "Limitação prática" [ref=f13e69]
          - rowgroup [ref=f13e70]:
            - row [ref=f13e71]:
              - cell "PAAF / citologia" [ref=f13e72]
              - cell "Células aspiradas ou obtidas por capilaridade." [ref=f13e73]
              - cell "Primeira investigação de muitas massas; identifica inflamação e neoplasias que esfoliam bem." [ref=f13e74]
              - cell "Resultado pouco celular ou “mesenquimal” pode não definir subtipo nem grau; arquitetura limitada." [ref=f13e75]
            - row [ref=f13e76]:
              - cell "Core / Tru-cut" [ref=f13e77]
              - cell "Cilindro estreito de tecido." [ref=f13e78]
              - cell "Massa sólida acessível ou guiada por imagem; preserva arquitetura com menor acesso." [ref=f13e79]
              - cell "Necrose, septos e heterogeneidade podem tornar o cilindro pouco representativo." [ref=f13e80]
            - row [ref=f13e81]:
              - cell "Punch" [ref=f13e82]
              - cell "Cilindro recortado por lâmina circular." [ref=f13e83]
              - cell "Principalmente pele e lesões superficiais selecionadas." [ref=f13e84]
              - cell "Pode colher só pele ou superfície inflamada sem alcançar a massa profunda." [ref=f13e85]
            - row [ref=f13e86]:
              - cell [ref=f13e87]:
                - strong [ref=f13e88]: Incisional em cunha
              - cell [ref=f13e89]:
                - strong [ref=f13e90]: Parte da massa obtida sob visão direta.
              - cell "Fragmento mais amplo/profundo, coleta anterior inconclusiva ou cirurgia definitiva complexa." [ref=f13e91]
              - cell "Exige acesso cirúrgico, hemostasia e planejamento de todo o trajeto." [ref=f13e92]
            - row [ref=f13e93]:
              - cell "Excisional" [ref=f13e94]
              - cell "Toda a lesão, com ressecção planejada." [ref=f13e95]
              - cell "Casos em que o diagnóstico prévio não mudaria uma cirurgia já apropriada." [ref=f13e96]
              - cell "“Descascar” uma massa suspeita pode deixar doença e comprometer o controle local." [ref=f13e97]
      - paragraph [ref=f13e98]:
        - strong [ref=f13e99]: Punch e core também podem ser biópsias parciais.
        - text: "Aqui, “incisional” designa a técnica aberta em cunha para diferenciá-la desses instrumentos. Não é obrigatório tentar todos os métodos antes dela: escolha a abordagem que responda à pergunta com morbidade aceitável. [1–3]"
      - heading "Quando indicar e quando a biópsia muda a conduta" [level=2] [ref=f13e100]
      - generic [ref=f13e101]:
        - paragraph [ref=f13e102]: Perguntas que justificam coletar antes do tratamento
        - list [ref=f13e103]:
          - listitem [ref=f13e104]:
            - strong [ref=f13e105]: A citologia foi inconclusiva ou discordante?
            - text: Uma massa infiltrativa com PAAF mostrando apenas sangue ou inflamação exige reconsiderar alvo e modalidade de amostragem.
          - listitem [ref=f13e106]:
            - strong [ref=f13e107]: O diagnóstico muda o tratamento?
            - text: Saber se a massa é inflamatória, epitelial, mesenquimal ou hematopoiética pode alterar a indicação de cirurgia, radioterapia ou tratamento sistêmico.
          - listitem [ref=f13e108]:
            - strong [ref=f13e109]: Tipo ou grau mudam a extensão da ressecção?
            - text: Isso é especialmente relevante em suspeita de sarcoma de tecidos moles.
          - listitem [ref=f13e110]:
            - strong [ref=f13e111]: A cirurgia terá grande consequência funcional ou reconstrutiva?
            - text: Planeje o diagnóstico antes de mandibulectomia, maxilectomia, amputação ou retalhos extensos.
          - listitem [ref=f13e112]:
            - strong [ref=f13e113]: O tutor precisa do diagnóstico para decidir?
            - text: Obter informação antes de uma cirurgia de maior morbidade pode evitar um tratamento inadequado. [1,2]
      - note [ref=f13e114]:
        - paragraph [ref=f13e115]: "Exemplo clínico: massa subcutânea na parede torácica"
        - paragraph [ref=f13e116]: Um lipoma e um sarcoma podem ter apresentações palpáveis parecidas, mas exigem estratégias diferentes. Se a PAAF não esclarece a natureza da lesão, coletar tecido ajuda a definir o plano antes de abrir amplamente a região. Tamanho, mobilidade e palpação isolados não substituem o diagnóstico. [1,2]
      - paragraph [ref=f13e117]:
        - text: A incisional pode ajudar em
        - strong [ref=f13e118]: lesões ulceradas ou heterogêneas
        - text: ", porque permite alcançar uma região sólida em profundidade. Isso não significa colher a úlcera: significa superar a superfície alterada para chegar ao tecido que representa o processo de base. [1,2]"
      - heading "Quando adiar, mudar a técnica ou encaminhar" [level=2] [ref=f13e119]
      - generic [ref=f13e120]:
        - paragraph [ref=f13e121]: Segurança e utilidade antes de começar
        - table [ref=f13e122]:
          - rowgroup [ref=f13e123]:
            - row [ref=f13e124]:
              - columnheader "Situação" [ref=f13e125]
              - columnheader "Por que importa" [ref=f13e126]
              - columnheader "Conduta de planejamento" [ref=f13e127]
          - rowgroup [ref=f13e128]:
            - row [ref=f13e129]:
              - cell "Coagulopatia relevante ou sangramento anormal" [ref=f13e130]
              - cell "A lesão pode ser vascular e pouco acessível à compressão." [ref=f13e131]
              - cell "Investigue/corrija a alteração; adapte técnica e recursos de hemostasia." [ref=f13e132]
            - row [ref=f13e133]:
              - cell "Instabilidade cardiorrespiratória" [ref=f13e134]
              - cell "Sedação, anestesia e hemorragia podem ser mal toleradas." [ref=f13e135]
              - cell "Estabilize e reavalie benefício/risco." [ref=f13e136]
            - row [ref=f13e137]:
              - cell "Trajeto não ressecável ou estruturas críticas no caminho" [ref=f13e138]
              - cell "A coleta pode contaminar uma região que não poderá ser removida." [ref=f13e139]
              - cell "Discuta com o cirurgião definitivo; considere imagem ou encaminhamento." [ref=f13e140]
            - row [ref=f13e141]:
              - cell "Via infectada ou lesão muito vascular" [ref=f13e142]
              - cell "Risco de inoculação, hemorragia ou amostra não diagnóstica." [ref=f13e143]
              - cell "Escolha outro acesso ou outra modalidade quando possível." [ref=f13e144]
            - row [ref=f13e145]:
              - cell "Diagnóstico prévio não mudaria a cirurgia" [ref=f13e146]
              - cell "Duas intervenções podem acrescentar morbidade sem benefício." [ref=f13e147]
              - cell "Considere ressecção direta apropriada, se estadiamento e condição clínica permitirem." [ref=f13e148]
      - paragraph [ref=f13e149]:
        - text: O Withrow cita massas testiculares e algumas massas esplênicas solitárias como exemplos em que a biópsia prévia pode ser desnecessária.
        - strong [ref=f13e150]: Isso não torna toda massa pequena candidata a uma excisão marginal.
        - text: O critério é se a informação mudará a conduta e se a ressecção proposta já é adequada. [1]
      - 'heading "Entenda o trajeto: a cicatriz é só a parte visível" [level=2] [ref=f13e151]'
      - paragraph [ref=f13e152]: "O trajeto é um volume tridimensional: começa na pele ou mucosa, atravessa os tecidos de acesso e termina no local onde a massa foi incisada. Descolamentos, túneis e hematomas também podem ampliar a área exposta. “Tirar a cicatriz depois” não basta se a coleta atravessou um plano profundo diferente daquele que será ressecado. [1,2]"
      - figure [ref=f13e153]:
        - button "Incisão longitudinal contida no campo planejado comparada com uma incisão transversal que ultrapassa esse campo." [ref=f13e154]:
          - img "Incisão longitudinal contida no campo planejado comparada com uma incisão transversal que ultrapassa esse campo."
        - generic [ref=f13e155]:
          - generic [ref=f13e156]: Figura 1 — Planejamento em um membro, em vista superficial. O contorno tracejado representa um campo hipotético de ressecção, não uma margem em centímetros. O acesso deve caber nesse campo em superfície e profundidade. Esquema original baseado em Withrow, cap. 9, e BSAVA Oncology, cap. 6.
          - button "Ampliar imagem" [ref=f13e157] [cursor=pointer]:
            - generic [ref=f13e161]: Ampliar
      - generic [ref=f13e162]:
        - paragraph [ref=f13e163]: Regras anatômicas para escolher a via
        - list [ref=f13e164]:
          - listitem [ref=f13e165]:
            - strong [ref=f13e166]: Imagine a futura ressecção antes de marcar a pele.
            - text: Se houver dúvida, envie fotografia e exames ao cirurgião responsável.
          - listitem [ref=f13e167]:
            - strong [ref=f13e168]: Em membros e cauda, siga o eixo longitudinal.
            - text: Uma cicatriz transversal pode exigir um defeito mais largo e difícil de fechar.
          - listitem [ref=f13e169]:
            - strong [ref=f13e170]: Prefira a via curta que seja oncologicamente ressecável.
            - text: O caminho mais curto não serve se atravessa articulação, vaso importante ou feixe neurovascular.
          - listitem [ref=f13e171]:
            - strong [ref=f13e172]: Evite abrir planos extensos.
            - text: Não descole toda a pseudocápsula nem cruze outro compartimento apenas para obter melhor ângulo.
          - listitem [ref=f13e173]:
            - strong [ref=f13e174]: Preserve os tecidos de reconstrução.
            - text: Uma futura área doadora de retalho não deve ser usada como corredor da biópsia. [1,2]
      - note [ref=f13e175]:
        - paragraph [ref=f13e176]: Pseudocápsula não é margem de segurança
        - paragraph [ref=f13e177]: Em muitos sarcomas, a faixa que parece uma cápsula contém tecido reativo e pode ter relação íntima com células tumorais. “Descolar por fora” não equivale a ressecção oncológica. Para diagnóstico, confirme que a cunha inclui a lesão, e não somente sua cobertura fibrosa. [1,2]
      - heading "A imagem deve vir antes da coleta?" [level=2] [ref=f13e178]
      - paragraph [ref=f13e179]:
        - text: Em uma pequena lesão superficial, o exame clínico pode bastar para escolher o acesso. Nas massas
        - strong [ref=f13e180]: profundas, fixas, grandes ou próximas de osso e estruturas críticas
        - text: ", a imagem ajuda a reconhecer tecido sólido e estruturas no caminho. TC e RM também permitem avaliar a extensão local antes que sangramento e reação à manipulação modifiquem a região."
      - generic [ref=f13e181]:
        - paragraph [ref=f13e182]: Planejamento por localização
        - table [ref=f13e183]:
          - rowgroup [ref=f13e184]:
            - row [ref=f13e185]:
              - columnheader "Apresentação" [ref=f13e186]
              - columnheader "O que esclarecer antes da incisão" [ref=f13e187]
          - rowgroup [ref=f13e188]:
            - row [ref=f13e189]:
              - cell "Massa profunda ou intramuscular" [ref=f13e190]
              - cell "Compartimento de origem, relação com fáscias e feixes neurovasculares; necessidade de coleta guiada." [ref=f13e191]
            - row [ref=f13e192]:
              - cell "Tumor oral ou de cabeça e pescoço" [ref=f13e193]
              - cell "Extensão profunda e envolvimento ósseo; acesso pela mucosa e possibilidade de ressecção." [ref=f13e194]
            - row [ref=f13e195]:
              - cell "Massa heterogênea ou cavitada" [ref=f13e196]
              - cell "Regiões sólidas viáveis alcançáveis sem trajetos adicionais." [ref=f13e197]
            - row [ref=f13e198]:
              - cell "Suspeita de sarcoma felino associado a injeção" [ref=f13e199]
              - cell "Extensão real e relação com parede corporal/músculos antes do tratamento definitivo." [ref=f13e200]
      - paragraph [ref=f13e201]:
        - text: Em massas orais caninas, Nelson & Couto recomendam imagem local, como TC, e biópsia incisional relativamente profunda.
        - strong [ref=f13e202]: "Imagem e histopatologia respondem perguntas diferentes:"
        - text: uma mostra extensão anatômica; a outra identifica o processo tecidual. [1,4]
      - heading "Como escolher uma região representativa" [level=2] [ref=f13e203]
      - paragraph [ref=f13e204]:
        - text: Observe e palpe; use a imagem quando disponível. Procure
        - strong [ref=f13e205]: tecido sólido, viável e compatível com a lesão principal
        - text: . Crosta, exsudato ou ulceração podem representar apenas uma reação secundária. A amostra precisa atingir profundidade suficiente para incluir o processo que causa aquela alteração. [1,2,4]
      - generic [ref=f13e206]:
        - paragraph [ref=f13e207]: A aparência da amostra pode enganar
        - table [ref=f13e208]:
          - rowgroup [ref=f13e209]:
            - row [ref=f13e210]:
              - columnheader "Região escolhida" [ref=f13e211]
              - columnheader "Risco diagnóstico" [ref=f13e212]
              - columnheader "Como melhorar" [ref=f13e213]
          - rowgroup [ref=f13e214]:
            - row [ref=f13e215]:
              - cell "Crosta ou superfície ulcerada" [ref=f13e216]
              - cell "Inflamação e granulação predominam." [ref=f13e217]
              - cell "Alcance tecido lesional sólido em profundidade." [ref=f13e218]
            - row [ref=f13e219]:
              - cell "Centro liquefeito ou necrótico" [ref=f13e220]
              - cell "Ausência de células preservadas e arquitetura útil." [ref=f13e221]
              - cell "Escolha componente viável; não envie só material desvitalizado." [ref=f13e222]
            - row [ref=f13e223]:
              - cell "Pseudocápsula isolada" [ref=f13e224]
              - cell "Fibrose reativa em vez do tumor." [ref=f13e225]
              - cell "Confira que o plano de corte inclui a massa." [ref=f13e226]
            - row [ref=f13e227]:
              - cell "Uma área de massa heterogênea" [ref=f13e228]
              - cell "Subtipo ou grau podem não representar o conjunto." [ref=f13e229]
              - cell "Considere regiões viáveis distintas pela mesma via planejada." [ref=f13e230]
            - row [ref=f13e231]:
              - cell "Interface normal–lesão com ampliação do acesso" [ref=f13e232]
              - cell "Exposição de tecido que não precisaria ser removido." [ref=f13e233]
              - cell "Na suspeita oncológica, priorize tumor dentro do campo ressecável." [ref=f13e234]
      - note [ref=f13e235]:
        - paragraph [ref=f13e236]: "A nuance entre os livros: incluir tecido normal?"
        - paragraph [ref=f13e237]: O BSAVA descreve a interface como útil em algumas lesões. O Withrow ressalva que, na suspeita de neoplasia, não se deve ampliar deliberadamente o acesso em tecidos antes não envolvidos apenas para incluí-la. Dermatoses inflamatórias seguem outra lógica de seleção de borda/superfície, combinada com o dermatopatologista. [1–3]
      - note [ref=f13e238]:
        - paragraph [ref=f13e239]: Necrose conta para o grau, mas necrose isolada não basta
        - paragraph [ref=f13e240]:
          - text: A necrose participa de sistemas de graduação de sarcomas. A meta é obter
          - strong [ref=f13e241]: tumor viável e representativo da heterogeneidade
          - text: ", sem transformar a coleta em múltiplos trajetos. A peça inteira continua necessária para a avaliação definitiva. [1,5,6]"
      - 'heading "Materiais: prepare a cirurgia e a bancada" [level=2] [ref=f13e242]'
      - generic [ref=f13e243]:
        - paragraph [ref=f13e244]: Tudo pronto antes de iniciar
        - table [ref=f13e245]:
          - rowgroup [ref=f13e246]:
            - row [ref=f13e247]:
              - columnheader "Finalidade" [ref=f13e248]
              - columnheader "Materiais" [ref=f13e249]
              - columnheader "Verificação útil" [ref=f13e250]
          - rowgroup [ref=f13e251]:
            - row [ref=f13e252]:
              - cell "Campo" [ref=f13e253]
              - cell "Tricotomia, antisséptico apropriado, campos, luvas estéreis e iluminação." [ref=f13e254]
              - cell "Exposição suficiente para reconhecer anatomia e controlar sangramento." [ref=f13e255]
            - row [ref=f13e256]:
              - cell "Coleta" [ref=f13e257]
              - cell "Cabo e lâmina nº 10 ou 15, pinça delicada, tesoura fina." [ref=f13e258]
              - cell "Instrumentos cortantes e atraumáticos; cautério não recorta o fragmento diagnóstico." [ref=f13e259]
            - row [ref=f13e260]:
              - cell "Hemostasia/fechamento" [ref=f13e261]
              - cell "Gazes, hemostáticas, ligaduras, cautério quando disponível, porta-agulha e suturas." [ref=f13e262]
              - cell "Plano compatível com profundidade e vascularização." [ref=f13e263]
            - row [ref=f13e264]:
              - cell "Histologia" [ref=f13e265]
              - cell "Frasco estanque de boca larga, rotulado, com formalina tamponada neutra 10%." [ref=f13e266]
              - cell "Volume suficiente e abertura que permita retirar o tecido endurecido." [ref=f13e267]
            - row [ref=f13e268]:
              - cell "Citologia" [ref=f13e269]
              - cell "Lâminas limpas, lápis de identificação, porta-lâminas separado." [ref=f13e270]
              - cell "Imprint antes da formalina, se indicado." [ref=f13e271]
            - row [ref=f13e272]:
              - cell "Exames adicionais" [ref=f13e273]
              - cell "Recipiente estéril e meio definido com o laboratório." [ref=f13e274]
              - cell "Separar material fresco antes de fixar." [ref=f13e275]
            - row [ref=f13e276]:
              - cell "Documentação" [ref=f13e277]
              - cell "Régua/escala, câmera, desenho anatômico e formulário." [ref=f13e278]
              - cell "Vincular cada frasco ao local e à profundidade." [ref=f13e279]
      - paragraph [ref=f13e280]:
        - text: "Combine quem receberá e identificará o fragmento. Evite deixá-lo sobre gaze enquanto alguém procura o frasco:"
        - strong [ref=f13e281]: ressecar, comprimir e atrasar a fixação diminuem a qualidade diagnóstica
        - text: . [1–3]
      - heading "Avaliação do paciente, anestesia e analgesia" [level=2] [ref=f13e282]
      - paragraph [ref=f13e283]: Revise estado clínico, comorbidades, medicamentos, sangramentos prévios e exames disponíveis. A investigação hematológica e da hemostasia deve refletir o risco do paciente e da lesão. Localização, profundidade, temperamento e controle da via aérea determinam o plano anestésico.
      - generic [ref=f13e284]:
        - paragraph [ref=f13e285]: Anestesia orientada pelo procedimento
        - table [ref=f13e286]:
          - rowgroup [ref=f13e287]:
            - row [ref=f13e288]:
              - columnheader "Cenário" [ref=f13e289]
              - columnheader "Abordagem a considerar" [ref=f13e290]
              - columnheader "O que garantir" [ref=f13e291]
          - rowgroup [ref=f13e292]:
            - row [ref=f13e293]:
              - cell "Massa superficial, paciente cooperativo" [ref=f13e294]
              - cell "Sedação quando necessária, anestesia local e analgesia." [ref=f13e295]
              - cell "Imobilidade e anestesia dos tecidos atravessados." [ref=f13e296]
            - row [ref=f13e297]:
              - cell "Massa profunda, área sensível ou posição difícil" [ref=f13e298]
              - cell "Anestesia geral costuma facilitar controle e precisão." [ref=f13e299]
              - cell "Analgesia, monitorização e acesso para hemostasia." [ref=f13e300]
            - row [ref=f13e301]:
              - cell "Cavidade oral" [ref=f13e302]
