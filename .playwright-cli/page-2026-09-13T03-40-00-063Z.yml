      - note [ref=f13e305]:
        - paragraph [ref=f13e306]: Sedação não substitui analgesia
        - paragraph [ref=f13e307]:
          - text: Mesmo quando o tumor tem pouca inervação,
          - strong [ref=f13e308]: pele, subcutâneo, mucosa e músculo são dolorosos
          - text: . Anestesie o acesso ou use bloqueio regional apropriado; calcule a dose total conforme espécie, peso e condição clínica. Ausência de movimento não confirma ausência de dor. [1–3]
      - heading "Passo 1 — documentar, posicionar e marcar" [level=2] [ref=f13e309]
      - generic [ref=f13e310]:
        - paragraph [ref=f13e311]: Antes de alterar a aparência da lesão
        - list [ref=f13e312]:
          - listitem [ref=f13e313]:
            - strong [ref=f13e314]: "Registre a massa:"
            - text: local anatômico, três dimensões quando possível, mobilidade, fixação, ulceração e crescimento. Fotografe com escala.
          - listitem [ref=f13e315]:
            - strong [ref=f13e316]: Posicione com acesso e iluminação adequados
            - text: ", permitindo coleta e hemostasia sem tração excessiva."
          - listitem [ref=f13e317]:
            - strong [ref=f13e318]: Marque a pequena incisão dentro do futuro campo cirúrgico.
            - text: Confirme que o trajeto profundo também poderá ser retirado.
          - listitem [ref=f13e319]:
            - strong [ref=f13e320]: Defina os nomes das amostras
            - text: para reproduzi-los no desenho e nos frascos.
          - listitem [ref=f13e321]:
            - strong [ref=f13e322]: "Confirme os destinos:"
            - text: histologia, imprint e eventual cultura. Decida a divisão antes de mergulhar tudo em formalina. [1,2]
      - note [ref=f13e323]:
        - paragraph [ref=f13e324]: Ponto de checagem
        - paragraph [ref=f13e325]: "Você deve conseguir explicar: “Vou entrar por este ponto, colher esta região e retirar este trajeto junto com a massa na cirurgia definitiva”. Se isso não estiver claro, reveja o acesso antes de cortar."
      - heading "Passo 2 — preparar o campo e anestesiar o acesso" [level=2] [ref=f13e326]
      - generic [ref=f13e327]:
        - paragraph [ref=f13e328]: Preparo da biópsia aberta de uma massa
        - list [ref=f13e329]:
          - listitem [ref=f13e330]: Faça tricotomia que permita visualizar a anatomia e trabalhar se houver sangramento; retire pelos soltos.
          - listitem [ref=f13e331]: Prepare pele e campo de forma asséptica, com antisséptico compatível com a região; evite produtos inadequados para mucosas ou olhos.
          - listitem [ref=f13e332]: Em lesão ulcerada, cuide da contaminação superficial sem traumatizar agressivamente o interior da massa.
          - listitem [ref=f13e333]: Anestesie a via de acesso ou faça o bloqueio indicado. Evite distorcer o alvo com infiltrações desnecessárias no fragmento a enviar.
          - listitem [ref=f13e334]: Aguarde e confira o efeito antes da incisão; ajuste analgesia ou anestesia se houver reação. [1–3]
      - note [ref=f13e335]:
        - paragraph [ref=f13e336]: Massa tumoral não é o mesmo que dermatose
        - paragraph [ref=f13e337]: O preparo mínimo descrito no BSAVA Procedures para punch dermatológico preserva estruturas superficiais das lesões cutâneas. Isso não deve ser transferido automaticamente para uma biópsia aberta de massa subcutânea, que exige campo cirúrgico asséptico. O objetivo diagnóstico determina o preparo. [1,3]
      - heading "Passo 3 — incisar a pele e expor apenas o necessário" [level=2] [ref=f13e338]
      - generic [ref=f13e339]:
        - paragraph [ref=f13e340]: Acesso controlado
        - list [ref=f13e341]:
          - listitem [ref=f13e342]: Estabilize suavemente a região sem comprimir vigorosamente o tumor.
          - listitem [ref=f13e343]:
            - text: Faça uma
            - strong [ref=f13e344]: incisão linear, curta e orientada pelo planejamento
            - text: . Curta significa suficiente para enxergar e colher; não tão estreita que obrigue tração e esmagamento.
          - listitem [ref=f13e345]: Se a pele sobre a massa for normal e não aderida, abra o acesso sem retirar uma grande elipse de pele normal.
          - listitem [ref=f13e346]: Exponha a região selecionada com mínima dissecção. Diferencie o componente sólido de gordura, tecido reativo e pseudocápsula.
          - listitem [ref=f13e347]: Se anatomia ou vascularização forem diferentes do previsto, reavalie antes de aprofundar às cegas. [1,2]
      - note [ref=f13e348]:
        - paragraph [ref=f13e349]: Não transforme a biópsia em exploração
        - paragraph [ref=f13e350]: Não circunde a massa por dissecção nem abra um amplo plano fascial para “ver melhor”. Superfícies adicionais expostas podem ampliar o campo de preocupação oncológica. A visão deve ser adequada, com acesso restrito ao necessário. [1,2]
      - 'heading "Passo 4 — retirar a cunha: como o bisturi trabalha" [level=2] [ref=f13e351]'
      - paragraph [ref=f13e352]:
        - text: A cunha é um fragmento com volume e profundidade, obtido por cortes que convergem dentro do tecido lesional. Não é uma raspagem nem exige ângulo geométrico exato. O formato deve permitir
        - strong [ref=f13e353]: preservar arquitetura e liberar a base com controle visual
        - text: ", respeitando a anatomia. [1]"
      - figure [ref=f13e354]:
        - button "Corte esquemático com tecido viável, região superficial alterada e cunha profunda contida na massa." [ref=f13e355]:
          - img "Corte esquemático com tecido viável, região superficial alterada e cunha profunda contida na massa."
        - generic [ref=f13e356]:
          - generic [ref=f13e357]: Figura 2 — Os planos de corte convergem dentro de uma região viável e a base é liberada sob visão. O desenho não define profundidade, ângulo ou tamanho universais e não representa um órgão específico. Esquema original baseado em Withrow, cap. 9.
          - button "Ampliar imagem" [ref=f13e358] [cursor=pointer]:
            - generic [ref=f13e362]: Ampliar
      - generic [ref=f13e363]:
        - paragraph [ref=f13e364]: Coleta com instrumento frio
        - list [ref=f13e365]:
          - listitem [ref=f13e366]:
            - strong [ref=f13e367]: Escolha os limites sobre tecido viável.
            - text: Se há ulceração, alcance a lesão abaixo ou ao lado da superfície alterada, sem colher somente crosta.
          - listitem [ref=f13e368]:
            - strong [ref=f13e369]: Faça o primeiro plano de corte com bisturi
            - text: ", até profundidade suficiente para incluir tecido representativo."
          - listitem [ref=f13e370]:
            - strong [ref=f13e371]: Faça o segundo plano convergente
            - text: ", delimitando uma cunha de espessura útil. Permaneça no tumor acessível; não procure uma margem normal profunda."
          - listitem [ref=f13e372]:
            - strong [ref=f13e373]: Sustente a periferia delicadamente e libere a base sob visão
            - text: ", com lâmina ou tesoura fina quando apropriado. Não arranque o fragmento pela tração."
          - listitem [ref=f13e374]:
            - strong [ref=f13e375]: "Inspecione o material:"
            - text: há tecido sólido e íntegro ou só gordura, cápsula, coágulo e material friável? A conferência macroscópica orienta, mas não confirma sozinha que há tumor.
          - listitem [ref=f13e376]:
            - strong [ref=f13e377]: Se necessário, obtenha outra região viável pelo mesmo acesso planejado
            - text: ", documentando sua origem. Não crie incisões indiscriminadamente para compensar uma seleção inadequada. [1,2]"
      - note [ref=f13e378]:
        - paragraph [ref=f13e379]: Qual deve ser o tamanho da cunha?
        - paragraph [ref=f13e380]: Não existe uma dimensão única para toda massa. O fragmento precisa preservar arquitetura e profundidade lesional útil; a decisão depende da anatomia e da pergunta ao patologista. Combine necessidades especiais com o laboratório. O limite de espessura para fixação não é uma profundidade obrigatória de corte.
      - heading "Passo 5 — manipular sem destruir a informação" [level=2] [ref=f13e381]
      - paragraph [ref=f13e382]:
        - text: O patologista precisa reconhecer células e as relações entre elas. A pinça pode amassar núcleos; a tração pode romper o fragmento; o calor pode coagular e deformar o tecido. Uma amostra retirada do lugar certo pode se tornar pouco útil por
        - strong [ref=f13e383]: artefato de coleta
        - text: . [1–3]
      - generic [ref=f13e384]:
        - paragraph [ref=f13e385]: Manobra → efeito sobre a amostra
        - table [ref=f13e386]:
          - rowgroup [ref=f13e387]:
            - row [ref=f13e388]:
              - columnheader "Evite" [ref=f13e389]
              - columnheader "O que acontece" [ref=f13e390]
              - columnheader "Faça assim" [ref=f13e391]
          - rowgroup [ref=f13e392]:
            - row [ref=f13e393]:
              - cell "Pinçar o centro com força" [ref=f13e394]
              - cell "Esmagamento e perda de detalhes celulares." [ref=f13e395]
              - cell "Manipule a periferia, com instrumento delicado e mínima pressão." [ref=f13e396]
            - row [ref=f13e397]:
              - cell "Puxar a amostra ainda presa" [ref=f13e398]
              - cell "Rasgo e distorção da arquitetura." [ref=f13e399]
              - cell "Libere a base com corte antes de transferir." [ref=f13e400]
            - row [ref=f13e401]:
              - cell "Cautério ou laser para recortar" [ref=f13e402]
              - cell "Artefato térmico no tecido diagnóstico." [ref=f13e403]
              - cell "Instrumento frio; energia para hemostasia após a retirada." [ref=f13e404]
            - row [ref=f13e405]:
              - cell "Esquecer sobre gaze seca" [ref=f13e406]
              - cell "Desidratação e aderência ao tecido." [ref=f13e407]
              - cell "Transfira prontamente para o destino apropriado." [ref=f13e408]
            - row [ref=f13e409]:
              - cell "Fragmentar repetidamente na bancada" [ref=f13e410]
              - cell "Perda de orientação e de áreas úteis." [ref=f13e411]
              - cell "Preserve o fragmento; combine cortes necessários com o laboratório." [ref=f13e412]
      - heading "Passo 6 — fazer imprint, quando ele ajudar" [level=2] [ref=f13e413]
      - paragraph [ref=f13e414]:
        - text: O imprint é uma impressão citológica da superfície recém-cortada. Pode fornecer informação celular complementar e ajudar a correlacionar o material com a suspeita clínica.
        - strong [ref=f13e415]: Não substitui a histopatologia
        - text: ; uma impressão pobre em células não invalida automaticamente o fragmento. [1,2]
      - generic [ref=f13e416]:
        - paragraph [ref=f13e417]: Impressão antes de fixar
        - list [ref=f13e418]:
          - listitem [ref=f13e419]: Identifique previamente as lâminas e separe um porta-lâminas seco.
          - listitem [ref=f13e420]: Retire delicadamente o excesso de sangue da superfície, sem comprimir nem deixar o tecido ressecar.
          - listitem [ref=f13e421]: Encoste a face recém-cortada no vidro em toques suaves. Não esfregue nem arraste o fragmento como uma raspagem.
          - listitem [ref=f13e422]: Deixe as impressões secarem ao ar e encaminhe-as identificadas para citologia.
          - listitem [ref=f13e423]: Coloque o fragmento no fixador logo após a impressão; embale as lâminas separadamente dos frascos de formalina. [1,2]
      - note [ref=f13e424]:
        - paragraph [ref=f13e425]: Formalina e citologia não compartilham embalagem
        - paragraph [ref=f13e426]:
          - mark [ref=f13e427]: Os vapores de formalina prejudicam as lâminas citológicas.
          - text: "Não basta deixar a lâmina fora do líquido: mantenha seu porta-lâminas separado da embalagem que contém o fixador. [2]"
      - heading "Passo 7 — hemostasia e fechamento" [level=2] [ref=f13e428]
      - generic [ref=f13e429]:
        - paragraph [ref=f13e430]: Depois de retirar a amostra
        - list [ref=f13e431]:
          - listitem [ref=f13e432]:
            - strong [ref=f13e433]: "Controle o sangramento com visão direta:"
            - text: compressão, ligadura ou cautério seletivo conforme o local. Evite manobras cegas perto de estruturas importantes.
          - listitem [ref=f13e434]:
            - strong [ref=f13e435]: Reavalie o leito antes de fechar.
            - text: Fechar a pele sobre uma hemorragia favorece hematoma e dificulta avaliar sua extensão.
          - listitem [ref=f13e436]:
            - strong [ref=f13e437]: Reduza o espaço morto quando necessário
            - text: ", sem ampliar a dissecção para produzir um fechamento mais elaborado."
          - listitem [ref=f13e438]:
            - strong [ref=f13e439]: Aproxime os planos de forma simples e atraumática
            - text: ", com material e padrão adequados à região, tensão e qualidade tecidual."
          - listitem [ref=f13e440]:
            - strong [ref=f13e441]: Evite drenos quando possível.
            - text: Se inevitáveis, sua via e saída precisam ser planejadas como parte do campo potencialmente contaminado e documentadas.
          - listitem [ref=f13e442]:
            - strong [ref=f13e443]: Fotografe o resultado e registre o trajeto profundo
            - text: ", número de fragmentos e qualquer hematoma ou intercorrência. [1,2]"
      - note [ref=f13e444]:
        - paragraph [ref=f13e445]: Por que o hematoma importa além do sangramento?
        - paragraph [ref=f13e446]: O sangue pode se distribuir por planos que não foram diretamente incisados. Minimizar hematoma, seroma e espaço morto é uma medida preventiva para limitar a exposição local a células tumorais. Isso não significa que toda biópsia dissemina câncer nem fornece uma incidência universal de implantação. [1,2]
      - 'heading "Fixação: como conservar o que foi coletado" [level=2] [ref=f13e447]'
