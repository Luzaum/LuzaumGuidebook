      - heading "Referências técnicas e leitura crítica" [level=2] [ref=f13e743]
      - paragraph [ref=f13e744]: Os capítulos abaixo foram consultados no acervo local. Os números entre colchetes identificam as fontes; as páginas são as impressas nos livros. Os artigos complementam pontos específicos de diagnóstico, submissão e representatividade.
