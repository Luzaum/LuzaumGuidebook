      - note [ref=f13e788]:
        - paragraph [ref=f13e789]: Como ler o peso das fontes
        - paragraph [ref=f13e790]: Os livros fundamentam a técnica; os consensos reúnem recomendações; Ferraris quantifica um desfecho em uma amostra específica; a fotografia ilustra um caso. Esses tipos de evidência não são intercambiáveis. Os esquemas são didáticos e não definem margens, ângulos ou profundidades universais.
