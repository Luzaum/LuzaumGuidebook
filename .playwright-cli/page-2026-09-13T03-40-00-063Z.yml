            - strong [ref=f13e532]: Entre pela mucosa oral.
            - text: No melanoma oral, o consenso recomenda evitar via transcutânea que crie outro trajeto e comprometa a futura ressecção.
          - listitem [ref=f13e533]: Selecione componente sólido e obtenha profundidade suficiente para não enviar apenas superfície ulcerada.
          - listitem [ref=f13e534]: Controle o sangramento e confira a cavidade antes da recuperação; se usar tampão faríngeo, registre e confirme sua retirada.
          - listitem [ref=f13e535]: Planeje analgesia e alimentação conforme local, dor e capacidade de deglutir. [4,8]
      - note [ref=f13e536]:
        - paragraph [ref=f13e537]: Laudo “inflamatório” em massa oral agressiva
        - paragraph [ref=f13e538]: Crescimento rápido, destruição ou fixação importantes não devem ser ignorados diante de uma amostra superficial. Discuta profundidade e representatividade com o patologista; considere nova coleta, revisão ou imuno-histoquímica conforme a suspeita. [1,4,8]
      - heading "Sarcomas em cães e massas em locais de injeção nos gatos" [level=2] [ref=f13e539]
      - heading "Cão — sarcoma de tecidos moles" [level=3] [ref=f13e540]
      - paragraph [ref=f13e541]:
        - text: Em uma massa grande ou de cirurgia complexa, conhecer o diagnóstico antes da ressecção permite discutir extensão, reconstrução e terapias complementares. O consenso ABROVET 2026 recomenda biópsia antes do tratamento definitivo nesses cenários e reforça que a
        - strong [ref=f13e542]: peça completa deve voltar à histopatologia
        - text: ", mesmo com diagnóstico incisional prévio. [5]"
      - heading "Gato — suspeita de sarcoma associado ao local de injeção" [level=3] [ref=f13e543]
      - paragraph [ref=f13e544]: Uma massa suspeita nesse contexto exige atenção ao comportamento infiltrativo e à possibilidade de cirurgia extensa. Planeje a coleta e o trajeto com a equipe que fará o tratamento, obtenha diagnóstico e determine a extensão local. A sequência de imagem e biópsia deve ser ajustada ao planejamento do caso. [1,2]
      - note [ref=f13e545]:
        - paragraph [ref=f13e546]: Não “descascar a bolinha” para descobrir depois
        - paragraph [ref=f13e547]:
          - text: Retirar marginalmente uma massa infiltrativa pode deixar extensões microscópicas e transformar a próxima intervenção em ressecção de tumor residual, cicatriz e planos manipulados.
          - strong [ref=f13e548]: A primeira cirurgia definitiva deve ser planejada
          - text: ; a biópsia diagnóstica precisa preservar essa oportunidade. [1,2,5]
      - heading "O que o laudo pode — e não pode — responder" [level=2] [ref=f13e549]
      - generic [ref=f13e550]:
        - paragraph [ref=f13e551]: Interprete a resposta na escala da amostra
        - table [ref=f13e552]:
          - rowgroup [ref=f13e553]:
            - row [ref=f13e554]:
              - columnheader "Pergunta" [ref=f13e555]
              - columnheader "O que pode fornecer" [ref=f13e556]
              - columnheader "Limite" [ref=f13e557]
          - rowgroup [ref=f13e558]:
            - row [ref=f13e559]:
              - cell "Existe neoplasia?" [ref=f13e560]
              - cell "Identificação do processo e diferenciais." [ref=f13e561]
              - cell "Tecido reativo, necrótico ou superficial pode não representar a lesão." [ref=f13e562]
            - row [ref=f13e563]:
              - cell "Qual é o tipo?" [ref=f13e564]
              - cell "Linhagem e subtipo quando a morfologia permite." [ref=f13e565]
              - cell "Imuno-histoquímica ou outros exames podem ser necessários." [ref=f13e566]
            - row [ref=f13e567]:
              - cell "Qual é o grau?" [ref=f13e568]
              - cell "Graduação nos tumores com sistema aplicável." [ref=f13e569]
              - cell "Pode ser subestimado; reavaliar a peça inteira." [ref=f13e570]
            - row [ref=f13e571]:
              - cell "Há invasão?" [ref=f13e572]
              - cell "Invasão presente no fragmento." [ref=f13e573]
              - cell "Ausência no fragmento não exclui invasão em outra região." [ref=f13e574]
            - row [ref=f13e575]:
              - cell "As margens estão livres?" [ref=f13e576]
              - cell [ref=f13e577]:
                - strong [ref=f13e578]: Não avalia margens definitivas.
              - cell "Por definição, a massa permaneceu no paciente." [ref=f13e579]
            - row [ref=f13e580]:
              - cell "Qual é o prognóstico?" [ref=f13e581]
              - cell "Dados histológicos que contribuem para estimá-lo." [ref=f13e582]
              - cell "Depende também de extensão/estádio, local, tratamento e paciente." [ref=f13e583]
      - paragraph [ref=f13e584]: Não atribua uma sensibilidade, especificidade ou “acurácia de 95%” universal à técnica. O desempenho muda com lesão, alvo, tamanho, profundidade e processamento. Estudos de concordância de graduação respondem uma pergunta específica; não medem todas essas situações. [1,5,6]
      - 'heading "Evidência clínica: por que uma amostra pode subgraduar" [level=2] [ref=f13e585]'
      - paragraph [ref=f13e586]:
        - text: Ferraris e colaboradores estudaram prospectivamente
        - strong [ref=f13e587]: 32 cães com sarcomas cutâneos/subcutâneos
        - text: . Após a excisão, coletaram três amostras por punch — uma central e duas periféricas — e compararam a graduação com a da massa inteira. [6]
      - figure [ref=f13e588]:
        - button "Concordância de grau de 71% na amostra central e 59% na periférica; subgraduação de 29% e 40,5%." [ref=f13e589]:
          - img "Concordância de grau de 71% na amostra central e 59% na periférica; subgraduação de 29% e 40,5%."
        - generic [ref=f13e590]:
          - generic [ref=f13e591]: "Figura 5 — Ferraris et al., 2026: 32 cães, amostras por punch após excisão. Concordância e subgraduação são desfechos distintos; não somam necessariamente 100%. Gráfico original com os resultados publicados."
          - button "Ampliar imagem" [ref=f13e592] [cursor=pointer]:
            - generic [ref=f13e596]: Ampliar
      - note [ref=f13e597]:
        - paragraph [ref=f13e598]: O que muda na prática — e o que o estudo não prova
        - paragraph [ref=f13e599]:
          - text: Pelo menos duas regiões aumentaram a chance de prever o grau definitivo no estudo. Isso reforça representatividade, mas
          - strong [ref=f13e600]: não determina três punções para todo paciente nem a coleta de um centro necrótico
          - text: . As amostras foram obtidas após excisão, fora do paciente; os resultados não validam qualquer trajeto pré-operatório nem todos os tumores. [6]
      - paragraph [ref=f13e601]:
        - text: O consenso ABROVET cita diferenças de graduação pré-operatória em
        - strong [ref=f13e602]: 12–29%
        - text: dos casos de estudos anteriores. É outra síntese, não um intervalo universal nem os mesmos dados do gráfico. Em ambos os contextos, a consequência é reavaliar a peça definitiva. [5]
      - 'heading "Laudo discordante: como resolver" [level=2] [ref=f13e603]'
      - generic [ref=f13e604]:
        - paragraph [ref=f13e605]: Quando a histologia não explica o paciente
        - list [ref=f13e606]:
          - listitem [ref=f13e607]:
            - strong [ref=f13e608]: Confira identidade, local e tipo de amostra.
            - text: O laudo corresponde ao fragmento e à região enviados?
          - listitem [ref=f13e609]:
            - strong [ref=f13e610]: "Leia a adequação:"
            - text: necrose, inflamação superficial, artefato, pequeno tamanho ou insuficiência de material.
          - listitem [ref=f13e611]:
            - strong [ref=f13e612]: Converse com o patologista
            - text: ", mostrando fotografias, citologia e imagem. Pergunte se os achados explicam crescimento e invasividade."
          - listitem [ref=f13e613]:
            - strong [ref=f13e614]: Discuta recortes, colorações, imuno-histoquímica ou segunda opinião
            - text: ", conforme hipótese e material disponível."
          - listitem [ref=f13e615]:
            - strong [ref=f13e616]: Se o problema é amostragem, planeje nova coleta representativa.
            - text: Repetir o mesmo acesso superficial pode repetir a falha.
          - listitem [ref=f13e617]:
            - strong [ref=f13e618]: Reavalie a estratégia após essa correlação
            - text: ", antes de uma intervenção irreversível apoiada em resultado pouco compatível. [1,2,8]"
      - note [ref=f13e619]:
        - paragraph [ref=f13e620]: "Exemplo: “fibrose e inflamação” não encerra toda investigação"
        - paragraph [ref=f13e621]: Em uma massa de crescimento lento e contexto inflamatório plausível, pode ser coerente. Em uma massa destrutiva e progressiva, pergunte se foi coletada apenas sua cobertura reativa. O laudo precisa ser interpretado junto do paciente, e não aceito ou descartado automaticamente.
      - 'heading "Complicações: prevenção e resposta inicial" [level=2] [ref=f13e622]'
      - generic [ref=f13e623]:
        - paragraph [ref=f13e624]: Reconhecer o problema cedo
        - table [ref=f13e625]:
          - rowgroup [ref=f13e626]:
            - row [ref=f13e627]:
              - columnheader "Problema" [ref=f13e628]
              - columnheader "Mecanismo / pista" [ref=f13e629]
              - columnheader "Prevenção e resposta" [ref=f13e630]
          - rowgroup [ref=f13e631]:
            - row [ref=f13e632]:
              - cell "Hemorragia ou hematoma expansivo" [ref=f13e633]
              - cell "Lesão vascular, hemostasia incompleta ou alteração sistêmica." [ref=f13e634]
              - cell "Controle direto e reavaliação clínica; não apenas suturar sobre o sangramento." [ref=f13e635]
            - row [ref=f13e636]:
              - cell "Seroma" [ref=f13e637]
              - cell "Espaço morto e dissecção extensa." [ref=f13e638]
              - cell "Limitar dissecção e tratar o espaço morto sem criar corredores desnecessários." [ref=f13e639]
            - row [ref=f13e640]:
              - cell "Deiscência" [ref=f13e641]
              - cell "Tensão, infecção ou tecido comprometido." [ref=f13e642]
              - cell "Fechamento atraumático; revisar viabilidade, tensão e contaminação." [ref=f13e643]
            - row [ref=f13e644]:
              - cell "Infecção" [ref=f13e645]
              - cell "Contaminação do acesso ou ferida." [ref=f13e646]
              - cell "Assepsia e acompanhamento; avaliar necessidade de tratamento dirigido." [ref=f13e647]
            - row [ref=f13e648]:
              - cell "Dor / dificuldade de alimentação" [ref=f13e649]
              - cell "Trauma de tecidos sensíveis, principalmente na boca." [ref=f13e650]
              - cell "Analgesia, suporte e reavaliação funcional." [ref=f13e651]
            - row [ref=f13e652]:
              - cell "Amostra não diagnóstica" [ref=f13e653]
              - cell "Alvo errado, superficialidade, necrose ou artefato." [ref=f13e654]
              - cell "Revisar seleção e técnica; nova coleta quando indicada." [ref=f13e655]
            - row [ref=f13e656]:
              - cell "Campo definitivo comprometido" [ref=f13e657]
              - cell "Trajeto mal posicionado, hematoma ou planos cruzados." [ref=f13e658]
              - cell "Planejar antes e documentar a área manipulada para a discussão cirúrgica." [ref=f13e659]
      - heading "Pós-procedimento e continuidade do tratamento" [level=2] [ref=f13e660]
      - list [ref=f13e661]:
        - listitem [ref=f13e662]:
          - strong [ref=f13e663]: "Recuperação imediata:"
          - text: monitore sangramento, aumento de volume, dor e recuperação anestésica. Na boca, avalie também via aérea e deglutição.
        - listitem [ref=f13e664]:
          - strong [ref=f13e665]: "Proteção da ferida:"
          - text: impeça lambedura e trauma; limite atividade conforme local. Defina reavaliação e retirada de sutura conforme o fechamento.
        - listitem [ref=f13e666]:
          - strong [ref=f13e667]: "Retorno antecipado:"
          - text: sangramento persistente, aumento rápido de volume, secreção, abertura da ferida, dor progressiva ou dificuldade respiratória/alimentar.
        - listitem [ref=f13e668]:
          - strong [ref=f13e669]: "Rastreie o exame:"
          - text: confirme envio e previsão do laudo; atribua a alguém a responsabilidade pelo retorno e comunicação ao tutor.
        - listitem [ref=f13e670]:
          - strong [ref=f13e671]: "Planeje o tratamento após a resposta:"
          - text: encaminhe fotos/mapa; remova tumor e trajeto em bloco quando indicada ressecção com intenção curativa. [1,2]
      - paragraph [ref=f13e672]: A sutura que cicatrizou bem não encerra o caso. O seguimento inclui interpretar o resultado, resolver discordâncias e transformar a informação em um plano terapêutico.
      - heading "Fluxo clínico — da indicação ao tratamento" [level=2] [ref=f13e673]
      - generic [ref=f13e675]:
        - paragraph [ref=f13e676]: Sequência principal de trabalho
        - list [ref=f13e677]:
          - listitem [ref=f13e678]: Definir a pergunta clínica
          - listitem [ref=f13e679]: Planejar imagem, campo e trajeto
          - listitem [ref=f13e680]: Coletar cunha viável com instrumento frio
          - listitem [ref=f13e681]: Fixar, identificar e enviar com histórico
          - listitem [ref=f13e682]: Correlacionar laudo e paciente
          - listitem [ref=f13e683]: Definir tratamento e destino do trajeto
      - note [ref=f13e684]:
        - paragraph [ref=f13e685]: Duas situações interrompem o fluxo
        - paragraph [ref=f13e686]:
          - strong [ref=f13e687]: "Trajeto inadequado antes da coleta:"
          - text: replanejar ou encaminhar.
          - strong [ref=f13e688]: "Laudo incompatível depois da coleta:"
          - text: discutir adequação, revisão e eventual nova biópsia. Não seguir automaticamente para uma ressecção baseada em informação insuficiente.
      - heading "Box de bolso — antes, durante e depois" [level=2] [ref=f13e689]
      - note [ref=f13e690]:
        - paragraph [ref=f13e691]: Oito pontos para memorizar
        - paragraph [ref=f13e692]:
          - strong [ref=f13e693]: "PERGUNTA:"
          - text: o diagnóstico muda a conduta?
          - strong [ref=f13e694]: "TRAJETO:"
          - text: cabe na futura ressecção em superfície e profundidade?
          - strong [ref=f13e695]: "ALVO:"
          - text: tecido viável e representativo, não apenas crosta/cápsula?
          - strong [ref=f13e696]: "DOR:"
          - text: os tecidos do acesso estão anestesiados?
          - strong [ref=f13e697]: "COLETA:"
          - text: cunha com instrumento frio, sem esmagar nem arrancar?
          - strong [ref=f13e698]: "HEMOSTASIA:"
          - text: leito controlado, mínimo espaço morto e trajeto documentado?
          - strong [ref=f13e699]: "ENVIO:"
          - text: formalina 10%, 1:10, identificação e lâminas separadas?
          - strong [ref=f13e700]: "LAUDO:"
          - text: coerente com a clínica e incorporado ao plano definitivo?
