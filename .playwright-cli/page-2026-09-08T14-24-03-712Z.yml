      - main [ref=f2e99]:
        - paragraph [ref=f2e100]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=f2e102]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=f2e103]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=f2e104]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=f2e105]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=f2e106]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=f2e107]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=f2e108]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=f2e109]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=f2e110]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=f2e111]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=f2e112]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=f2e113]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=f2e114]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=f2e115]: própria.
        - paragraph [ref=f2e116]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=f2e117]: manter e quando repetir exames.
        - paragraph [ref=f2e119]: SINAIS PARA RETORNO
        - paragraph [ref=f2e121]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=f2e122]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=f2e123]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=f2e124]: apetite.
