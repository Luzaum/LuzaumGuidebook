                  - generic [ref=f4e250]:
                    - heading "Fundamentos Clínicos & Evidências Farmacológicas" [level=3] [ref=f4e251]
                    - paragraph [ref=f4e252]: Mecanismos, aplicação clínica e referências específicas deste medicamento
                  - generic [ref=f4e253]:
                    - article [ref=f4e254]:
                      - heading "1 Mecanismo de ação bactericida e inibição suicida de beta-lactamases" [level=4] [ref=f4e255]:
                        - generic [ref=f4e256]: "1"
                        - text: Mecanismo de ação bactericida e inibição suicida de beta-lactamases
                      - generic [ref=f4e257]: A amoxicilina é uma aminopenicilina semissintética de ação bactericida dependente do tempo, que se liga covalentemente às proteínas ligadoras de penicilina (PBPs), inibindo a transpeptidação terminal da síntese da parede celular de peptidoglicano e ativando autolisinas endógenas que culminam na lise bacteriana osmótica. O ácido clavulânico atua como um inibidor suicida progressivo e irreversível de beta-lactamases das classes funcionais de Ambler A (incluindo penicilinases estafilocócicas e beta-lactamases de espectro ampliado de Gram-negativos). Ao ligar-se ao sítio ativo da enzima bacteriana, o clavulanato é hidrolisado e forma um intermediário acil-enzima estável que inativa a defesa bacteriana, protegendo a integridade da molécula de amoxicilina e restaurando a sensibilidade em cepas de Staphylococcus pseudintermedius, Escherichia coli e Klebsiella spp.
                    - article [ref=f4e258]:
                      - heading "2 Farmacodinâmica tempo-dependente e a regra farmacológica de 50% T > CIM" [level=4] [ref=f4e259]:
                        - generic [ref=f4e260]: "2"
                        - text: Farmacodinâmica tempo-dependente e a regra farmacológica de 50% T > CIM
                      - generic [ref=f4e261]: Como antimicrobiano beta-lactâmico clássico, o índice farmacodinâmico determinante da eficácia clínica e bacteriológica da amoxicilina-clavulanato é a porcentagem do intervalo entre as doses durante a qual a concentração plasmática da droga livre excede a Concentração Inibitória Mínima do patógeno (% T > CIM). Tratados internacionais de farmacologia clínica (Ettinger 2024, Plumb’s 10ª ed.) determinam que a exposição ótima para betalactâmicos requer T > CIM de pelo menos 40% a 50% do intervalo posológico para cães e gatos. Por essa razão, intervalos prolongados de 24 horas são inadequados na rotina clínica de pequenos animais, devendo-se rigorosamente manter o fracionamento a cada 12 horas (q12h) para tecidos moles e trato urinário, ou a cada 8 horas (q8h) em sepse e infecções respiratórias graves.
                    - article [ref=f4e262]:
                      - heading "3 Tolerância gastrintestinal, apresentações comerciais e stewardship antimicrobiano" [level=4] [ref=f4e263]:
                        - generic [ref=f4e264]: "3"
                        - text: Tolerância gastrintestinal, apresentações comerciais e stewardship antimicrobiano
                      - generic [ref=f4e265]: O ácido clavulânico estimula a motilidade gastrintestinal por ação agonista direta sobre receptores da motilina, sendo a êmese e a diarreia osmótica transitória os efeitos adversos mais frequentemente relatados. A administração imediatamente antes ou junto com uma refeição reduz sensivelmente o desconforto gástrico sem comprometer a biodisponibilidade sistêmica. Na medicina veterinária, formulações orais veterinárias possuem proporção fixa de amoxicilina para clavulanato de 4:1, enquanto certas apresentações humanas utilizam proporções distintas (7:1 ou 8:1); a intercambialidade não deve ser feita sem ajuste rigoroso da dose de clavulanato para evitar toxicidade digestiva ou subdose. Dentro das diretrizes de Antimicrobial Stewardship da ISCAID, a amoxicilina-clavulanato é classificada como antibiótico de primeira linha essencial, devendo ser indicada com base em citologia e cultura/antibiograma.
