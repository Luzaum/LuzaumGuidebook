                    - listitem [ref=f2e290]: "Miltefosina: 2 mg/kg VO q24h por 28 dias, preferencialmente com alimento."
                    - listitem [ref=f2e291]: "Alopurinol: 10 mg/kg VO q12h por 6-12 meses; monitorar cristalúria e urolitíase por xantina."
                    - listitem [ref=f2e292]: Proteinúria, hipertensão e DRC exigem tratamento paralelo e podem modificar o protocolo.
                    - listitem [ref=f2e293]: Resposta clínica não equivale a cura parasitológica; recidiva é possível.
