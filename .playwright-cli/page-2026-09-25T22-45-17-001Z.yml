              - generic [ref=f2e130]:
                - paragraph [ref=f2e132]: As diretrizes Brasileish estruturam diagnóstico, estadiamento, tratamento e acompanhamento da leishmaniose visceral canina no contexto brasileiro. A doença pode variar de infecção subclínica a comprometimento sistêmico grave, com dermatopatia, linfadenomegalia, alterações oculares, anemia, hiperglobulinemia, proteinúria e doença renal. O diagnóstico combina epidemiologia, sinais, sorologia e demonstração do parasito ou material genético quando indicada.
                - paragraph [ref=f2e134]: O rim é determinante para prognóstico e escolha terapêutica. Creatinina/SDMA, urinálise, RPCU e pressão arterial devem ser avaliadas antes do protocolo e durante o seguimento. O tratamento reduz sinais e carga parasitária, mas não garante eliminação definitiva; controle vetorial e monitorização longitudinal continuam obrigatórios.
