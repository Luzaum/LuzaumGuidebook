      - main [ref=f6e99]:
        - paragraph [ref=f6e100]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=f6e102]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=f6e103]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=f6e104]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=f6e105]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=f6e106]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=f6e107]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=f6e108]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=f6e109]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=f6e110]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=f6e111]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=f6e112]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=f6e113]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=f6e114]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=f6e115]: própria.
        - paragraph [ref=f6e116]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=f6e117]: manter e quando repetir exames.
        - paragraph [ref=f6e119]: SINAIS PARA RETORNO
        - paragraph [ref=f6e121]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=f6e122]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=f6e123]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=f6e124]: apetite.
