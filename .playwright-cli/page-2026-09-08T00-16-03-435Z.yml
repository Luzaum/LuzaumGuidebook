      - main [ref=f3e98]:
        - paragraph [ref=f3e99]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=f3e101]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=f3e102]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=f3e103]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=f3e104]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=f3e105]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=f3e106]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=f3e107]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=f3e108]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=f3e109]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=f3e110]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=f3e111]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=f3e112]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=f3e113]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=f3e114]: própria.
        - paragraph [ref=f3e115]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=f3e116]: manter e quando repetir exames.
        - paragraph [ref=f3e118]: SINAIS PARA RETORNO
        - paragraph [ref=f3e120]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=f3e121]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=f3e122]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=f3e123]: apetite.
