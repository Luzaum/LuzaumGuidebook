        - paragraph [ref=e94]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=e96]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=e97]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=e98]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=e99]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=e100]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=e101]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=e102]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=e103]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=e104]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=e105]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=e106]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=e107]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=e108]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=e109]: própria.
        - paragraph [ref=e110]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=e111]: manter e quando repetir exames.
        - paragraph [ref=e113]: SINAIS PARA RETORNO
        - paragraph [ref=e115]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=e116]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=e117]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=e118]: apetite.
