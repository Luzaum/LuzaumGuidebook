- generic [ref=f2e1]:
  - main [ref=f2e3]:
    - generic [ref=f2e4]:
      - heading "Tabelas e figuras — Anemia" [level=1] [ref=f2e5]
      - generic [ref=f2e6]:
        - heading "Classificação Etiopatogênica Tridimensional das Anemias em Cães e Gatos" [level=3] [ref=f2e8]
        - generic [ref=f2e10]:
          - paragraph [ref=f2e11]: Classificação Etiopatogênica Tridimensional das Anemias em Cães e Gatos
          - generic [ref=f2e12]:
            - generic [ref=f2e13]:
              - generic [ref=f2e14]:
                - term [ref=f2e15]: Mecanismo Primário
                - definition [ref=f2e16]: Perda Sanguínea (Hemorragia)
              - generic [ref=f2e17]:
                - term [ref=f2e18]: Fisiopatogenia Central
                - definition [ref=f2e19]: Extravasamento físico de sangue total para fora da circulação; consumo concomitante de eritrócitos e proteínas plasmáticas.
              - generic [ref=f2e20]:
                - term [ref=f2e21]: Marcadores Laboratoriais Chave
                - definition [ref=f2e22]: Reticulocitose após 48 a 96 h; hipoproteinemia (TP e albumina baixas); microcitose e hipocromia em fases crônicas (ferropenia).
              - generic [ref=f2e23]:
                - term [ref=f2e24]: Exemplos Clínicos Típicos
                - definition [ref=f2e25]: Trauma, hemoabdome por hemangiossarcoma, úlcera gastroduodenal por AINEs, coagulopatia por rodenticida anticoagulante, parasitismo grave.
              - generic [ref=f2e26]:
                - term [ref=f2e27]: Conduta Terapêutica Imediata
                - definition [ref=f2e28]: Hemostasia cirúrgica ou compressiva de urgência; ressuscitação volêmica guiada por metas; concentrado de hemácias ou sangue total.
            - generic [ref=f2e29]:
              - generic [ref=f2e30]:
                - term [ref=f2e31]: Mecanismo Primário
                - definition [ref=f2e32]: Destruição Acelerada (Hemólise)
              - generic [ref=f2e33]:
                - term [ref=f2e34]: Fisiopatogenia Central
                - definition [ref=f2e35]: Encurtamento patológico da meia-vida eritrocitária por lise intravascular mediada por complemento ou fagocitose extravascular espleno-hepática.
              - generic [ref=f2e36]:
                - term [ref=f2e37]: Marcadores Laboratoriais Chave
                - definition [ref=f2e38]: Reticulocitose precoce e vigorosa; hiperbilirrubinemia; hemoglobinemia/hemoglobinúria (intravascular); esferócitos; corpos de Heinz; Coombs/SAT positivos.
              - generic [ref=f2e39]:
                - term [ref=f2e40]: Exemplos Clínicos Típicos
                - definition [ref=f2e41]: IMHA primária ou secundária; toxicose por paracetamol ou cebola/alho; micoplasmose felina (M. haemofelis); babesiose canina; microangiopatia/CID.
              - generic [ref=f2e42]:
                - term [ref=f2e43]: Conduta Terapêutica Imediata
                - definition [ref=f2e44]: Imunossupressão contemporânea (corticosteroides + segundo agente); remoção de agentes oxidantes; terapia anti-infecciosa direcionada; pRBC.
            - generic [ref=f2e45]:
              - generic [ref=f2e46]:
                - term [ref=f2e47]: Mecanismo Primário
                - definition [ref=f2e48]: Produção Inadequada / Ineficaz
              - generic [ref=f2e49]:
                - term [ref=f2e50]: Fisiopatogenia Central
                - definition [ref=f2e51]: Falência na síntese medular por carência hormonal (EPO), restrição biológica de ferro (hepcidina/AID), lesão de precursores ou infiltração neoplásica.
              - generic [ref=f2e52]:
                - term [ref=f2e53]: Marcadores Laboratoriais Chave
                - definition [ref=f2e54]: Anemia não regenerativa persistente (contagem absoluta de reticulócitos baixa); normocítica normocrômica (ou microcítica na ferropenia pura); TP normal/alta.
              - generic [ref=f2e55]:
                - term [ref=f2e56]: Exemplos Clínicos Típicos
                - definition [ref=f2e57]: Anemia de inflamação (AID); anemia associada à DRC; aplasia pura da série vermelha (PRCA); aplasia medular total; síndrome mielodisplásica (MDS).
              - generic [ref=f2e58]:
                - term [ref=f2e59]: Conduta Terapêutica Imediata
                - definition [ref=f2e60]: Controle estrito da doença inflamatória de base; darbepoetina ou molidustat (HIF-PHI) na DRC; suplementação de ferro se comprovada carência; imunossupressão na PRCA.
      - generic [ref=f2e61]:
        - heading "Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos" [level=3] [ref=f2e63]
        - generic [ref=f2e65]:
          - paragraph [ref=f2e66]: Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos
          - generic [ref=f2e67]:
            - generic [ref=f2e68]:
              - generic [ref=f2e69]:
                - term [ref=f2e70]: Parâmetro Biológico
                - definition [ref=f2e71]: Tipos e Dinâmica de Reticulócitos
              - generic [ref=f2e72]:
                - term [ref=f2e73]: Espécie Canina
                - definition [ref=f2e74]: População única homogênea de reticulócitos liberados; amadurecem no sangue em 24 a 48 horas.
              - generic [ref=f2e75]:
                - term [ref=f2e76]: Espécie Felina
                - definition [ref=f2e77]: "Dois tipos distintos: reticulócitos agregados (regeneração ativa imediata) e punctates (persistem semanas no sangue)."
              - generic [ref=f2e78]:
                - term [ref=f2e79]: Relevância na Conduta Clínica
                - definition [ref=f2e80]: Em gatos, quantificar exclusivamente os reticulócitos agregados (>50.000/uL) para avaliar resposta medular em tempo real.
            - generic [ref=f2e81]:
              - generic [ref=f2e82]:
                - term [ref=f2e83]: Parâmetro Biológico
                - definition [ref=f2e84]: Suscetibilidade à Lesão Oxidativa
              - generic [ref=f2e85]:
                - term [ref=f2e86]: Espécie Canina
                - definition [ref=f2e87]: Moderada; hemoglobina canina possui apenas 2 a 4 resíduos de sulfidrila reativos.
              - generic [ref=f2e88]:
                - term [ref=f2e89]: Espécie Felina
                - definition [ref=f2e90]: Altíssima; hemoglobina felina possui 8 resíduos de sulfidrila altamente reativos à oxidação.
              - generic [ref=f2e91]:
                - term [ref=f2e92]: Relevância na Conduta Clínica
                - definition [ref=f2e93]: Gatos desenvolvem corpos de Heinz e hemólise severa após exposição a paracetamol, benzocaína, propilenoglicol, cebola e alho.
            - generic [ref=f2e94]:
              - generic [ref=f2e95]:
                - term [ref=f2e96]: Parâmetro Biológico
                - definition [ref=f2e97]: Detecção Microscópica de Esferócitos
              - generic [ref=f2e98]:
                - term [ref=f2e99]: Espécie Canina
                - definition [ref=f2e100]: Excelente acurácia diagnóstica; eritrócitos caninos possuem ampla palidez central biconvexa evidente.
              - generic [ref=f2e101]:
                - term [ref=f2e102]: Espécie Felina
                - definition [ref=f2e103]: Excepcionalmente difícil; eritrócitos felinos são menores e fisiologicamente desprovidos de palidez central conspícua.
              - generic [ref=f2e104]:
                - term [ref=f2e105]: Relevância na Conduta Clínica
                - definition [ref=f2e106]: A ausência de visualização de esferócitos no esfregaço sanguíneo de felinos não afasta o diagnóstico de IMHA.
            - generic [ref=f2e107]:
              - generic [ref=f2e108]:
                - term [ref=f2e109]: Parâmetro Biológico
                - definition [ref=f2e110]: Sistema de Grupos Sanguíneos
              - generic [ref=f2e111]:
                - term [ref=f2e112]: Espécie Canina
                - definition [ref=f2e113]: Sistema DEA (DEA 1, 3, 4, 5, 7, Dal, Kai); não possuem aloanticorpos naturais de relevância clínica na primeira transfusão.
              - generic [ref=f2e114]:
                - term [ref=f2e115]: Espécie Felina
                - definition [ref=f2e116]: Sistema AB (tipo A, tipo B e o raro tipo AB); possuem aloanticorpos naturais pré-formados potentes desde o nascimento.
              - generic [ref=f2e117]:
                - term [ref=f2e118]: Relevância na Conduta Clínica
                - definition [ref=f2e119]: Cães toleram uma primeira transfusão sem tipagem DEA 1 prévia em emergência extrema; em gatos, a tipagem é MANDATÓRIA antes de 1 mL de sangue.
            - generic [ref=f2e120]:
              - generic [ref=f2e121]:
                - term [ref=f2e122]: Parâmetro Biológico
                - definition [ref=f2e123]: Reserva Esplênica e Hemoconcentração
              - generic [ref=f2e124]:
                - term [ref=f2e125]: Espécie Canina
                - definition [ref=f2e126]: Baço de grande capacidade muscular e armazenamento; contração esplênica induzida por catecolaminas eleva HCT em até 10 a 15%.
              - generic [ref=f2e127]:
                - term [ref=f2e128]: Espécie Felina
                - definition [ref=f2e129]: Baço com componente muscular tênue e menor capacidade volêmica de reservatório eritrocitário.
              - generic [ref=f2e130]:
                - term [ref=f2e131]: Relevância na Conduta Clínica
                - definition [ref=f2e132]: Trauma ou estresse agudo em cães mascaram perdas hemorrágicas expressivas pela contração esplênica transitória.
      - generic [ref=f2e133]:
