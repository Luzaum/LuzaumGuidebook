              - rowgroup [ref=f1e16]:
                - row [ref=f1e17]:
                  - columnheader "Mecanismo Primário" [ref=f1e18]
                  - columnheader "Fisiopatogenia Central" [ref=f1e19]
                  - columnheader "Marcadores Laboratoriais Chave" [ref=f1e20]
                  - columnheader "Exemplos Clínicos Típicos" [ref=f1e21]
                  - columnheader "Conduta Terapêutica Imediata" [ref=f1e22]
              - rowgroup [ref=f1e23]:
                - row [ref=f1e24]:
                  - cell "Perda Sanguínea (Hemorragia)" [ref=f1e25]
                  - cell "Extravasamento físico de sangue total para fora da circulação; consumo concomitante de eritrócitos e proteínas plasmáticas." [ref=f1e26]
                  - cell "Reticulocitose após 48 a 96 h; hipoproteinemia (TP e albumina baixas); microcitose e hipocromia em fases crônicas (ferropenia)." [ref=f1e27]
                  - cell "Trauma, hemoabdome por hemangiossarcoma, úlcera gastroduodenal por AINEs, coagulopatia por rodenticida anticoagulante, parasitismo grave." [ref=f1e28]
                  - cell "Hemostasia cirúrgica ou compressiva de urgência; ressuscitação volêmica guiada por metas; concentrado de hemácias ou sangue total." [ref=f1e29]
                - row [ref=f1e30]:
                  - cell "Destruição Acelerada (Hemólise)" [ref=f1e31]
                  - cell "Encurtamento patológico da meia-vida eritrocitária por lise intravascular mediada por complemento ou fagocitose extravascular espleno-hepática." [ref=f1e32]
                  - cell "Reticulocitose precoce e vigorosa; hiperbilirrubinemia; hemoglobinemia/hemoglobinúria (intravascular); esferócitos; corpos de Heinz; Coombs/SAT positivos." [ref=f1e33]
                  - cell "IMHA primária ou secundária; toxicose por paracetamol ou cebola/alho; micoplasmose felina (M. haemofelis); babesiose canina; microangiopatia/CID." [ref=f1e34]
                  - cell "Imunossupressão contemporânea (corticosteroides + segundo agente); remoção de agentes oxidantes; terapia anti-infecciosa direcionada; pRBC." [ref=f1e35]
                - row [ref=f1e36]:
                  - cell "Produção Inadequada / Ineficaz" [ref=f1e37]
                  - cell "Falência na síntese medular por carência hormonal (EPO), restrição biológica de ferro (hepcidina/AID), lesão de precursores ou infiltração neoplásica." [ref=f1e38]
                  - cell "Anemia não regenerativa persistente (contagem absoluta de reticulócitos baixa); normocítica normocrômica (ou microcítica na ferropenia pura); TP normal/alta." [ref=f1e39]
                  - cell "Anemia de inflamação (AID); anemia associada à DRC; aplasia pura da série vermelha (PRCA); aplasia medular total; síndrome mielodisplásica (MDS)." [ref=f1e40]
                  - cell "Controle estrito da doença inflamatória de base; darbepoetina ou molidustat (HIF-PHI) na DRC; suplementação de ferro se comprovada carência; imunossupressão na PRCA." [ref=f1e41]
    - generic [ref=f1e42]:
      - heading "Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos" [level=3] [ref=f1e44]
      - generic [ref=f1e46]:
        - paragraph [ref=f1e47]: Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos
        - region "Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos" [ref=f1e49]:
          - table "Peculiaridades Hematológicas e Fisiopatológicas Comparadas entre Cães e Gatos" [ref=f1e50]:
            - rowgroup [ref=f1e51]:
              - row [ref=f1e52]:
                - columnheader "Parâmetro Biológico" [ref=f1e53]
                - columnheader "Espécie Canina" [ref=f1e54]
                - columnheader "Espécie Felina" [ref=f1e55]
                - columnheader "Relevância na Conduta Clínica" [ref=f1e56]
            - rowgroup [ref=f1e57]:
              - row [ref=f1e58]:
                - cell "Tipos e Dinâmica de Reticulócitos" [ref=f1e59]
                - cell "População única homogênea de reticulócitos liberados; amadurecem no sangue em 24 a 48 horas." [ref=f1e60]
                - 'cell "Dois tipos distintos: reticulócitos agregados (regeneração ativa imediata) e punctates (persistem semanas no sangue)." [ref=f1e61]'
                - cell "Em gatos, quantificar exclusivamente os reticulócitos agregados (>50.000/uL) para avaliar resposta medular em tempo real." [ref=f1e62]
              - row [ref=f1e63]:
                - cell "Suscetibilidade à Lesão Oxidativa" [ref=f1e64]
                - cell "Moderada; hemoglobina canina possui apenas 2 a 4 resíduos de sulfidrila reativos." [ref=f1e65]
                - cell "Altíssima; hemoglobina felina possui 8 resíduos de sulfidrila altamente reativos à oxidação." [ref=f1e66]
                - cell "Gatos desenvolvem corpos de Heinz e hemólise severa após exposição a paracetamol, benzocaína, propilenoglicol, cebola e alho." [ref=f1e67]
              - row [ref=f1e68]:
                - cell "Detecção Microscópica de Esferócitos" [ref=f1e69]
                - cell "Excelente acurácia diagnóstica; eritrócitos caninos possuem ampla palidez central biconvexa evidente." [ref=f1e70]
                - cell "Excepcionalmente difícil; eritrócitos felinos são menores e fisiologicamente desprovidos de palidez central conspícua." [ref=f1e71]
                - cell "A ausência de visualização de esferócitos no esfregaço sanguíneo de felinos não afasta o diagnóstico de IMHA." [ref=f1e72]
              - row [ref=f1e73]:
                - cell "Sistema de Grupos Sanguíneos" [ref=f1e74]
                - cell "Sistema DEA (DEA 1, 3, 4, 5, 7, Dal, Kai); não possuem aloanticorpos naturais de relevância clínica na primeira transfusão." [ref=f1e75]
                - cell "Sistema AB (tipo A, tipo B e o raro tipo AB); possuem aloanticorpos naturais pré-formados potentes desde o nascimento." [ref=f1e76]
                - cell "Cães toleram uma primeira transfusão sem tipagem DEA 1 prévia em emergência extrema; em gatos, a tipagem é MANDATÓRIA antes de 1 mL de sangue." [ref=f1e77]
              - row [ref=f1e78]:
                - cell "Reserva Esplênica e Hemoconcentração" [ref=f1e79]
                - cell "Baço de grande capacidade muscular e armazenamento; contração esplênica induzida por catecolaminas eleva HCT em até 10 a 15%." [ref=f1e80]
                - cell "Baço com componente muscular tênue e menor capacidade volêmica de reservatório eritrocitário." [ref=f1e81]
                - cell "Trauma ou estresse agudo em cães mascaram perdas hemorrágicas expressivas pela contração esplênica transitória." [ref=f1e82]