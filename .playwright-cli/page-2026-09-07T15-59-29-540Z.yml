      - main [ref=f10e98]:
        - paragraph [ref=f10e99]: TRATAMENTOS OPCIONAIS
        - paragraph [ref=f10e101]: Selecione os blocos clínicos que deseja incluir nesta receita.
        - paragraph [ref=f10e103]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=f10e105]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=f10e106]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=f10e107]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=f10e108]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=f10e109]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=f10e110]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=f10e111]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=f10e112]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=f10e113]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=f10e114]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=f10e115]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=f10e116]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=f10e117]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=f10e118]: própria.
        - paragraph [ref=f10e119]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=f10e120]: manter e quando repetir exames.
        - paragraph [ref=f10e122]: SINAIS PARA RETORNO
        - paragraph [ref=f10e124]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=f10e125]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=f10e126]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=f10e127]: apetite.
