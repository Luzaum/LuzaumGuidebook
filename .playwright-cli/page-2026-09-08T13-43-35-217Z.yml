                  - heading "TESTE QA — Pancreatite felina — NÃO UTILIZAR" [level=1] [ref=e3798]
                  - main [ref=e3799]:
                    - paragraph [ref=e3800]: Com a seringa sem agulha fornecida pela equipe, colocar o volume prescrito entre a bochecha
                    - paragraph [ref=e3801]: e a gengiva. Não jogar no fundo da garganta nem misturar à comida.
                    - paragraph [ref=e3803]: Guardar trancado, longe de crianças e animais. Se ficar muito sonolento, difícil de acordar
                    - paragraph [ref=e3804]: ou com respiração lenta, procurar atendimento imediatamente.
                    - paragraph [ref=e3806]: RECOMENDAÇÕES DA DOENÇA
                    - paragraph [ref=e3808]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
                    - paragraph [ref=e3809]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
                    - paragraph [ref=e3810]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
                    - paragraph [ref=e3811]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
                    - paragraph [ref=e3812]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
                    - paragraph [ref=e3813]: para este gato, considerando também o intestino e o fígado.
                    - paragraph [ref=e3814]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
                    - paragraph [ref=e3815]: vomitando, muito fraco ou com dificuldade para engolir.
                    - paragraph [ref=e3816]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
                    - paragraph [ref=e3817]: comportamento. Levar essas informações no retorno.
                    - paragraph [ref=e3818]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
                    - paragraph [ref=e3819]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
                    - paragraph [ref=e3820]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
                    - paragraph [ref=e3821]: própria.
                    - paragraph [ref=e3822]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
                    - paragraph [ref=e3823]: manter e quando repetir exames.
                    - paragraph [ref=e3825]: SINAIS PARA RETORNO
                    - paragraph [ref=e3827]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
                    - paragraph [ref=e3828]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
                    - paragraph [ref=e3829]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
                    - paragraph [ref=e3830]: apetite.
                    - paragraph [ref=e3832]: Em caso de piora clínica, retornar ao hospital ou buscar serviço veterinário externo.
