                    - paragraph [ref=e3741]: USO ORAL
                    - paragraph [ref=e3743]:
                      - generic [ref=e3744]: 1. MAROPITANT — MANIPULADO — 4 mg/cápsula
                      - generic [ref=e3746]: Cápsulas
                    - paragraph [ref=e3748]: "Forma farmacêutica: cápsula."
                    - paragraph [ref=e3750]: Manipular cápsulas contendo 4 mg de maropitant por cápsula.
                    - paragraph [ref=e3752]: Administrar 1 cápsula por via por via oral, a cada 24 horas, durante 3 dias; reavaliar em
                    - paragraph [ref=e3753]: 24 a 48 horas.
                    - paragraph [ref=e3755]: Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a
                    - paragraph [ref=e3756]: dose sem falar com a equipe.
                    - paragraph [ref=e3758]: Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal
                    - paragraph [ref=e3759]: esteja conseguindo se alimentar.
                    - paragraph [ref=e3761]:
                      - generic [ref=e3762]: 2. ONDANSETRONA — VONAU VET — 4 mg/5 mL
                      - generic [ref=e3764]: Solução oral
                    - paragraph [ref=e3766]: Administrar 2,5 mL, por via oral, a cada 8 horas, durante 3 dias; reavaliar em 24 a 48
                    - paragraph [ref=e3767]: horas.
                    - paragraph [ref=e3769]: Pode ser oferecido com ou sem alimento. Anotar se há vômitos, salivação ou recusa da comida
                    - paragraph [ref=e3770]: e informar à equipe.
                    - paragraph [ref=e3772]: Se o animal não consegue engolir ou vomita tudo o que recebe, procurar atendimento para
                    - paragraph [ref=e3773]: mudar a forma de tratamento.
                    - paragraph [ref=e3775]: USO NA MUCOSA DA BOCA
                    - paragraph [ref=e3777]:
                      - generic [ref=e3778]: 3. BUPRENORFINA — BUPRENORFINA 0,3 MG/ML (TEMGESIC® / GENÉRICO) — 0,3 mg/mL
                      - generic [ref=e3780]: Solução injetável
                    - paragraph [ref=e3782]: Administrar 0,4 mL, por via mucosa oral, a cada 8 horas, durante 2 dias; reavaliar a dor em
                    - paragraph [ref=e3783]: até 24 horas.
