                  - complementary "Observações da receita" [ref=e2787]:
                    - generic [ref=e2791]:
                      - heading "Observações da receita" [level=4] [ref=e2792]
                      - paragraph [ref=e2793]: Informações de apoio clínico para o veterinário. Não aparecem na receita impressa nem no PDF.
                    - list [ref=e2794]:
                      - listitem [ref=e2795]: "Plumb’s Veterinary Drug Handbook, 10ª ed.: maropitant (PDF 826–829), ondansetron (983–985), buprenorfina (177–182), ursodiol (1314–1316)."
                      - listitem [ref=e2796]: Ettinger, 9ª ed. (2024), caps. 225, 277 e 278; PDF pp. 1400–1406 e 2018–2027. Nelson & Couto, 6ª ed., pancreatite, PDF pp. 650–665.
                      - listitem [ref=e2797]: "ACVIM 2021: pancreatite felina, doi:10.1111/jvim.16053 — https://academic.oup.com/jvim/article/35/2/703/8447048"
                      - listitem [ref=e2798]: Ambulatório apenas se estável, hidratado, com dor controlada, tolerância oral e retorno próximo. Dor relevante, hipoperfusão, desidratação ou vômitos persistentes requerem internação e analgesia titulável.
                      - listitem [ref=e2799]: Não incluir antibióticos, inibidores de ácido, enzimas pancreáticas ou corticoides rotineiramente na pancreatite aguda. Tratar indicação independente documentada; antibióticos para infecção/sepse, enzimas para insuficiência pancreática exócrina.
                      - listitem [ref=e2800]: "Maropitant não substitui opioide para analgesia. Ondansetrona: Plumb’s 10ª ed. sustenta intervalo q8–12h em cães e q6–12h em gatos; o intervalo q24–48h impresso no cap. 225 de Ettinger não foi adotado."
                      - listitem [ref=e2801]: "Buprenorfina convencional OTM 0,03 mg/kg q8h: Plumb’s 10ª ed., PDF p. 180. Reavaliar dor; não converter a posologia para apresentações concentradas/transdérmicas. Maropitant oral em gatos é extrabula."
                      - listitem [ref=e2802]: Não há benefício comprovado da restrição rotineira de gordura em gatos. Definir dieta conforme aceitação, necessidades e enteropatia concomitante.
                      - listitem [ref=e2803]: As durações iniciais são pontos de reavaliação do fluxo, não cursos universais comprovados para pancreatite; ajustar antes de emitir. Monitorar alimentação, dor, hidratação, eletrólitos e comorbidades.
                      - listitem [ref=e2804]: Confirmar função hepática, renal, idade, interações e possibilidade de administração oral. Não extrapolar o curso ambulatorial para paciente grave.
