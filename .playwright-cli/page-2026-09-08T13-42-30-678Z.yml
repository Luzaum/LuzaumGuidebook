                  - heading "TESTE QA — Pancreatite felina — NÃO UTILIZAR" [level=1] [ref=e2957]
                  - main [ref=e2056]:
                    - paragraph [ref=e2057]: Com a seringa sem agulha fornecida pela equipe, colocar o volume prescrito entre a bochecha
                    - paragraph [ref=e2857]: e a gengiva. Não jogar no fundo da garganta nem misturar à comida.
                    - paragraph [ref=e2060]: Guardar trancado, longe de crianças e animais. Se ficar muito sonolento, difícil de acordar
                    - paragraph [ref=e2061]: ou com respiração lenta, procurar atendimento imediatamente.
                    - paragraph [ref=e2858]: RECOMENDAÇÕES DA DOENÇA
                    - paragraph [ref=e2859]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
                    - paragraph [ref=e2860]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
                    - paragraph [ref=e2910]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
                    - paragraph [ref=e2862]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
                    - paragraph [ref=e2911]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
                    - paragraph [ref=e2864]: para este gato, considerando também o intestino e o fígado.
                    - paragraph [ref=e2865]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
                    - paragraph [ref=e2866]: vomitando, muito fraco ou com dificuldade para engolir.
                    - paragraph [ref=e2867]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
                    - paragraph [ref=e2912]: comportamento. Levar essas informações no retorno.
                    - paragraph [ref=e2869]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
                    - paragraph [ref=e2913]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
                    - paragraph [ref=e2914]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
                    - paragraph [ref=e2915]: própria.
                    - paragraph [ref=e2916]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
                    - paragraph [ref=e2917]: manter e quando repetir exames.
                    - paragraph [ref=e2919]: SINAIS PARA RETORNO
                    - paragraph [ref=e2921]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
                    - paragraph [ref=e2922]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
                    - paragraph [ref=e2923]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
                    - paragraph [ref=e2924]: apetite.
                    - paragraph [ref=e2926]: Em caso de piora clínica, retornar ao hospital ou buscar serviço veterinário externo.
