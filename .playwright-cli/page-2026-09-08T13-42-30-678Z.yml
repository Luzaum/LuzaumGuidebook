                    - paragraph [ref=e1961]:
                      - generic [ref=e2030]: 1. MAROPITANT — MANIPULADO — 4 mg/cápsula
                      - generic [ref=e2032]: Cápsulas
                    - paragraph [ref=e1963]: "Forma farmacêutica: cápsula."
                    - paragraph [ref=e1965]: Manipular cápsulas contendo 4 mg de maropitant por cápsula.
                    - paragraph [ref=e2806]: Administrar 1 cápsula por via por via oral, a cada 24 horas, durante 3 dias; reavaliar em
                    - paragraph [ref=e1968]: 24 a 48 horas.
                    - paragraph [ref=e2808]: Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a
                    - paragraph [ref=e1971]: dose sem falar com a equipe.
                    - paragraph [ref=e1973]: Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal
                    - paragraph [ref=e1974]: esteja conseguindo se alimentar.
                    - paragraph [ref=e1976]:
                      - generic [ref=e2849]: 2. ONDANSETRONA — VONAU VET — 4 mg/5 mL
                      - generic [ref=e2851]: Solução oral
                    - paragraph [ref=e1978]: Administrar 2,5 mL, por via oral, a cada 8 horas, durante 3 dias; reavaliar em 24 a 48
                    - paragraph [ref=e2039]: horas.
                    - paragraph [ref=e1981]: Pode ser oferecido com ou sem alimento. Anotar se há vômitos, salivação ou recusa da comida
                    - paragraph [ref=e1982]: e informar à equipe.
                    - paragraph [ref=e2040]: Se o animal não consegue engolir ou vomita tudo o que recebe, procurar atendimento para
                    - paragraph [ref=e1985]: mudar a forma de tratamento.
                    - paragraph [ref=e2042]: USO NA MUCOSA DA BOCA
                    - paragraph [ref=e2811]:
                      - generic [ref=e2902]: 3. BUPRENORFINA — BUPRENORFINA 0,3 MG/ML (TEMGESIC® / GENÉRICO) — 0,3 mg/mL
