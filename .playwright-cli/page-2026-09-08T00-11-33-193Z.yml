      - main [ref=e98]:
        - paragraph [ref=e99]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=e101]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=e102]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=e103]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=e104]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=e105]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=e106]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=e107]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=e108]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=e109]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=e110]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=e111]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=e112]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=e113]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=e114]: própria.
        - paragraph [ref=e115]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=e116]: manter e quando repetir exames.
        - paragraph [ref=e118]: SINAIS PARA RETORNO
        - paragraph [ref=e120]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=e121]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=e122]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=e123]: apetite.
