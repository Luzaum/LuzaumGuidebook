                - generic [ref=e905]:
                  - generic:
                    - text: USO ORAL 1. MAROPITANT — CERENIA - COMPRIMIDO (CÃO) — 16 mg/comprimido — Comprimidos
                    - button "Administrar ERRO DE DOSE P/ CONCENTRAÇÃO, por via oral, a cada 24 horas, durante 3 dias; reavaliar em 24 a 48 horas.. Mostrar motivo do erro de dose" [ref=e1034]: Administrar ERRO DE DOSE P/ CONCENTRAÇÃO, por via oral, a cada 24 horas, durante 3 dias; reavaliar em 24 a 48 horas.
                    - text: "Erro de dose: A apresentação escolhida exige 300,0% a mais de princípio ativo do que a dose calculada — risco de sobredose. Dose clínica:"
                    - button "1 comprimido (1 mg/kg). Mostrar cálculo da dose" [ref=e1035]: 1 comprimido (1 mg/kg)
                    - text: "Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a dose sem falar com a equipe. Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal esteja conseguindo se alimentar. RECOMENDAÇÕES DA DOENÇA • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare de vomitar, o animal ainda pode precisar de tratamento e acompanhamento. • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”. • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido para este gato, considerando também o intestino e o fígado. • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver vomitando, muito fraco ou com dificuldade para engolir. • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de comportamento. Levar essas informações no retorno. • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário. • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta própria. • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios manter e quando repetir exames. SINAIS PARA RETORNO Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa, postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do apetite."
                  - textbox "Corpo editável do documento" [ref=e906]:
                    - /placeholder: Digite o conteúdo clínico do documento.
                    - text: "USO ORAL 1. MAROPITANT — CERENIA - COMPRIMIDO (CÃO) — 16 mg/comprimido — Comprimidos Administrar ERRO DE DOSE P/ CONCENTRAÇÃO, por via oral, a cada 24 horas, durante 3 dias; reavaliar em 24 a 48 horas. Erro de dose: A apresentação escolhida exige 300,0% a mais de princípio ativo do que a dose calculada — risco de sobredose. Dose clínica: 1 comprimido (1 mg/kg) Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a dose sem falar com a equipe. Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal esteja conseguindo se alimentar. RECOMENDAÇÕES DA DOENÇA • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare de vomitar, o animal ainda pode precisar de tratamento e acompanhamento. • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”. • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido para este gato, considerando também o intestino e o fígado. • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver vomitando, muito fraco ou com dificuldade para engolir. • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de comportamento. Levar essas informações no retorno. • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário. • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta própria. • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios manter e quando repetir exames. SINAIS PARA RETORNO Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa, postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do apetite."
