      - main [ref=f7e98]:
        - paragraph [ref=f7e99]: TRATAMENTOS OPCIONAIS
        - paragraph [ref=f7e101]: Selecione os blocos clínicos que deseja incluir nesta receita.
        - paragraph [ref=f7e103]: RECOMENDAÇÕES DA DOENÇA
        - paragraph [ref=f7e105]: • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare
        - paragraph [ref=f7e106]: de vomitar, o animal ainda pode precisar de tratamento e acompanhamento.
        - paragraph [ref=f7e107]: • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando
        - paragraph [ref=f7e108]: a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”.
        - paragraph [ref=f7e109]: • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido
        - paragraph [ref=f7e110]: para este gato, considerando também o intestino e o fígado.
        - paragraph [ref=f7e111]: • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver
        - paragraph [ref=f7e112]: vomitando, muito fraco ou com dificuldade para engolir.
        - paragraph [ref=f7e113]: • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de
        - paragraph [ref=f7e114]: comportamento. Levar essas informações no retorno.
        - paragraph [ref=f7e115]: • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar
        - paragraph [ref=f7e116]: "vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário."
        - paragraph [ref=f7e117]: • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta
        - paragraph [ref=f7e118]: própria.
        - paragraph [ref=f7e119]: • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios
        - paragraph [ref=f7e120]: manter e quando repetir exames.
        - paragraph [ref=f7e122]: SINAIS PARA RETORNO
        - paragraph [ref=f7e124]: Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa,
        - paragraph [ref=f7e125]: postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade
        - paragraph [ref=f7e126]: para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do
        - paragraph [ref=f7e127]: apetite.
