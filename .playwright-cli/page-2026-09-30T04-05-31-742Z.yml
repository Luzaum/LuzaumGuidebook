        - generic [ref=f1e218]:
          - paragraph [ref=f1e219]: Fluxo Terapêutico Escalonado de UTI Canina (AAHA 2024 / IRIS 2026)
          - list "Fluxo Terapêutico Escalonado de UTI Canina (AAHA 2024 / IRIS 2026)" [ref=f1e220]:
            - listitem [ref=f1e221]:
              - generic [ref=f1e222]: "1"
              - generic [ref=f1e226]:
                - generic [ref=f1e227]:
                  - 'heading "Passo 1: Restauração da Euvolemia com Cristaloides Balanceados" [level=5] [ref=f1e228]'
                  - generic [ref=f1e229]: Primeiras 2 a 6 horas
                - paragraph [ref=f1e230]: Se o paciente estiver desidratado ou hipovolêmico, infundir cristaloides isotônicos balanceados (Ringer Lactato ou Plasma-Lyte 148). Em choque hipovolêmico, usar alíquotas de 10 a 20 mL/kg em 15-30 min com reavaliação contínua. Evitar salina a 0,9% de rotina para prevenir acidose hiperclorêmica.
            - listitem [ref=f1e231]:
              - generic [ref=f1e232]: "2"
              - generic [ref=f1e236]:
                - generic [ref=f1e237]:
                  - 'heading "Passo 2: Transição Rígida para a Regra de \"Ins and Outs\"" [level=5] [ref=f1e238]'
                  - generic [ref=f1e239]: Após atingir euvolemia
                - paragraph [ref=f1e240]: Assim que a euvolemia for alcançada, cessar infusões empíricas. O aporte hídrico de manutenção deve corresponder estritamente ao débito urinário horário medido mais perdas insensíveis (20 mL/kg/dia em cães) mais perdas contemporâneas por vômito e diarreia.
            - listitem [ref=f1e241]:
              - generic [ref=f1e242]: "3"
              - generic [ref=f1e246]:
                - generic [ref=f1e247]:
                  - 'heading "Passo 3: Manejo Emergencial da Hipercalemia Cardiotóxica" [level=5] [ref=f1e248]'
                  - generic [ref=f1e249]: Imediato se K+ elevado
                - paragraph [ref=f1e250]: "Se K+ > 6,5 mmol/L com alterações no ECG (ondas T altas, ausência de onda P, QRS alargado): administrar gluconato de cálcio 10% (0,5 a 1,0 mL/kg IV lento sob ECG), seguido de insulina regular (0,25 a 0,5 UI/kg IV) com 2 g de glicose por unidade de insulina e terbutalina."
            - listitem [ref=f1e251]:
              - generic [ref=f1e252]: "4"
              - generic [ref=f1e256]:
                - generic [ref=f1e257]:
                  - 'heading "Passo 4: Antibioticoterapia Guiada para Leptospirose" [level=5] [ref=f1e258]'
                  - generic [ref=f1e259]: Primeira hora após coleta
                - paragraph [ref=f1e260]: Iniciar ampicilina sódica (20 a 30 mg/kg IV q6-8h) em cães anoréxicos ou com vômitos. Assim que o trato gastrointestinal tolerar, fazer transição para doxiciclina oral (5 mg/kg q12h por 14 dias ininterruptos) para erradicar a colonização dos túbulos renais e o estado de portador.
            - listitem [ref=f1e261]:
              - generic [ref=f1e262]: "5"
              - generic [ref=f1e266]:
                - generic [ref=f1e267]:
                  - 'heading "Passo 5: Desafio Diurético Criterioso em Oligoanúria Euvolêmica" [level=5] [ref=f1e268]'
                  - generic [ref=f1e269]: Após confirmação de euvolemia
                - paragraph [ref=f1e270]: Se o paciente permanecer oligoanúrico (< 1 mL/kg/h) a despeito de comprovadamente euvolêmico, realizar desafio com furosemida (2 mg/kg IV em bólus; ou 0,5 a 1,0 mg/kg/h em CRI). Se não houver resposta em 2 a 4 horas, suspender a furosemida para evitar ototoxicidade e acúmulo.
            - listitem [ref=f1e271]:
              - generic [ref=f1e272]: "6"
              - generic [ref=f1e275]:
                - generic [ref=f1e276]:
                  - 'heading "Passo 6: Terapias de Purificação Extracorpórea (IHD / CRRT / DP)" [level=5] [ref=f1e277]'
                  - generic [ref=f1e278]: Primeiras 12 a 24 horas
                - paragraph [ref=f1e279]: Acionar serviço de terapia renal substitutiva (hemodiálise intermitente, CRRT ou diálise peritoneal) sem demora diante de anúria persistente, hipercalemia refratária, acidose metabólica grave incontrolável ou sobrecarga de volume (>= 5-10% do peso).