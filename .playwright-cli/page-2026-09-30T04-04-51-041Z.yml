        - generic [ref=f1e155]:
          - paragraph [ref=f1e156]: Fluxo Diagnóstico Sequencial na LRA Canina (Consenso IRIS 2026)
          - list "Fluxo Diagnóstico Sequencial na LRA Canina (Consenso IRIS 2026)" [ref=f1e157]:
            - listitem [ref=f1e158]:
              - generic [ref=f1e159]: "1"
              - generic [ref=f1e163]:
                - generic [ref=f1e164]:
                  - 'heading "Passo 1: Triagem de Volemia, Perfusão e Biomarcadores de Urgência" [level=5] [ref=f1e165]'
                  - generic [ref=f1e166]: Primeiros 15 a 30 minutos
                - paragraph [ref=f1e167]: Avaliar estado hemodinâmico, tempo de preenchimento capilar, pulsos e peso corporal basal. Coletar sangue para creatinina sérica, ureia, potássio, sódio, cloro, fósforo, hemograma completo e hemogasometria.
            - listitem [ref=f1e168]:
              - generic [ref=f1e169]: "2"
              - generic [ref=f1e173]:
                - generic [ref=f1e174]:
                  - 'heading "Passo 2: Urinálise Completa Pré-Fluido e Densidade Urinária" [level=5] [ref=f1e175]'
                  - generic [ref=f1e176]: Imediato (pré-fluido)
                - paragraph [ref=f1e177]: Colher amostra de urina estéril por cistocentese ou cateterismo antes de fluidos vigorosos. Avaliar densidade por refratometria (isostenúria 1.008-1.012 indica perda de capacidade de concentração), glicosúria normoglicêmica e sedimento com pesquisa de cilindros granulares e cristais.
            - listitem [ref=f1e178]:
              - generic [ref=f1e179]: "3"
              - generic [ref=f1e183]:
                - generic [ref=f1e184]:
                  - 'heading "Passo 3: POCUS Abdominal e Trato Urinário Completo" [level=5] [ref=f1e185]'
                  - generic [ref=f1e186]: Primeira hora
                - paragraph [ref=f1e187]: "Ultrassonografia renal e urinária focada: excluir causas pós-renais obstrutivas (urolitíase, dilatação de pelve > 2 mm, ruptura vesical/uroabdome). Avaliar ecogenicidade cortical, sinal do halo medular e tamanho renal (nefromegalia simétrica é típica de LRA)."
            - listitem [ref=f1e188]:
              - generic [ref=f1e189]: "4"
              - generic [ref=f1e193]:
                - generic [ref=f1e194]:
                  - 'heading "Passo 4: Investigação Etiológica Específica de Leptospirose" [level=5] [ref=f1e195]'
                  - generic [ref=f1e196]: Primeira hora de atendimento
                - paragraph [ref=f1e197]: Em todo cão com LRA de causa não estabelecida, coletar sangue total com EDTA e urina para PCR de Leptospira interrogans antes do antibiótico, e soro para teste de aglutinação microscópica (MAT). Instituir biossegurança de zoonose imediatamente.
            - listitem [ref=f1e198]:
              - generic [ref=f1e199]: "5"
              - generic [ref=f1e203]:
                - generic [ref=f1e204]:
                  - 'heading "Passo 5: Triagem Específica de Nefrotoxinas e AINEs" [level=5] [ref=f1e205]'
                  - generic [ref=f1e206]: Admissão
                - paragraph [ref=f1e207]: Anamnese minuciosa pesquisando ingestão de uvas frescas, uvas passas, anticongelante automotivo (etilenoglicol), lírios em residências com gatos, AINEs de uso humano ou veterinário, e picada de serpente botrópica/crotálica.
            - listitem [ref=f1e208]:
              - generic [ref=f1e209]: "6"
              - generic [ref=f1e212]:
                - generic [ref=f1e213]:
                  - 'heading "Passo 6: Sondagem Uretral Fechada e Mensuração Horária do Débito" [level=5] [ref=f1e214]'
                  - generic [ref=f1e215]: Primeiras 2 a 4 horas
                - paragraph [ref=f1e216]: Em pacientes com suspeita de oligúria, instalar sistema fechado de cateterismo vesical com bolsa coletora estéril e mensuração horária de urina. Classificar em Não-Oligúrico (>= 1,0 mL/kg/h) versus Oligoanúrico (< 1,0 mL/kg/h).