      - generic [ref=f1e12]:
        - paragraph [ref=f1e13]:
          - text: A cetamina é um
          - mark [ref=f1e14]: anestésico dissociativo
          - text: "e antagonista não competitivo dos receptores glutamatérgicos NMDA (N-metil-D-aspartato). Seu efeito varia profundamente de acordo com a dose e a via de administração:"
        - paragraph [ref=f1e15]: Em doses anestésicas (IV ou IM), promove dissociação talamocortical com analgesia somática intensa e catalepsia, mantendo parte dos reflexos de proteção de tronco encefálico. Em cães e gatos, deve ser sempre associada a sedativos ou relaxantes musculares (agonistas alfa-2, benzodiazepínicos ou propofol) para evitar rigidez muscular, tremores e despertar com disforia.
        - paragraph [ref=f1e16]:
          - text: Em doses subanestésicas (infusão contínua de 0,12 a 0,6 mg/kg/h), bloqueia a
          - mark [ref=f1e17]: somação temporal medular
          - text: (wind-up) e a sensibilização central, funcionando como potente analgésico preventivo que poupa opioides e reduz o consumo de anestésicos inalatórios. No
          - mark [ref=f1e18]: estado de mal epiléptico refratário
          - text: ", bloqueia os receptores NMDA externalizados na membrana sináptica após a perda de efeito dos benzodiazepínicos, interrompendo a excitotoxicidade celular."
