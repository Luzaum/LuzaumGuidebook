    - generic [ref=f1e158]:
      - heading "Pilares Terapêuticos Essenciais" [level=3] [ref=f1e159]
      - generic [ref=f1e160]:
        - generic [ref=f1e161]:
          - generic [ref=f1e162]: Bloqueio do Canal NMDA e Dissociação Talamocortical
          - paragraph [ref=f1e169]: Bloqueia o poro aberto do canal NMDA, desconectando as vias talamocorticais do sistema límbico com potente analgesia somática e amnésia.
        - generic [ref=f1e170]:
          - generic [ref=f1e171]: Modulação Anti-Hiperalgésica e Bloqueio de Wind-Up
          - paragraph [ref=f1e177]: Em infusão contínua subanestésica, extingue a somação temporal no corno dorsal medular, prevenindo a sensibilização central e reduzindo o consumo de opioides.
        - generic [ref=f1e178]:
          - generic [ref=f1e179]: Resgate no Estado de Mal Epiléptico Refratário
          - paragraph [ref=f1e189]: Bloqueia os receptores NMDA suprarregulados após a perda de eficácia dos benzodiazepínicos, contendo a excitotoxicidade cálcio-dependente.
        - generic [ref=f1e190]:
          - generic [ref=f1e191]: Perfil Hemodinâmico e Cuidados de Via Aérea
          - paragraph [ref=f1e197]: Mantém pressão e débito por estímulo simpático indireto em animais estáveis, mas pode descompensar o choque terminal. Exige atenção à laringe em felinos.
    - generic [ref=f1e198]:
      - generic [ref=f1e199]: Aviso Clínico Importante
      - generic [ref=f1e203]:
        - generic [ref=f1e204]:
          - generic [ref=f1e205]: "1"
          - paragraph [ref=f1e206]:
            - strong [ref=f1e207]: "Paradoxo cardiovascular (estímulo simpático versus choque descompensado):"
            - text: "Em pacientes com reservas adrenérgicas preservadas, a cetamina inibe a recaptação de catecolaminas, mantendo ou elevando moderadamente a pressão arterial e a frequência cardíaca. Contudo, possui efeito inotrópico negativo direto: em pacientes críticos em choque grave ou séptico com depleção simpática, pode precipitar colapso hemodinâmico imediato."
        - generic [ref=f1e208]:
          - generic [ref=f1e209]: "2"
          - paragraph [ref=f1e210]:
            - strong [ref=f1e211]: "Proibição de monoterapia anestésica em cães:"
            - text: A cetamina nunca deve ser administrada isoladamente como anestésico em cães. Provoca hipertonia muscular severa, rigidez extensora, mioclonias, convulsões e despertar com intensa disforia. É obrigatória a associação com benzodiazepínicos, agonistas alfa-2 ou propofol.
        - generic [ref=f1e212]:
          - generic [ref=f1e213]: "3"
          - paragraph [ref=f1e214]:
            - strong [ref=f1e215]: "Reflexos de via aérea, apneia e laringoespasmo em gatos:"
            - text: Embora mantenha a ventilação espontânea, a administração intravenosa rápida em bolus induz apneia temporária ou respiração apnêustica. A preservação de reflexos laríngeos não garante proteção de via aérea e pode deflagrar laringoespasmo em gatos — é indispensável instilar lidocaína tópica (0,1 mL a 2%) nas aritenoides antes da intubação.
        - generic [ref=f1e216]:
          - generic [ref=f1e217]: "4"
          - paragraph [ref=f1e218]:
            - strong [ref=f1e219]: "Diferença de potência entre Cetamina Racêmica e Escetamina S(+):"
            - text: A escetamina (enantiômero dextrógiro puro S+) possui afinidade 3 a 4 vezes maior pelo receptor NMDA e cerca do dobro da potência analgésica e anestésica da mistura racêmica. Ao utilizar apresentações de escetamina injetável, reduza a dose calculada em 30% a 50%.
        - generic [ref=f1e220]:
          - generic [ref=f1e221]: "5"
          - paragraph [ref=f1e222]:
            - strong [ref=f1e223]: "Vigilância hepática e urológica em infusões prolongadas:"
            - text: Infusões contínuas por períodos muito longos (>24 a 48 horas) podem elevar transaminases e fosfatase alcalina por estresse hepatocelular. O uso crônico repetido associa-se a cistite química e uropatia ulcerativa pela ação citotóxica direta de metabólitos no urotélio.