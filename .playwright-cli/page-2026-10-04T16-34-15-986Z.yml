    - note [ref=f2e28]:
      - paragraph [ref=f2e29]: "🥈 Padrão Ouro Internacional: Sonda MILA em Poliuretano"
      - paragraph [ref=f2e30]: "Fabricada pela MILA International, representa a referência global de dispositivos dedicados de esofagostomia veterinária: • Confeccionada em poliuretano termossensível (amolece à temperatura corporal, reduzindo trauma na mucosa esofágica); • Ponta cônica aberta atraumática com múltiplos orifícios laterais projetados para evitar entupimento; • Conector em \"Y\" removível (porta dupla para alimento e lavagem/medicação) e asa/flange de sutura deslizante; • Disponível nos tamanhos 10 Fr, 14 Fr e 18 Fr, compatível com os tunelizadores/introdutores cirúrgicos ETUN14 e ETUN18."
    - figure [ref=f2e31]:
      - button [ref=f2e32]:
