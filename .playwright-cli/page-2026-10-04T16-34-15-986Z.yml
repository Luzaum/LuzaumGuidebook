      - text: •
      - strong [ref=f2e44]: "Sondas Enterais em Poliuretano (ex.: Biobase TPU):"
      - text: Calibres variáveis conforme o modelo.
      - emphasis [ref=f2e45]: "Atenção:"
      - text: foram desenhadas para uso nasoentérico humano e frequentemente vêm com fio-guia metálico interno e peso distal metálico. Se usadas em esofagostomia veterinária, exigem avaliação criteriosa da ponta, nunca deixando pesos soltos no lúmen Biobase Sondas; •
