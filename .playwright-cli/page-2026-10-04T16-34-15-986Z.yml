    - note [ref=f2e69]:
      - paragraph [ref=f2e70]: Dispositivos que DEVEM SER EVITADOS como Primeira Escolha
      - paragraph [ref=f2e71]:
        - strong [ref=f2e72]: "1. Sonda Nasogástrica de Levine em PVC:"
        - text: Embora comum e de baixo custo, o PVC enrijece rapidamente em contato com os sucos gástricos e o calor corporal (geralmente após 7 a 10 dias), tornando-se duro, quebradiço e altamente ulcerogênico para o esôfago. Além disso, possui 125 cm de comprimento, sobrando metros de tubo fora do paciente.
        - strong [ref=f2e73]: "2. Cateteres Uretrais (Borracha Vermelha / Látex ou PVC):"
        - text: Desenvolvidos para drenagem vesical. O látex degrada-se rapidamente no trato digestório, apresenta alta citotoxicidade tecidual e pode provocar reações inflamatórias estomacais severas e ruptura do tubo.