  - generic [ref=f2e4]:
    - heading "10. Qual Sonda Usar no Brasil? 🇧🇷 (Dispositivos Comerciais)" [level=2] [ref=f2e5]
    - paragraph [ref=f2e6]: A medicina veterinária brasileira evoluiu significativamente. Não há mais qualquer justificativa técnica para improvisar sondas uretrais ou sondas nasogástricas humanas de PVC como primeira escolha para esofagostomias que permanecerão por semanas.
    - note [ref=f2e7]:
      - paragraph [ref=f2e8]: "🥇 Opção Veterinária Dedicada Nacional: Sonda Esofágica em Silicone (Tradevet Biomateriais)"
      - paragraph [ref=f2e9]:
        - text: A Tradevet Biomateriais comercializa no Brasil a
        - strong [ref=f2e10]: Sonda Esofágica em Silicone – Uso Veterinário
        - text: ", nos calibres"
        - strong [ref=f2e11]: 12, 14, 16, 18 e 20 Fr
        - text: . •
        - strong [ref=f2e12]: "Material:"
        - text: Silicone grau médico 100% biocompatível, ultra-flexível e macio, não endurece com o tempo; •
        - strong [ref=f2e13]: "Características:"
        - text: Linha radiopaca integral em toda a extensão para confirmação por raios X; ponta aberta arredondada e atraumática com 2 orifícios laterais alternados; marcações centimétricas nítidas; •
        - strong [ref=f2e14]: "Conector:"
        - text: Conexão proximal Luer Lock com tampa vedante, facilitando o acoplamento de seringas sem vazamentos; •
        - strong [ref=f2e15]: "Dimensões:"
        - text: Tubo de 12 Fr com 45 cm; 14 a 20 Fr com 60 cm (comprimento ajustável na inserção); •
        - strong [ref=f2e16]: "Esterilização:"
        - text: Esterilizada em óxido de etileno (ETO), pronta para uso cirúrgico.
