    - heading "Resumo Clínico Executivo" [level=2] [ref=f2e7]
    - generic [ref=f2e8]:
      - paragraph [ref=f2e9]: Em palavras simples
      - paragraph [ref=f2e13]: A amantadina é um fármaco singular na medicina de pequenos animais, originalmente concebido como agente antiviral e antiparkinsoniano na medicina humana, que foi reposicionado com grande relevância na rotina veterinária moderna como um adjuvante coanalgésico para o manejo multimodal da dor crônica refratária e de estados dolorosos com sensibilização central em cães e gatos. Seu mecanismo de ação principal baseia-se no antagonismo e modulação de baixa afinidade dos receptores NMDA no corno dorsal da medula espinhal, atuando como um gating antagonist que acelera o fechamento do canal iônico ativado pelo glutamato sem causar o bloqueio dissociativo profundo característico da cetamina, reduzindo assim o influxo patológico de cálcio e diminuindo o ganho ou volume do amplificador central que mantém a dor amplificada na forma de hiperalgesia e alodinia. Na prática clínica, a amantadina não funciona como um analgésico convencional de alívio rápido para dores agudas ou fraturas, demandando um período de latência de 7 a 21 dias de terapia contínua para remodelar a excitabilidade neuronal e demonstrar benefício funcional mensurável, sendo indicada primariamente em cães com osteoartrite não controlada adequadamente apenas com anti-inflamatórios não esteroidais, em afecções com componente neuropático como a estenose lombossacral degenerativa e em felinos com doença articular crônica selecionados. Sua depuração depende quase que exclusivamente da excreção renal do fármaco inalterado por filtração glomerular e secreção tubular ativa, sem depender expressivamente do metabolismo hepático ou da glicuronidação felina, o que exige cautela primordial e ajuste posológico cuidadoso em pacientes nefropatas para evitar o acúmulo e manifestações de neurotoxicidade como agitação, tremores e mioclonias, exigindo no território brasileiro prescrição privativa sob Receita de Controle Especial em duas vias em razão do seu enquadramento na Lista C1 da Portaria 344/98.
