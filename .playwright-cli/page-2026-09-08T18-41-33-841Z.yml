        - main [ref=f4e175]:
          - paragraph [ref=f4e176]: A síndrome vestibular idiopática felina é aguda e geralmente não progressiva, mas constitui
          - paragraph [ref=f4e235]: diagnóstico de exclusão. Alterações de outros nervos cranianos, déficits de posicionamento
          - paragraph [ref=f4e178]: das patas, redução da consciência ou nistagmo vertical indicam necessidade de investigação
          - paragraph [ref=f4e179]: intracraniana.
          - paragraph [ref=f4e181]: "Retornar imediatamente ou buscar serviço veterinário externo de emergência se ocorrer:"
          - paragraph [ref=f4e183]: • Piora progressiva.
          - paragraph [ref=f4e184]: • Rolamentos contínuos.
          - paragraph [ref=f4e185]: • Incapacidade de permanecer em posição esternal.
          - paragraph [ref=f4e186]: • Recusa completa de água e alimento.
          - paragraph [ref=f4e187]: • Vômitos persistentes.
          - paragraph [ref=f4e188]: • Dificuldade para engolir.
          - paragraph [ref=f4e189]: • Convulsões.
          - paragraph [ref=f4e190]: • Sonolência intensa.
          - paragraph [ref=f4e191]: • Fraqueza ou paralisia.
          - paragraph [ref=f4e192]: • Movimentos verticais dos olhos.
          - paragraph [ref=f4e193]: • Nistagmo que muda de direção.
          - paragraph [ref=f4e238]: • Dor intensa.
          - paragraph [ref=f4e239]: • Dificuldade respiratória.
          - paragraph [ref=f4e240]: • Incapacidade de fechar um dos olhos.
          - paragraph [ref=f4e241]: • Ausência de melhora clínica.
          - paragraph [ref=f4e242]: • Qualquer piora clínica.
