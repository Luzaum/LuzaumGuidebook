        - main [ref=f4e121]:
          - paragraph [ref=f4e122]: SÍNDROME VESTIBULAR — GATO
          - paragraph [ref=f4e124]: A síndrome vestibular felina provoca perda de equilíbrio, inclinação da cabeça, quedas,
          - paragraph [ref=f4e125]: rolamentos, desorientação, náusea e movimentos rápidos dos olhos. Em gatos, pode estar
          - paragraph [ref=f4e126]: associada a doença idiopática, pólipo, otite média ou interna, trauma, toxicidade,
          - paragraph [ref=f4e127]: deficiência nutricional, inflamação ou doença cerebral.
          - paragraph [ref=f4e129]: USO ORAL
          - paragraph [ref=f4e131]:
            - generic [ref=f4e132]: 1. MAROPITANT — MANIPULADO — 4 mg/cápsula
            - generic [ref=f4e134]: Cápsulas
          - paragraph [ref=f4e136]: "Forma farmacêutica: cápsula."
          - paragraph [ref=f4e138]: Manipular cápsulas contendo 4 mg de maropitant por cápsula.
          - paragraph [ref=f4e140]: Administrar 1 cápsula por via oral, a cada 24 horas, durante 3 a 5 dias.
          - paragraph [ref=f4e142]: RECOMENDAÇÕES
          - paragraph [ref=f4e144]: • Manter o gato exclusivamente dentro de casa.
          - paragraph [ref=f4e145]: • Colocar em ambiente pequeno, silencioso, acolchoado e sem locais altos.
          - paragraph [ref=f4e146]: • Retirar acesso a janelas, escadas, móveis, camas e prateleiras.
          - paragraph [ref=f4e147]: • Utilizar caixa de areia com bordas baixas.
          - paragraph [ref=f4e148]: • Colocar água e alimento próximos ao local de repouso.
          - paragraph [ref=f4e149]: • Preferir alimento úmido completo e palatável.
          - paragraph [ref=f4e150]: • Oferecer pequenas porções várias vezes ao dia.
          - paragraph [ref=f4e151]: • Não forçar alimentação se houver dificuldade para engolir ou alteração de consciência.
          - paragraph [ref=f4e152]: • Manter o gato limpo e seco após urinar ou defecar.
          - paragraph [ref=f4e153]: • Utilizar toalhas enroladas para formar barreiras acolchoadas ao redor do paciente.
          - paragraph [ref=f4e154]: • Evitar contenção excessiva, pois o movimento da cabeça pode piorar a náusea.
          - paragraph [ref=f4e233]: • Não aplicar produtos nos ouvidos sem avaliação veterinária.
          - paragraph [ref=f4e156]: • Não utilizar corticosteroides ou antibióticos automaticamente.
          - paragraph [ref=f4e157]: • Investigar pólipo nasofaríngeo, otite média ou interna, trauma, intoxicação e doença
          - paragraph [ref=f4e158]: cerebral quando indicado.
