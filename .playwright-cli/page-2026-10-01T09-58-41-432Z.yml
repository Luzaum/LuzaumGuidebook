      - group [ref=f2e175]:
        - generic "Quando complementar a investigação" [ref=f2e176] [cursor=pointer]
      - paragraph [ref=f2e177]: A aparência orienta hipóteses; sinais, exames e evolução definem sua relevância para o paciente. Os achados podem ocorrer em diferentes idades; o filtro de fase de vida se aplica às medidas acima.
