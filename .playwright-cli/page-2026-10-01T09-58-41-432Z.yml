      - generic [ref=f2e96]:
        - group [ref=f2e97]:
          - generic "Ecotextura grosseira / aspecto grosseiro / granular Os ecos parecem mais grossos; isso não significa automaticamente fibrose." [ref=f2e98] [cursor=pointer]:
            - text: Ecotextura grosseira / aspecto grosseiro / granular
            - generic [ref=f2e99]: Os ecos parecem mais grossos; isso não significa automaticamente fibrose.
          - generic [ref=f2e186]:
            - generic [ref=f2e187]:
              - heading "Como vejo no ultrassom" [level=5] [ref=f2e188]
              - paragraph [ref=f2e190]: A trama do fígado parece formada por ecos mais grossos ou granulação mais evidente. Observe se ela continua uniforme ou se há áreas diferentes, margens irregulares, nódulos e alterações dos vasos. Um fígado pode ser grosseiro e homogêneo; isso é diferente de ser heterogêneo. Compare com o baço em profundidade semelhante e com os mesmos ajustes.
            - generic [ref=f2e191]:
              - heading "Como a alteração se forma" [level=5] [ref=f2e192]
              - paragraph [ref=f2e194]: O aparelho envia pulsos e recebe ecos das diferenças de impedância acústica entre estruturas. No parênquima, muitos refletores menores que a resolução produzem dispersão; a interferência dos ecos gera a granulação (speckle), que não é uma fotografia de cada célula. Fibrose, nódulos regenerativos e infiltração podem mudar a distribuição dessas interfaces e criar textura irregular, mas frequência, foco, ganho e resolução também mudam a aparência. Gordura e outras alterações celulares podem coexistir. Portanto, “grosseiro” descreve o padrão dos ecos, sem confirmar fibrose ou indicar sozinho a gravidade.
            - generic [ref=f2e195]:
              - heading "Diferenciais" [level=5] [ref=f2e196]
              - generic [ref=f2e197]:
                - paragraph [ref=f2e198]: Hepatopatia crônica, fibrose, alterações nodulares ou infiltrativas; variação técnica e textura normal mais grosseira que a do baço.
                - group [ref=f2e200]:
                  - generic "Fibrose e cirrose · explicar mecanismo" [active] [ref=f2e201] [cursor=pointer]
                  - generic [ref=f2e206]:
                    - generic [ref=f2e207]:
                      - heading "Fisiopatologia e lesão" [level=5] [ref=f2e208]
                      - paragraph [ref=f2e210]: A agressão persistente ativa reparação e deposição de matriz extracelular. A fibrose remodela o órgão; na cirrose há distorção difusa da arquitetura e regeneração nodular, com possível aumento da resistência ao fluxo portal.
                    - generic [ref=f2e211]:
                      - heading "Por que produz este aspecto" [level=5] [ref=f2e212]
                      - paragraph [ref=f2e214]: Interfaces entre tecido preservado, septos e nódulos mudam a dispersão dos ecos, causando textura grosseira ou heterogênea. Retração pode produzir fígado pequeno e irregular; hipertensão portal pode acompanhar ascite e colaterais. Brilho e granulação não são uma medida direta da quantidade de colágeno.
                    - generic [ref=f2e215]:
                      - heading "Como relacionar com o paciente" [level=5] [ref=f2e216]
                      - paragraph [ref=f2e218]: Investigar história de hepatopatia, função de síntese, coagulação e circulação portal. Exames e amostragem quando indicada distinguem fibrose de outras causas de padrão semelhante.
            - generic [ref=f2e202]:
              - heading "O que o clínico deve pensar ao ler o laudo" [level=5] [ref=f2e203]
              - paragraph [ref=f2e205]: Ver homogeneidade, margens, tamanho, nódulos e vasos. Correlacionar enzimas, função hepática e evolução; o termo isolado não define causa nem gravidade.
