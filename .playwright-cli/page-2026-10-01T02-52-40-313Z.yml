                - paragraph [ref=e103]: BSAVA Ultrasonography, 1ª ed. · p. 3–6; 86–92 · PDF 15–18; 98–104
              - cell "A textura resulta da dispersão nas interfaces do tecido. Remodelamento pode mudar esse padrão, mas frequência, resolução e ajustes também mudam a granulação aparente." [ref=e104]
              - cell "Hepatopatia crônica, fibrose, alterações nodulares ou infiltrativas; variação técnica e textura normal mais grosseira que a do baço." [ref=e105]
              - cell "Ver homogeneidade, margens, tamanho, nódulos e vasos. Correlacionar enzimas, função hepática e evolução; o termo isolado não define causa nem gravidade." [ref=e106]
      - paragraph [ref=e183]: Síntese dos capítulos por órgão do BSAVA, relacionada aos princípios físicos do capítulo 1 (p. 1–9; PDF 13–21). Os mecanismos são correlações físico-patológicas plausíveis, não confirmação histológica. Diferenciais são possibilidades, sem ordem de probabilidade individual; o conjunto do exame e os dados clínicos orientam a investigação.
