        - status [ref=e86]: 1 de 10 padrões para cães. Catálogo dos padrões descritos nos capítulos consultados; não abrange todas as doenças possíveis. Idade, ciclo reprodutivo, raça e contexto aparecem quando ajudam a interpretar. O filtro de fase de vida acima se aplica às medidas, não torna estes padrões específicos de filhotes.
