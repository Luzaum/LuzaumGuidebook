        - paragraph [ref=e217]: 1ª edição · 2011 · Frances Barr e Lorrie Gaschen (editoras)
        - paragraph [ref=e218]: "Capítulo 1 (física da imagem) e capítulos 6–19 (órgãos): medidas, padrões de alterações e diferenciais. Página impressa e página do PDF indicadas nas referências."
      - article [ref=e219]:
        - paragraph [ref=e220]: Point-of-Care Ultrasound Techniques for the Small Animal Practitioner
