                - paragraph [ref=e248]: Registrar protocolo de medida e média final, classificar risco e pesquisar órgão-alvo. Em pacientes com doença tireoidiana ou adrenal, incluir pressão arterial e fundo de olho no fluxo. Tratar a causa de base quando possível e monitorar resposta pressórica sem reduzir a pressão de forma abrupta.
