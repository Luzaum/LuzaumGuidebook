              - generic [ref=e311]:
                - text: "C O N S E N S U S S T A T E M E N T Consensus Statements of the American College of Veterinary Internal Medicine (ACVIM) provide the veterinary community with up-to-date infor- mation on the pathophysiology, diagnosis, and treatment of clinically important animal diseases. The ACVIM Board of Regents oversees selection of relevant topics, identification of panel members with the expertise to draft the statements, and other aspects of assuring the integrity of the process. The statements are derived from evidence-based medicine whenever possible and the panel offers interpretive comments when such evidence is inadequate or contradictory. A draft is prepared by the panel, followed by solicitation of input by the ACVIM membership which may be incorporated into the statement. It is then submitted to the Journal of Veterinary Internal Medicine, where it is edited before publication. The authors are solely responsible for the content of the statements. ACVIM consensus statement: Guidelines for the identification, evaluation, and management of systemic hypertension in dogs and cats Mark J. Acierno 1 | Scott Brown 2 | Amanda E. Coleman 2 | Rosanne E. Jepson 3 | Mark Papich 4 | Rebecca L. Stepien 5 | Harriet M. Syme 3 1 Department of Medicine, College of Veterinary Medicine, Midwestern University, 5715 W. Utopia Rd, Glendale Arizona 85308 2 College of Veterinary Medicine, University of Georgia, Athens, Georgia 3 Department of Clinical Science and Services, Royal Veterinary College, London, United Kingdom 4 College of Veterinary Medicine, North Carolina State University, Raleigh, North Carolina 5 Department of Medical Sciences, University of Wisconsin School of Veterinary Medicine, Madison, Wisconsin Correspondence Mark J. Acierno, Department of Medicine, College of Veterinary Medicine, Midwestern University, 5715 W. Utopia Rd, Glendale AZ, 85308 Email: macier@midwestern.edu An update to the 2007 American College of Veterinary Internal Medicine (ACVIM) consensus statement on the identification, evaluation, and management of systemic hypertension in dogs and cats was presented at the 2017 ACVIM Forum in National Harbor, MD. The updated con- sensus statement is presented here. The consensus statement aims to provide guidance on appropriate diagnosis and treatment of hypertension in dogs and cats. K E Y W O R D S blood pressure, cardiology, cardiovascular, chronic renal failure, hemodynamics, hypertension, kidney, proteinuria, renal/urinary tract 1 | INTRODUCTION In 2000, a group of experts was convened to develop comprehensive guidelines for the identification and treatment of systemic hyperten- sion in cats and dogs. In 2007, the recommendations of this expert panel were published as the American College of Veterinary Internal Medicine (ACVIM) consensus statement on hypertension. Over the past 10 years, our understanding of normal systemic arterial blood pressure (BP) and systemic hypertension has expanded, but much remains to be discovered. It is our hope that these revised guidelines, Abbreviations: ACEi, angiotensin converting enzyme inhibitor; ARB, angiotensin II receptor blockers; BP, blood pressure; CCB, calcium channel blockers; CKD, chronic kidney disease; GFR, glomerular filtration rate; LVH, left ventricular hypertrophy; RAAS, renin-angiotensin-aldosterone system; SBP, systolic blood pressure; SDMA, symmetric dimethylarginine; TOD, target organ damage; UPC, urine protein to creatinine ratio; MRI, magnetic resonance imaging; IRIS, Inter- national Renal Interest Society; CNS, central nervous system; CRI, constant rate infusion Received: 1 August 2018 Accepted: 29 August 2018 DOI: 10.1111/jvim.15331 This is an open access article under the terms of the Creative Commons Attribution-NonCommercial License, which permits use, distribution and reproduction in any medium, provided the original work is properly cited and is not used for commercial purposes. © 2018 The Authors. Journal of Veterinary Internal Medicine published by Wiley Periodicals, Inc. on behalf of the American College of Veterinary Internal Medicine. J Vet Intern Med. 2018; 32: 1803 – 1822. wileyonlinelibrary.com/journal/jvim 1803"
                - generic [ref=e312]: Downloaded from https://academic.oup.com/jvim/article/32/6/1803/8471027 by guest on 29 July 2026
