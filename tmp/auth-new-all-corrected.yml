                - paragraph [ref=e4763]: Os campos destacados precisam ser preenchidos. Clique sobre “A PREENCHER” para substituí-lo.
                - paragraph [ref=e4764]: As doses em azul são apoio clínico e não aparecem na receita final. Passe o mouse para ver o cálculo da dose escolhida.
                - generic [ref=e4660]:
                  - generic:
                    - text: "USO ORAL 1. MAROPITANT — APRESENTAÇÃO:"
                    - mark [aria-hidden]: A PREENCHER
                    - text: "Administrar 4 mg por via oral, a cada 24 horas, durante 3 dias; reavaliar em 24 a 48 horas. Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a dose sem falar com a equipe. Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal esteja conseguindo se alimentar. Dose clínica:"
                    - button "1 mg/kg. Mostrar cálculo da dose" [ref=e4765]: 1 mg/kg
                    - text: "2. ONDANSETRONA — VONAU VET — 4 mg/5 mL — Solução oral Administrar 2,5 mL, por via oral, a cada 8 horas, durante 3 dias; reavaliar em 24 a 48 horas. Dose clínica:"
                    - button "2,5 mL (0,5 mg/kg). Mostrar cálculo da dose" [ref=e4806]: 2,5 mL (0,5 mg/kg)
                    - text: "Pode ser oferecido com ou sem alimento. Anotar se há vômitos, salivação ou recusa da comida e informar à equipe. Se o animal não consegue engolir ou vomita tudo o que recebe, procurar atendimento para mudar a forma de tratamento. USO NA MUCOSA DA BOCA 3. BUPRENORFINA — BUPRENORFINA 0,3 MG/ML (TEMGESIC® / GENÉRICO) — 0,3 mg/mL — Solução injetável Administrar 0,4 mL, por via mucosa oral, a cada 8 horas, durante 2 dias; reavaliar a dor em até 24 horas. Dose clínica:"
                    - button "0,4 mL (0,03 mg/kg). Mostrar cálculo da dose" [ref=e4829]: 0,4 mL (0,03 mg/kg)
                    - text: "Com a seringa sem agulha fornecida pela equipe, colocar o volume prescrito entre a bochecha e a gengiva. Não jogar no fundo da garganta nem misturar à comida. Guardar trancado, longe de crianças e animais. Se ficar muito sonolento, difícil de acordar ou com respiração lenta, procurar atendimento imediatamente. RECOMENDAÇÕES DA DOENÇA • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare de vomitar, o animal ainda pode precisar de tratamento e acompanhamento. • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”. • Não trocar automaticamente por alimento com pouca gordura. O alimento deve ser escolhido para este gato, considerando também o intestino e o fígado. • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver vomitando, muito fraco ou com dificuldade para engolir. • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de comportamento. Levar essas informações no retorno. • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário. • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta própria. • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios manter e quando repetir exames. SINAIS PARA RETORNO Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa, postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do apetite."
