              - generic [ref=f10e239]:
                - generic: "RECOMENDAÇÕES DA DOENÇA • O pâncreas está inflamado e isso pode causar dor, enjoo e falta de apetite. Mesmo que pare de vomitar, o animal ainda pode precisar de tratamento e acompanhamento. • Oferecer pequenas porções do alimento indicado pela equipe várias vezes ao dia, respeitando a quantidade diária prescrita. Não deixar em jejum para “descansar o pâncreas”. • Oferecer somente a dieta indicada. Evitar restos de comida, frituras, queijos, pele de frango e petiscos gordurosos. • Manter água fresca disponível. Não forçar água, comida ou remédio com seringa se estiver vomitando, muito fraco ou com dificuldade para engolir. • Anotar quanto comeu e bebeu, horários dos remédios, vômitos, fezes e mudanças de comportamento. Levar essas informações no retorno. • Se recusar as refeições ou comer muito menos, avisar à equipe no mesmo dia. Não esperar vários dias: pode ser necessário oferecer alimento por uma sonda colocada pelo veterinário. • Não dar remédios humanos para dor nem acrescentar antibióticos ou outros produtos por conta própria. • Reavaliar em 24 a 48 horas após a alta ou antes se piorar. A equipe definirá quais remédios manter e quando repetir exames. SINAIS PARA RETORNO Retornar diante de Vômitos repetidos ou incapacidade de manter água, Dor, barriga tensa, postura encurvada ou dificuldade para descansar, Fraqueza intensa, desmaio ou dificuldade para respirar, Olhos ou gengivas amarelados ou Recusa de alimento ou piora importante do apetite."
