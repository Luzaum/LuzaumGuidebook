          - paragraph [ref=f4e188]: • Nistagmo que muda de direção.
          - paragraph [ref=f4e189]: • Dor intensa.
          - paragraph [ref=f4e190]: • Dificuldade respiratória.
          - paragraph [ref=f4e191]: • Incapacidade de fechar um dos olhos.
          - paragraph [ref=f4e192]: • Ausência de melhora clínica.
