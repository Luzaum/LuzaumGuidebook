                  - main [ref=e1179]:
                    - paragraph [ref=e1180]: Com a seringa sem agulha fornecida pela equipe, colocar o volume prescrito entre a bochecha
                    - paragraph [ref=e1181]: e a gengiva. Não jogar no fundo da garganta nem misturar à comida.
                    - paragraph [ref=e1183]: Guardar trancado, longe de crianças e animais. Se ficar muito sonolento, difícil de acordar
