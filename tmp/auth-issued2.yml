                  - complementary "Observações da receita" [ref=e1116]:
                    - generic [ref=e1120]:
                      - heading "Observações da receita" [level=4] [ref=e1121]
                      - paragraph [ref=e1122]: Informações de apoio clínico para o veterinário. Não aparecem na receita impressa nem no PDF.
                    - list [ref=e1123]:
                      - listitem [ref=e1124]: "Plumb’s Veterinary Drug Handbook, 10ª ed.: maropitant (PDF 826–829), ondansetron (983–985), buprenorfina (177–182), ursodiol (1314–1316)."
                      - listitem [ref=e1125]: Ettinger, 9ª ed. (2024), caps. 225, 277 e 278; PDF pp. 1400–1406 e 2018–2027. Nelson & Couto, 6ª ed., pancreatite, PDF pp. 650–665.
                      - listitem [ref=e1126]: "ACVIM 2021: pancreatite felina, doi:10.1111/jvim.16053 — https://academic.oup.com/jvim/article/35/2/703/8447048"
                      - listitem [ref=e1127]: Ambulatório apenas se estável, hidratado, com dor controlada, tolerância oral e retorno próximo. Dor relevante, hipoperfusão, desidratação ou vômitos persistentes requerem internação e analgesia titulável.
                      - listitem [ref=e1128]: Não incluir antibióticos, inibidores de ácido, enzimas pancreáticas ou corticoides rotineiramente na pancreatite aguda. Tratar indicação independente documentada; antibióticos para infecção/sepse, enzimas para insuficiência pancreática exócrina.
                      - listitem [ref=e1129]: "Maropitant não substitui opioide para analgesia. Ondansetrona: Plumb’s 10ª ed. sustenta intervalo q8–12h em cães e q6–12h em gatos; o intervalo q24–48h impresso no cap. 225 de Ettinger não foi adotado."
                      - listitem [ref=e1130]: "Buprenorfina convencional OTM 0,03 mg/kg q8h: Plumb’s 10ª ed., PDF p. 180. Reavaliar dor; não converter a posologia para apresentações concentradas/transdérmicas. Maropitant oral em gatos é extrabula."
                      - listitem [ref=e1131]: Não há benefício comprovado da restrição rotineira de gordura em gatos. Definir dieta conforme aceitação, necessidades e enteropatia concomitante.
                      - listitem [ref=e1132]: As durações iniciais são pontos de reavaliação do fluxo, não cursos universais comprovados para pancreatite; ajustar antes de emitir. Monitorar alimentação, dor, hidratação, eletrólitos e comorbidades.
                      - listitem [ref=e1133]: Confirmar função hepática, renal, idade, interações e possibilidade de administração oral. Não extrapolar o curso ambulatorial para paciente grave.
