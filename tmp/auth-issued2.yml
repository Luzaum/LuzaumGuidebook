                    - paragraph [ref=e926]: USO ORAL
                    - paragraph [ref=e928]:
                      - generic [ref=e1135]: 1. MAROPITANT — MANIPULADO — 4 mg/cápsula
                      - generic [ref=e1137]: Cápsulas
                    - paragraph [ref=e930]: "Forma farmacêutica: cápsula."
                    - paragraph [ref=e932]: Manipular cápsulas contendo 4 mg de maropitant por cápsula.
                    - paragraph [ref=e1141]: Administrar 1 cápsula por via oral, a cada 24 horas, durante 3 dias; reavaliar em 24 a 48
                    - paragraph [ref=e935]: horas.
                    - paragraph [ref=e1143]: Oferecer com pequena quantidade de alimento. Se vomitar após a medicação, não repetir a
                    - paragraph [ref=e938]: dose sem falar com a equipe.
                    - paragraph [ref=e940]: Este remédio reduz o vômito, mas não substitui o tratamento da dor nem garante que o animal
                    - paragraph [ref=e941]: esteja conseguindo se alimentar.
                    - paragraph [ref=e943]:
                      - generic [ref=e1146]: 2. ONDANSETRONA — VONAU VET — 4 mg/5 mL
                      - generic [ref=e1148]: Solução oral
                    - paragraph [ref=e1150]: Administrar 2,5 mL, por via oral, a cada 8 horas, durante 3 dias; reavaliar em 24 a 48
                    - paragraph [ref=e1151]: horas.
                    - paragraph [ref=e1153]: Pode ser oferecido com ou sem alimento. Anotar se há vômitos, salivação ou recusa da comida
                    - paragraph [ref=e949]: e informar à equipe.
                    - paragraph [ref=e1155]: Se o animal não consegue engolir ou vomita tudo o que recebe, procurar atendimento para
                    - paragraph [ref=e1156]: mudar a forma de tratamento.
                    - paragraph [ref=e1158]: USO NA MUCOSA DA BOCA
                    - paragraph [ref=e1160]:
                      - generic [ref=e1161]: 3. BUPRENORFINA — BUPRENORFINA 0,3 MG/ML (TEMGESIC® / GENÉRICO) — 0,3 mg/mL
                      - generic [ref=e1163]: Solução injetável
                    - paragraph [ref=e1165]: Administrar 0,4 mL, por via mucosa oral, a cada 8 horas, durante 2 dias; reavaliar a dor em
                    - paragraph [ref=e1166]: até 24 horas.
