name: quality-gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality-gate:
    name: Build and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, TypeScript and database payloads
        run: npm run lint

      - name: Clinical calculator validations
        run: |
          npm run validate:hemogasovet
          npm run validate:fluidoterapia-vet

      - name: Build
        run: npm run build

      - name: Regression tests and distributed clinical assets
        run: npm test
